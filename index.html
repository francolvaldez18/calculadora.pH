<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora pH</title>
  <style>
    :root {
      --overlay-color: rgba(255, 255, 255, 0.76);
      --panel-color: rgba(255, 255, 255, 0.86);
      --text-primary: #093a63;
      --text-secondary: #325f83;
      --button-text: #ffffff;
      --button-bg: #0d6eaa;
      --button-bg-hover: #1285cb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
      color: var(--text-primary);
      background-color: #e9edf2;
      display: grid;
      place-items: center;
      padding: 1rem;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: var(--overlay-color);
      pointer-events: none;
    }

    .content {
      width: min(900px, 100%);
      background: var(--panel-color);
      border: 1px solid rgba(73, 119, 153, 0.2);
      border-radius: 20px;
      padding: clamp(1.5rem, 5vw, 3rem);
      box-shadow: 0 18px 35px rgba(9, 58, 99, 0.12);
      position: relative;
      z-index: 1;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      margin: 0 0 1.25rem;
      text-align: center;
      color: var(--text-primary);
    }

    .button-stack {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .language-button,
    .task-button,
    .next-button {
      border: none;
      border-radius: 12px;
      padding: 0.95rem 1rem;
      font-weight: 700;
      color: var(--button-text);
      background: linear-gradient(180deg, var(--button-bg-hover), var(--button-bg));
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      transition: filter 0.2s ease;
    }

    .language-button:hover,
    .task-button:hover,
    .next-button:hover:enabled {
      filter: brightness(1.05);
    }

    .language-button.active,
    .task-button.active {
      background: linear-gradient(180deg, #0f8adb, #0a5f96);
    }

    .next-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: none;
    }

    .field {
      margin-bottom: 0.9rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    input {
      width: 100%;
      border: 1px solid rgba(73, 119, 153, 0.35);
      border-radius: 10px;
      padding: 0.75rem;
      font: inherit;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.95);
    }
  </style>
</head>
<body>
  <main class="content">
    <section id="screen-language" class="screen active">
      <h1 id="title-language">Selecciona el idioma</h1>
      <div class="button-stack" id="language-options">
        <button class="language-button" data-language="es">Español</button>
        <button class="language-button" data-language="en">English</button>
        <button class="language-button" data-language="ko">한국어</button>
      </div>
      <button id="btn-language-next" class="next-button" disabled>Siguiente</button>
    </section>

    <section id="screen-task" class="screen">
      <h1 id="title-task">Selecciona la tarea</h1>
      <div class="button-stack" id="task-options">
        <button class="task-button" data-task="effluent_reception">Recepción de Efluentes</button>
        <button class="task-button" data-task="tank_conditioning">Acondicionamiento de la pileta</button>
      </div>
      <button id="btn-task-next" class="next-button" disabled>Siguiente</button>
    </section>

    <section id="screen-pool-status" class="screen">
      <h1 id="title-pool-status">Estado de la pileta WWB</h1>
      <div class="field">
        <label id="label-level" for="pool-level">Nivel</label>
        <input id="pool-level" type="number" step="0.01" />
      </div>
      <div class="field">
        <label id="label-ph" for="pool-ph">pH de la pileta</label>
        <input id="pool-ph" type="number" step="0.01" />
      </div>
    </section>
  </main>

  <script>
    let selectedLanguage = null;
    let selectedTask = null;

    const i18n = {
      es: {
        languageTitle: 'Selecciona el idioma',
        languageNext: 'Siguiente',
        taskTitle: 'Selecciona la tarea',
        task1: 'Recepción de Efluentes',
        task2: 'Acondicionamiento de la pileta',
        taskNext: 'Siguiente',
        poolTitle: 'Estado de la pileta WWB',
        levelLabel: 'Nivel',
        phLabel: 'pH de la pileta'
      },
      en: {
        languageTitle: 'Select language',
        languageNext: 'Next',
        taskTitle: 'Select the task',
        task1: 'Effluent Reception',
        task2: 'Tank Conditioning',
        taskNext: 'Next',
        poolTitle: 'WWB Pool Status',
        levelLabel: 'Level',
        phLabel: 'Pool pH'
      },
      ko: {
        languageTitle: '언어 선택',
        languageNext: '다음',
        taskTitle: '작업 선택',
        task1: '폐수 수령',
        task2: '조정조 컨디셔닝',
        taskNext: '다음',
        poolTitle: 'WWB 조 상태',
        levelLabel: '수위',
        phLabel: '조 pH'
      }
    };

    const screens = {
      language: document.getElementById('screen-language'),
      task: document.getElementById('screen-task'),
      poolStatus: document.getElementById('screen-pool-status')
    };

    const languageButtons = document.querySelectorAll('.language-button');
    const taskButtons = document.querySelectorAll('.task-button');
    const languageNextButton = document.getElementById('btn-language-next');
    const taskNextButton = document.getElementById('btn-task-next');

    function showScreen(screenKey) {
      Object.values(screens).forEach((screen) => screen.classList.remove('active'));
      screens[screenKey].classList.add('active');
    }

    function applyTranslations() {
      const t = i18n[selectedLanguage || 'es'];
      document.getElementById('title-language').textContent = t.languageTitle;
      languageNextButton.textContent = t.languageNext;
      document.getElementById('title-task').textContent = t.taskTitle;
      taskButtons[0].textContent = t.task1;
      taskButtons[1].textContent = t.task2;
      taskNextButton.textContent = t.taskNext;
      document.getElementById('title-pool-status').textContent = t.poolTitle;
      document.getElementById('label-level').textContent = t.levelLabel;
      document.getElementById('label-ph').textContent = t.phLabel;
    }

    languageButtons.forEach((button) => {
      button.addEventListener('click', () => {
        languageButtons.forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        selectedLanguage = button.dataset.language;
        languageNextButton.disabled = false;
        applyTranslations();
      });
    });

    taskButtons.forEach((button) => {
      button.addEventListener('click', () => {
        taskButtons.forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        selectedTask = button.dataset.task;
        taskNextButton.disabled = false;
      });
    });

    languageNextButton.addEventListener('click', () => {
      if (!selectedLanguage) {
        return;
      }
      showScreen('task');
    });

    taskNextButton.addEventListener('click', () => {
      if (!selectedTask) {
        return;
      }
      showScreen('poolStatus');
    });

    applyTranslations();
  </script>
</body>
</html>

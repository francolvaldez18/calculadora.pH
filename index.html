<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora pH</title>
    <style>
      :root { --overlay-color: rgba(255,255,255,.76); --panel-color: rgba(255,255,255,.88); --text-primary:#093a63; --text-secondary:#325f83; --button-bg:#0d6eaa; --button-bg-hover:#1285cb; --border:rgba(73,119,153,.25); --danger:#b8302d; --warning:#9b6200; --font-bump:0px; --ui-compact:0.82; }
      *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:"Segoe UI","Roboto",Arial,sans-serif;color:var(--text-primary);background:#e9edf2}
      .app-screen{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(1rem * var(--ui-compact)) calc(1.25rem * var(--ui-compact)) calc(1.6rem * var(--ui-compact));overflow:hidden}
      .background-image{position:absolute;inset:0;z-index:-3;background:radial-gradient(circle at 20% 20%, rgba(13,110,170,.12), transparent 35%),radial-gradient(circle at 80% 40%, rgba(13,110,170,.08), transparent 38%),linear-gradient(180deg,#f5f7fa 0%,#e8edf3 100%)}
      .background-logo{position:absolute;inset:0;z-index:-2;opacity:.12;background:none}
      .overlay{position:absolute;inset:0;background:var(--overlay-color);z-index:-1}
      .top-logo{position:relative;width:min(calc(225px * var(--ui-compact)),50vw);max-height:calc(80px * var(--ui-compact));object-fit:contain;mix-blend-mode:multiply;filter:drop-shadow(0 3px 6px rgba(5,43,72,.1));z-index:2;pointer-events:none;margin:0 0 .45cm}
      .below-work-row{width:min(840px,100%);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:.45rem;position:relative;z-index:2}
      .flags-row{display:flex;align-items:center;justify-content:center;gap:1cm;margin:0}
      .flag-img{width:min(86px,19vw);height:auto;border-radius:4px;border:1px solid rgba(73,119,153,.25);box-shadow:0 3px 8px rgba(9,58,99,.12)}
      .content{position:relative;z-index:1;width:min(840px,100%);background:var(--panel-color);border:1px solid var(--border);border-radius:18px;padding:clamp(1rem,2.1vw,1.45rem);box-shadow:0 10px 20px rgba(9,58,99,.08);text-align:left}
      .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.tab{border:1px solid rgba(13,110,170,.25);padding:7px 11px;border-radius:999px;font-size:calc(.84rem + var(--font-bump));color:var(--text-secondary);font-weight:600;background:rgba(255,255,255,.75)}.tab.active{color:var(--button-bg);background:rgba(13,110,170,.13);border-color:rgba(13,110,170,.42)}
      .screen{display:none}.screen.active{display:block} h3{margin:0 0 10px;font-size:calc(.84rem + var(--font-bump))}
      .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .field{display:flex;flex-direction:column;gap:5px} label{font-size:calc(.84rem + var(--font-bump));color:var(--text-secondary);font-weight:600}
      input,select{border:1px solid rgba(73,119,153,.28);border-radius:10px;padding:7px 8px;background:#fff;color:var(--text-primary);width:100%;transition:background-color .18s ease,border-color .18s ease}
      .readonly-output{border:none;border-radius:12px;padding:.68rem .9rem;font-size:calc(.84rem + var(--font-bump));font-weight:700;color:#fff;background:linear-gradient(180deg,var(--button-bg-hover),var(--button-bg));width:100%;text-align:left;box-shadow:0 8px 16px rgba(9,58,99,.2);opacity:.9}.readonly-output:disabled{cursor:default;opacity:1;color:#fff}
      .input-empty{background:rgba(255, 243, 205, .55);border-color:rgba(211,158,0,.5)}
      .input-valid{background:rgba(198, 239, 206, .55);border-color:rgba(91, 161, 85, .55)}
      .input-invalid{border:2px solid var(--danger);background:rgba(255, 199, 206, .55)}.btn{border:none;border-radius:12px;padding:.68rem .9rem;font-size:calc(.84rem + var(--font-bump));font-weight:700;color:#fff;background:linear-gradient(180deg,var(--button-bg-hover),var(--button-bg));cursor:pointer;box-shadow:0 8px 16px rgba(9,58,99,.2)}.btn:disabled{opacity:.55;cursor:not-allowed}
      .choice-buttons{display:grid;grid-template-columns:repeat(2,minmax(140px,1fr));gap:.8rem}.mode-choices{grid-template-columns:repeat(3,minmax(120px,1fr));}.added-chip{background:linear-gradient(180deg,#1285cb,#0d6eaa);color:#fff;border-color:#0d6eaa}.added-chip b{color:#fff;font-size:1.1rem}.inverted-block,#additionCard{background:linear-gradient(180deg,#1285cb,#0d6eaa)!important;border-color:#0d6eaa!important;color:#fff!important}#additionCard h4{font-size:calc(.95rem + var(--font-bump));margin-bottom:10px;color:#fff!important}#additionCard .metric-chip,#additionCard .metric-chip b,#additionCard .plus-center{color:#fff!important}#additionCard .metric-chip{font-size:calc(.86rem + var(--font-bump))}#additionCard .metric-chip{background:rgba(255,255,255,.16)!important;border-color:rgba(255,255,255,.45)!important}#additionCard .card{background:rgba(255,255,255,.12)!important;border-color:rgba(255,255,255,.45)!important}.choice-button{border:2px solid #0d6eaa;border-radius:12px;padding:.78rem .88rem;font-size:clamp(.88rem,1.45vw,.96rem);font-weight:800;color:#0d6eaa;background:#fff;box-shadow:0 5px 10px rgba(9,58,99,.12);cursor:pointer;text-align:center;min-height:54px}.choice-button.active{background:linear-gradient(180deg,#1285cb,#0d6eaa);color:#fff}
      .card{border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.84);padding:11px}.card h4{margin:0 0 6px;font-size:calc(.84rem + var(--font-bump));color:var(--button-bg)}.dose-card{text-align:center;margin-top:10px}.dose-card h4{display:none}.dose-type{font-size:calc(1.05rem + var(--font-bump));font-weight:700;color:var(--text-secondary)}.dose-value{font-size:1.85rem;font-weight:800;color:var(--button-bg);line-height:1.2}
      .kpi{margin-top:10px;border:1px solid rgba(13,110,170,.35);border-radius:12px;background:rgba(13,110,170,.1);padding:12px}.kpi-label{font-size:calc(.84rem + var(--font-bump));color:var(--text-secondary)}.kpi-value{font-size:1.35rem;font-weight:800;color:var(--button-bg)}
      .notice{margin-top:8px;font-size:calc(.88rem + var(--font-bump));color:var(--text-secondary);text-align:left}.error{margin-top:6px;font-size:calc(.85rem + var(--font-bump));color:var(--danger);text-align:left}.warn{color:var(--warning);font-weight:700}
      .welcome-main{text-align:left;padding:clamp(.35rem,1.2vw,.7rem) 0}.welcome-main h2{margin:0;text-align:center;font-size:clamp(1rem,1.75vw,1.5rem);line-height:1.35}.welcome-description{margin:.75rem auto 0;max-width:70ch;text-align:center;color:var(--text-secondary);font-size:clamp(.78rem,1.02vw,.9rem);line-height:1.55}.language-label{margin-top:1rem;margin-bottom:.75rem;font-weight:600;color:#174e78;font-size:clamp(1rem,1.8vw,1.2rem);text-align:left}
      .language-buttons{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:.9rem}.language-button{border:2px solid #0d6eaa;border-radius:12px;padding:.78rem .88rem;font-size:clamp(.88rem,1.7vw,.98rem);font-weight:800;color:#0d6eaa;background:#fff;box-shadow:0 8px 16px rgba(9,58,99,.2);cursor:pointer}.language-button.active{background:linear-gradient(180deg,#1285cb,#0d6eaa);color:#fff}
      .welcome-actions{margin-top:.9rem;display:flex;justify-content:center}.welcome-next{min-width:min(280px,100%)} .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.settings-panel{display:none;margin-top:10px}.settings-panel.open{display:block}
      .effluent-item{margin-top:12px;padding:10px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.65)}
      .nav{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px}.nav-right{display:flex;gap:8px}.btn-summary{display:none}.results-flow{display:grid;gap:10px;margin-top:10px}.metric-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.metric-chip{border:1px solid rgba(13,110,170,.34);border-radius:10px;background:rgba(255,255,255,.82);padding:.6rem .65rem;text-align:center;font-size:calc(.78rem + var(--font-bump));line-height:1.3}.metric-chip b{display:block;color:var(--button-bg);font-size:calc(.88rem + var(--font-bump));margin-top:.15rem}.mode-hints{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:8px;margin-top:6px}.mode-hint{font-size:calc(.74rem + var(--font-bump));text-align:center;color:var(--text-secondary)}.target-ph-buttons{display:grid;grid-template-columns:repeat(3,minmax(100px,1fr));gap:8px}.target-ph-note{font-size:calc(.72rem + var(--font-bump));color:var(--text-secondary);text-align:center}.mode-hint.recommended{color:#0b6c36;font-weight:800;text-transform:uppercase}.mode-hint.unavailable{color:var(--danger);font-weight:700}.metric-chips{width:100%}.strategy-top{grid-template-columns:repeat(3,minmax(0,1fr))}.strategy-bottom{grid-template-columns:minmax(150px,220px) 1fr;align-items:end}.combined-split{display:grid;grid-template-columns:1fr;gap:8px;align-items:stretch}.plus-center{display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;color:var(--button-bg)}.summary-list{display:grid;gap:2px}.summary-row{display:grid;grid-template-columns:minmax(140px,190px) 1fr;gap:8px;padding:2px 0;border-bottom:1px solid rgba(73,119,153,.12)}.summary-row:last-child{border-bottom:none}.summary-key{font-weight:700;color:var(--text-secondary)}.summary-copy-status{margin-right:auto;font-size:calc(.76rem + var(--font-bump));color:var(--text-secondary)}#summaryBody{font-size:calc(.74rem + var(--font-bump));line-height:1.28}.summary-compact .card{padding:8px 10px}
      .developer-launch{display:flex;justify-content:flex-end;justify-self:end;align-items:center;gap:.45rem}
      .developer-btn{border:1px solid rgba(13,110,170,.35);border-radius:10px;padding:.42rem .8rem;background:rgba(255,255,255,.82);color:var(--button-bg);font-weight:700;cursor:pointer;font-size:calc(.82rem + var(--font-bump));box-shadow:0 4px 10px rgba(9,58,99,.12)}
      .tutorial-btn {
        border: 1px solid #d39e00;
        border-radius: 10px;
        padding: .42rem .8rem;
        background: #fff3cd;
        color: #856404;
        font-weight: 700;
        cursor: pointer;
        font-size: 13px;
        box-shadow: 0 4px 10px rgba(0,0,0,.12);
      }
      .choice-button.tutorial-mode {
        border: 2px solid #d39e00;
        background: #fff3cd;
        color: #856404;
      }
      .choice-button.tutorial-mode.active {
        background: linear-gradient(180deg, #ffd54f, #ffc107);
        color: #5c4500;
        border-color: #d39e00;
      }
      .btn.tutorial-next-ready{
        background: linear-gradient(180deg, #ffd54f, #ffc107);
        color: #5c4500;
        border-color: #d39e00;
      }
      .overlay-tour {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(3px);
        z-index: 9998;
        pointer-events: none;
      }
      .tour-highlight {
        position: relative;
        z-index: 9999;
        box-shadow: 0 0 0 4px rgba(255, 193, 7, 0.9);
        border-radius: 10px;
      }
      .tour-popup {
        position: fixed;
        max-width: 260px;
        background: #fff3cd;
        border: 1px solid #ffe69c;
        border-radius: 10px;
        padding: 12px;
        font-size: 13px;
        color: #664d03;
        z-index: 10000;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      }
      .tour-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
      .tour-actions .btn{padding:.45rem .65rem}
      .dev-modal{position:fixed;inset:0;background:rgba(9,58,99,.36);display:none;align-items:center;justify-content:center;padding:1rem;z-index:20}
      .dev-modal.open{display:flex}
      .dev-dialog{width:min(520px,96vw);background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 35px rgba(9,58,99,.2);padding:1rem 1.1rem}
      .dev-dialog h4{margin:0 0 .6rem;color:var(--button-bg);font-size:calc(1rem + var(--font-bump))}
      .dev-dialog p{margin:.2rem 0;color:var(--text-primary);font-size:calc(.84rem + var(--font-bump));line-height:1.45}
      .dev-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:.8rem}
      @media (max-width:860px){.grid,.grid-3,.cards,.choice-buttons,.language-buttons,.mode-choices,.strategy-top,.strategy-bottom,.combined-split{grid-template-columns:1fr}.app-screen{justify-content:center;padding-top:.65rem}.top-logo{margin-bottom:.45cm;width:min(188px,58vw)}.below-work-row{grid-template-columns:1fr;row-gap:.5rem;margin-top:.45rem}.flags-row{gap:1cm}.developer-launch{justify-self:end}.flag-img{width:min(80px,26vw)}.metric-chips{grid-template-columns:repeat(3,minmax(0,1fr))}.mode-hints{grid-template-columns:1fr}.target-ph-buttons{grid-template-columns:repeat(3,minmax(88px,1fr))}.nav,.nav-right{flex-direction:column;align-items:stretch}}
    </style>
  </head>
  <body>
    <main class="app-screen">
      <div class="background-image" aria-hidden="true"></div>
      <div class="background-logo" aria-hidden="true"></div>
      <div class="overlay" aria-hidden="true"></div>
      <img class="top-logo" alt="Logo POSCO" src="http://www.poscoargentina.com/public/images/xlogo-posco-argentina-1.png.pagespeed.ic.HsKLPImI1W.webp" onerror="this.onerror=null;this.src='POSCO_logo.svg';" />
      <section class="content">
        <div class="tabs" id="tabs"></div>

        <section class="screen" id="screen-language">
          <div class="welcome-main">
            <h2 id="main-title"></h2><p class="welcome-description" id="main-description"></p><p class="language-label" id="language-label"></p>
            <div class="language-buttons"><button class="language-button" id="langBtnEn" data-lang="en"></button><button class="language-button" id="langBtnEs" data-lang="es"></button><button class="language-button" id="langBtnKo" data-lang="ko"></button></div>
            <div class="welcome-actions"><button class="btn welcome-next" id="welcomeNextButton" type="button"></button></div>
          </div>
        </section>

        <section class="screen" id="screen-task"><h3 data-i18n="taskTitle"></h3><div class="choice-buttons"><button class="choice-button" id="taskConditioningBtn" data-task="Ajuste de pH" type="button"></button><button class="choice-button" id="taskReceptionBtn" data-task="Recepción de Efluentes" type="button"></button></div><div class="card" id="taskHelpCard" style="margin-top:10px;display:none;"><h4 id="taskHelpTitle"></h4><div class="small" id="taskHelpText"></div></div></section>

        <section class="screen" id="screen-state">
          <div class="top-row"><h3 data-i18n="tankTitleWWB"></h3><button class="btn" id="settingsBtn" type="button">⚙️ <span data-i18n="settingsBtn"></span></button></div>
          <div class="grid grid-3">
            <div class="field"><label data-i18n="levelMm"></label><input id="tankLevelMm" type="number" step="0.01" placeholder="1200 - 4000" /><div id="levelError" class="error"></div></div>
            <div class="field"><label data-i18n="estimatedVolumeLabel"></label><button id="estimatedVolume" class="readonly-output" type="button" disabled></button><div class="notice" data-i18n="volumeHint"></div></div>
            <div class="field"><label data-i18n="phLabel"></label><input id="tankPh" type="number" step="0.01" placeholder="0 - 14" /><div id="phError" class="error"></div></div>
          </div>
          <div class="settings-panel" id="settingsPanel">
            <h3 data-i18n="chemicalsOptionalTitle"></h3>
            <div class="grid"><div class="field"><label data-i18n="naohConcentration"></label><select id="naohPct"></select></div><div class="field"><label data-i18n="h2so4Concentration"></label><select id="h2so4Pct"></select></div></div>
          </div>
        </section>

        <section class="screen" id="screen-effluents">
          <div class="top-row"><h3 data-i18n="effluentsTitle"></h3><button class="btn" id="addEffluentBtn" type="button">+ <span data-i18n="addEffluent"></span></button></div>
          <div id="effluentList"></div>
        </section>

        <section class="screen" id="screen-neutralization">
          <h3 data-i18n="neutralizationMode"></h3>
          <div class="card" id="mixedStateCalcCard" style="display:none;margin-top:10px;">
            <h4 data-i18n="mixedStateTitle"></h4>
            <div id="mixedStateCalcSummary"></div>
          </div>
          <div class="card" id="modeBlock" style="margin-top:10px;">
            <div class="field"><label data-i18n="targetPhLabel"></label><div class="target-ph-buttons"><button class="choice-button" id="targetPh7" data-target-ph="7" type="button">7.0</button><button class="choice-button" id="targetPh8" data-target-ph="8" type="button">8.0</button><button class="choice-button" id="targetPh85" data-target-ph="8.5" type="button">8.5</button></div><div class="target-ph-buttons" style="margin-top:6px;"><div class="target-ph-note" data-i18n="targetPhNote7"></div><div class="target-ph-note" data-i18n="targetPhNote8"></div><div class="target-ph-note" data-i18n="targetPhNote85"></div></div></div>
            <div class="field" style="margin-top:8px;"><label data-i18n="modeLabel"></label><div class="choice-buttons mode-choices"><button class="choice-button" id="modeCombinedBtn" data-mode="combined" type="button"></button><button class="choice-button" id="modeEffBtn" data-mode="effluent" type="button"></button><button class="choice-button" id="modeChemBtn" data-mode="chemical" type="button"></button></div><div class="mode-hints" id="modeHints"></div></div>
            <div class="grid strategy-top" id="effluentConfig" style="margin-top:8px;">
              <div class="field"><label data-i18n="effluentNameLabel"></label><input id="effluentNameAuto" type="text" readonly /></div>
              <div class="field"><label data-i18n="effluentVolumeLabel"></label><select id="maxEffluentM3"><option value="5">5 m³</option><option value="10">10 m³</option><option value="15">15 m³</option><option value="20">20 m³</option><option value="25">25 m³</option><option value="30">30 m³</option></select></div>
              <div class="field"><label data-i18n="neutralizerPhLabel"></label><input id="neutralizerPh" type="number" min="0" max="14" step="0.01" placeholder="0 - 14" /><div id="neutralizerPhError" class="error"></div></div>
            </div>
            <div class="notice" id="modeCriterion"></div>
          </div>
        </section>

        <section class="screen" id="screen-results">
          <h3 data-i18n="resultsTitle"></h3>
          <div class="results-flow" id="receptionFlow"><div class="card"><h4 data-i18n="stateCard"></h4><div id="afterEffluentsSummary"></div></div><div class="card" id="mixedStateResultsCard" style="display:none;"><h4 data-i18n="mixedStateTitle"></h4><div id="mixedStateResultsSummary"></div></div><div class="card inverted-block" id="additionCard"><h4 id="additionTitle" data-i18n="stageAdditionTitle"></h4><div id="additionSummary"></div></div><div class="card"><h4 data-i18n="finalTankStateTitle"></h4><div id="finalAfterNeutralizationSummary"></div></div></div>
          <div class="notice" id="conditioningNote" style="display:none;"></div><div class="notice warn" id="overflowWarn" style="display:none;"></div>
        </section>

        <div class="nav" id="globalNav"><button class="btn" id="btnHome" data-i18n="homeBtn"></button><div class="nav-right"><button class="btn" id="btnBack" data-i18n="backBtn"></button><button class="btn" id="btnNext" data-i18n="nextBtn"></button><button class="btn btn-summary" id="btnSummary" data-i18n="summaryBtn" type="button"></button></div></div>
        <div id="screenError" class="error"></div>
      </section>
      <div class="below-work-row">
        <div></div>
        <div class="flags-row" aria-hidden="true">
          <img class="flag-img" alt="Bandera de Corea del Sur" src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Flag_of_South_Korea.svg/960px-Flag_of_South_Korea.svg.png" />
          <img class="flag-img" alt="Bandera de Argentina" src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Flag_of_Argentina.svg/960px-Flag_of_Argentina.svg.png" />
        </div>
        <div class="developer-launch" id="developerLaunchWrap"><button class="developer-btn" id="developerBtn" type="button" data-i18n="developerBtn"></button><button class="tutorial-btn" id="tutorialBtn" type="button">Tutorial</button></div>
      </div>
    </main>
    <div id="tourOverlay" class="overlay-tour" style="display:none;"></div>
    <div id="tourPopup" class="tour-popup" style="display:none;">
      <div id="tourPopupText"></div>
      <div class="tour-actions">
        <button class="btn" id="tourPrevBtn" type="button">Anterior</button>
        <button class="btn" id="tourNextBtn" type="button">Siguiente</button>
        <button class="btn" id="tourFinishBtn" type="button">Finalizar</button>
      </div>
    </div>

    <div class="dev-modal" id="devModal" aria-hidden="true" role="dialog" aria-labelledby="devTitle">
      <div class="dev-dialog">
        <h4 id="devTitle" data-i18n="developerBtn"></h4>
        <p><strong>Valdez Franco Leonardo</strong></p>
        <p>POSCO LH Production Dept. - Utilities - Güemes - Salta - Argentina</p>
        <p>LinkedIn: <a href="https://www.linkedin.com/in/francolvaldez/" target="_blank" rel="noopener noreferrer">https://www.linkedin.com/in/francolvaldez/</a></p>
        <div class="dev-actions"><button class="btn" id="devCloseBtn" type="button" data-i18n="closeBtn"></button></div>
      </div>
    </div>

    <div class="dev-modal" id="summaryModal" aria-hidden="true" role="dialog" aria-labelledby="summaryTitle">
      <div class="dev-dialog">
        <h4 id="summaryTitle" data-i18n="summaryTitle"></h4>
        <div id="summaryBody"></div>
        <div class="dev-actions"><div id="summaryCopyStatus" class="summary-copy-status"></div><button class="btn" id="summaryCopyBtn" type="button" data-i18n="copyBtn"></button><button class="btn" id="summaryCloseBtn" type="button" data-i18n="closeBtn"></button></div>
      </div>

      }

      function calculateEqToNeutralize(ph, volumeL, targetPh=7){
        const p=Math.min(14,Math.max(0,Number(ph)||0)), target=Math.pow(10,-targetPh);
        if(p<targetPh) return {species:'H+', eq:Math.max((hFromPh(p)-target)*volumeL,0)};
        if(p>targetPh) return {species:'OH-', eq:Math.max((ohFromPh(p)-target)*volumeL,0)};
        return {species:'', eq:0};
      }
      function calculateEffluentEqPerL(ph, kind){ return kind==='LH'?ohFromPh(ph):hFromPh(ph); }

      function mixStreams(baseTank, effluents){
        let totalM3=Math.max(0,num(baseTank.volumeM3,0)), totalH=0, totalOH=0;
        const baseL=m3ToL(totalM3), basePh=Math.min(14,Math.max(0,num(baseTank.pH,7))); 
        if(basePh<7) totalH+=hFromPh(basePh)*baseL; else if(basePh>7) totalOH+=ohFromPh(basePh)*baseL;
        effluents.forEach(e=>{
          const vm3=Math.max(0,num(e.volumeM3,0)), eph=Math.min(14,Math.max(0,num(e.pH,7))), l=m3ToL(vm3);
          totalM3+=vm3;
          if(eph<7) totalH+=hFromPh(eph)*l; else if(eph>7) totalOH+=ohFromPh(eph)*l;
        });
        const totalL=m3ToL(totalM3);
        let ph=7;
        if(totalL>0){
          if(totalH>totalOH) ph=-Math.log10(Math.max((totalH-totalOH)/totalL,1e-14));
          else if(totalOH>totalH) ph=14+Math.log10(Math.max((totalOH-totalH)/totalL,1e-14));
        }
        return {volumeM3:totalM3, levelMm:num(baseTank.levelMm,0)+m3ToMm(totalM3-num(baseTank.volumeM3,0)), pH:Math.min(14,Math.max(0,ph))};
      }

      function calculateNeutralizationForState(srcState, options={}){
        const safetyFactor=num(options.safetyFactor,1.25)||1.25, pumpExtraM3=num(options.pumpExtraM3,0)||0, targetPh=num(options.targetPh,CAL.PH_TARGET)||CAL.PH_TARGET;
        const src={volumeM3:Math.max(0,num(srcState.volumeM3,0)), levelMm:Math.max(0,num(srcState.levelMm,0)), pH:Math.min(14,Math.max(0,num(srcState.pH,7)))};
        const {species,eq}=calculateEqToNeutralize(src.pH, m3ToL(src.volumeM3), targetPh);
        const mode=options.mode||'chemicals';
        let type='', conc=null, ref=null, eqL=0, errorMessage='';
        if(species==='H+'){
          if(mode==='effluent'){ type='LH'; ref=Number.isFinite(num(options.referencePh))?num(options.referencePh):12; }
          else { type='NaOH'; conc=num(state.chemicals.naohPct,30)||30; eqL=naohEqPerL(conc); }
        } else if(species==='OH-'){
          if(mode==='effluent'){ type='IX'; ref=Number.isFinite(num(options.referencePh))?num(options.referencePh):1; }
          else { type='H2SO4'; conc=num(state.chemicals.h2so4Pct,98)||98; eqL=h2so4EqPerL(conc); }
        }

        if(mode==='effluent' && type){
          if((type==='IX' && ref>=7) || (type==='LH' && ref<=7)) errorMessage='invalidReferenceType';
          eqL=errorMessage?0:calculateEffluentEqPerL(ref,type);
          if(!errorMessage && eq>0 && eqL<1e-6) errorMessage='invalidNeutralizingCapacity';
        }

        const requiredVolumeTheoreticalL=(eq>0&&eqL>0)?(eq/eqL):0;
        const safeTheo=Number.isFinite(requiredVolumeTheoreticalL)&&requiredVolumeTheoreticalL>0?requiredVolumeTheoreticalL:0;
        const minimal=safeTheo<0.5;
        const requiredVolumeFinalL=safeTheo*safetyFactor;
        const requiredVolumeFinalM3=requiredVolumeFinalL/1000;
        const finalTankVolumeM3=Math.max(0,src.volumeM3+requiredVolumeFinalM3+pumpExtraM3);
        const finalTankLevelMm=Math.max(0,m3ToMm(finalTankVolumeM3));
        const finalPh=(species&&requiredVolumeFinalL>0)?targetPh:src.pH;
        const hasError=errorMessage!=='' || ![src.volumeM3,src.levelMm,eq,eqL,requiredVolumeFinalL,finalTankVolumeM3,finalTankLevelMm].every(v=>Number.isFinite(v));
        return {src,mode,species,type,conc,ref,eqL:Math.max(eqL,0),eq:reqLteq(eq),reqL:requiredVolumeFinalL,reqM3:requiredVolumeFinalM3,dMm:m3ToMm(requiredVolumeFinalM3),proj:finalTankLevelMm,
          result:{targetPh,currentPh:src.pH,requiredType:type,requiredConcentration:conc,equivalentsToNeutralize:Math.max(eq,0),reagentEqPerL:Math.max(eqL,0),requiredVolumeTheoreticalL:safeTheo,requiredVolumeFinalL,requiredVolumeFinalM3,pumpExtraM3,finalTankVolumeM3,finalTankLevelMm,finalPh,minimal,hasError,errorMessage:errorMessage?t(errorMessage):''}};
      }
      function reqLteq(v){ return Math.max(num(v,0)||0,0); }

      function recommendMode(basePh, effluentAvailable){
        const p=Math.min(14,Math.max(0,num(basePh,7)));
        if(!effluentAvailable) return 'chemical';
        if(p<3||p>11) return 'combined';
        if((p>=3&&p<5)||(p>9&&p<=11)) return 'effluent';
        return 'chemical';
      }
      function strategyToCalcMode(selectedMode){ return selectedMode==='effluent' ? 'effluent' : 'chemicals'; }
      function modeIsAvailable(mode, effluentAvailable){ return true; }

      function getTargetPh(){ return num(state.neutralizationStrategy.targetPh,7)||7; }
      function renderTargetPhButtons(){ const tp=getTargetPh(); [$('targetPh7'),$('targetPh8'),$('targetPh85')].forEach(b=>b.classList.toggle('active',num(b.dataset.targetPh,7)===tp)); }
      function getAutoEffluentName(ph){ return num(ph,7)<7?'LH':'IX'; }

      function estimatePhAfterCounterDose(srcPh, srcVolumeM3, species, counterEqPerL, addL){
        const baseL=m3ToL(srcVolumeM3);
        const totalL=Math.max(baseL+Math.max(addL,0),1e-9);
        let totalH=srcPh<7?hFromPh(srcPh)*baseL:0;
        let totalOH=srcPh>7?ohFromPh(srcPh)*baseL:0;
        const addEq=Math.max(counterEqPerL,0)*Math.max(addL,0);
        if(species==='H+') totalOH+=addEq;
        if(species==='OH-') totalH+=addEq;
        if(totalH>totalOH) return Math.min(14,Math.max(0,-Math.log10(Math.max((totalH-totalOH)/totalL,1e-14))));
        if(totalOH>totalH) return Math.min(14,Math.max(0,14+Math.log10(Math.max((totalOH-totalH)/totalL,1e-14))));
        return 7;
      }

      function calc(){
        const isConditioning=state.selectedTask==='Ajuste de pH';
        const targetPh=getTargetPh();
        if(isConditioning){
          const src={volumeM3:mmToM3(state.tankState.levelMm),levelMm:state.tankState.levelMm,pH:state.tankState.pH};
          const selectedMode=state.neutralizationStrategy.selectedMode;
          const refPh=Number.isFinite(num(state.neutralization.referencePh))?num(state.neutralization.referencePh):(src.pH<7?12:1);
          const pumpExtraM3=2.5;

          if(selectedMode==='chemical'){
            const n=calculateNeutralizationForState(src,{mode:'chemicals',safetyFactor:1.25,pumpExtraM3,targetPh});
            state.neutralization={...state.neutralization,...n.result};
            return {...n,stage:'chemical',displayState:src};
          }

          const effN=calculateNeutralizationForState(src,{mode:'effluent',safetyFactor:1.25,pumpExtraM3:0,targetPh,referencePh:refPh});
          const maxEffM3=Math.max(0,num(state.neutralizationStrategy.maxEffluentM3,10));
          const usedEffM3=Math.min(effN.reqM3,maxEffM3);
          const usedEffL=m3ToL(usedEffM3);
          const interPh=estimatePhAfterCounterDose(src.pH,src.volumeM3,effN.species,effN.eqL,usedEffL);
          const interState={volumeM3:src.volumeM3+usedEffM3,levelMm:src.levelMm+m3ToMm(usedEffM3),pH:interPh};

          if(selectedMode==='effluent'){
            const finalVolumeM3=interState.volumeM3+pumpExtraM3;
            const finalLevelMm=m3ToMm(finalVolumeM3);
            const result={...effN.result,requiredVolumeFinalL:usedEffL,requiredVolumeFinalM3:usedEffM3,pumpExtraM3,finalTankVolumeM3:finalVolumeM3,finalTankLevelMm:finalLevelMm,finalPh:interPh};
            state.neutralization={...state.neutralization,...result};
            return {...effN,reqL:usedEffL,reqM3:usedEffM3,dMm:m3ToMm(usedEffM3),proj:finalLevelMm,result,displayState:src,interState,chemAfter:null};
          }

          const chemN=calculateNeutralizationForState(interState,{mode:'chemicals',safetyFactor:1.25,pumpExtraM3,targetPh});
          const final={
            ...chemN,
            reqL:usedEffL+chemN.reqL,
            reqM3:usedEffM3+chemN.reqM3,
            result:{...chemN.result,finalTankVolumeM3:chemN.result.finalTankVolumeM3,finalTankLevelMm:chemN.result.finalTankLevelMm,finalPh:chemN.result.finalPh}
          };
          state.neutralization={...state.neutralization,...final.result};
          return {...final,displayState:src,interState,effStep:effN,usedEffM3,usedEffL,chemAfter:chemN};
        }

        const mixed=state.selectedTask==='Recepción de Efluentes'?
          mixStreams({volumeM3:state.tankState.volumeM3,levelMm:state.tankState.levelMm,pH:state.tankState.pH},state.effluents):
          {volumeM3:state.tankState.volumeM3,levelMm:state.tankState.levelMm,pH:state.tankState.pH};
        const calcMode=strategyToCalcMode(state.neutralizationStrategy.selectedMode);
        const n=calculateNeutralizationForState(mixed,{mode:calcMode,safetyFactor:1.25,pumpExtraM3:0,referencePh:state.neutralization.referencePh,targetPh});
        state.neutralization={...state.neutralization,...n.result};
        return n;
      }

      function asMetricChips(items){ return `<div class="metric-chips">${items.map(i=>`<div class="metric-chip ${i.added?'added-chip':''}">${i.label}<b>${i.value}</b></div>`).join('')}</div>`; }
      function summaryRows(rows){ return `<div class="summary-list">${rows.map(r=>`<div class="summary-row"><div class="summary-key">${escapeHtml(r.label)}</div><div>${escapeHtml(r.value)}</div></div>`).join('')}</div>`; }
      function summaryTextSection(title, rows){ return `${title}\n${rows.map(r=>`- ${r.label}: ${r.value}`).join('\n')}`; }
      function buildSummaryPayload(){
        const n=calc();
        if(n.result.hasError) return {html:`<div class='warn'>${t('calcError')}</div>`,text:t('calcError')};
        const isReception=state.selectedTask==='Recepción de Efluentes';
        const isConditioning=state.selectedTask==='Ajuste de pH';
        const initialLevel=num(state.tankState.levelMm,0), initialM3=mmToM3(initialLevel), initialPh=num(state.tankState.pH,7);
        const selectedMode=state.neutralizationStrategy.selectedMode;
        const initialRows=[{label:t('levelMm'),value:`${fmt(initialLevel,2)} mm`},{label:t('volumeLabel'),value:`${fmt(initialM3,3)} m³`},{label:t('phLabel'),value:fmt(initialPh,2)}];
        const addedRows=[{label:t('summarySelectedModeLabel'),value:t(selectedMode==='combined'?'modeCombined':selectedMode==='effluent'?'modeEffluent':'modeChemical')},{label:t('summaryTargetPhLabel'),value:fmt(getTargetPh(),2)}];
        if(selectedMode!=='chemical') addedRows.push({label:t('summaryReferencePhLabel'),value:Number.isFinite(num(state.neutralization.referencePh))?fmt(state.neutralization.referencePh,2):'-'});
        addedRows.push({label:t('summaryChemicalSettingsLabel'),value:`NaOH ${state.chemicals.naohPct}% | H2SO4 ${state.chemicals.h2so4Pct}%`});
        if(isReception){
          const effRows=state.effluents.filter(e=>Number.isFinite(num(e.volumeM3))||Number.isFinite(num(e.pH))).map((e,i)=>({label:`${t('effluentName')} ${i+1}`,value:`${e.name||'-'} | ${t('effVol')}: ${Number.isFinite(num(e.volumeM3))?`${fmt(e.volumeM3,3)} m³`:'-'} | ${t('effPh')}: ${Number.isFinite(num(e.pH))?fmt(e.pH,2):'-'}`}));
          if(effRows.length) addedRows.push(...effRows); else addedRows.push({label:t('summaryIncomingEffluentsLabel'),value:t('summaryNoEffluents')});
        }
        if(isConditioning && selectedMode==='combined' && n.chemAfter){
          addedRows.push({label:`${t('summaryStepLabel')} 1`,value:`${t('effluentBlockTitle')} | ${t('typeLabel')}: ${n.effStep.result.requiredType||'-'} | ${t('summaryReferencePhLabel')}: ${Number.isFinite(num(state.neutralization.referencePh))?fmt(state.neutralization.referencePh,2):'-'} | ${t('summaryRequiredVolumeLabel')}: ${fmt(n.usedEffM3||0,3)} m³ | ${t('intermediatePhLabel')}: ${fmt((n.interState&&n.interState.pH)||initialPh,2)}`});
          addedRows.push({label:`${t('summaryStepLabel')} 2`,value:`${t('chemicalBlockTitle')} | ${t('typeLabel')}: ${n.chemAfter.result.requiredType||'-'} | ${t('concentrationLabel')}: ${n.chemAfter.result.requiredConcentration||'-'}% | ${t('summaryTheoreticalVolumeLabel')}: ${fmt(n.chemAfter.result.requiredVolumeTheoreticalL,2)} L | ${t('summaryRequiredVolumeLabel')}: ${fmt(n.chemAfter.result.requiredVolumeFinalL,2)} L`});
        } else {
          addedRows.push({label:t('typeLabel'),value:n.result.requiredType||'-'});
          if(Number.isFinite(num(n.result.requiredConcentration))) addedRows.push({label:t('concentrationLabel'),value:`${n.result.requiredConcentration}%`});
          addedRows.push({label:t('summaryRequiredVolumeLabel'),value:n.result.requiredType==='LH'||n.result.requiredType==='IX'||selectedMode==='effluent'?`${fmt(n.reqM3||n.result.requiredVolumeFinalM3,3)} m³`:`${fmt(n.result.requiredVolumeFinalL,2)} L`});
        }
        if(isConditioning) addedRows.push({label:t('summaryPumpExtraLabel'),value:'2.50 m³'});
        const finalRows=[{label:t('levelMm'),value:`${fmt(n.result.finalTankLevelMm,2)} mm`},{label:t('volumeLabel'),value:`${fmt(n.result.finalTankVolumeM3,3)} m³`},{label:t('phLabel'),value:fmt(n.result.finalPh,2)}];
        const html=`<div class="summary-compact"><div class="card"><h4>${t('summaryInitial')}</h4>${summaryRows(initialRows)}</div><div class="card" style="margin-top:8px;"><h4>${t('summaryAdded')}</h4>${summaryRows(addedRows)}</div><div class="card" style="margin-top:8px;"><h4>${t('summaryFinal')}</h4>${summaryRows(finalRows)}</div></div>`;
        const text=[summaryTextSection(t('summaryInitial'),initialRows),summaryTextSection(t('summaryAdded'),addedRows),summaryTextSection(t('summaryFinal'),finalRows)].join('\n\n');
        return {html,text};
      }

      function renderNeutralization(){
        const isReception=state.selectedTask==='Recepción de Efluentes';
        const base=isReception?
          mixStreams({volumeM3:state.tankState.volumeM3,levelMm:state.tankState.levelMm,pH:state.tankState.pH},state.effluents):

        const basePh=num(base.pH,7);

        $('effluentConfig').style.display=(selectedMode==='chemical')?'none':'grid'; $('neutralizerPh').disabled=(selectedMode==='chemical');

        const preview=calculateNeutralizationForState(base,{mode:'effluent',safetyFactor:1.25,pumpExtraM3:0,targetPh:getTargetPh(),referencePh:state.neutralization.referencePh});

      }

      function showTutorialStep(){
        if(!state.tutorial.active) return;
        const step=state.tutorial.steps[state.tutorial.stepIndex];
        if(!step){ finishTutorial(); return; }
        state.tutorial.waitingAdvance=false;
        $('btnNext').classList.remove('tutorial-next-ready');
        if(currentScreen!==step.screen) show(step.screen);
        const el=$(step.target);
        if(!el){ finishTutorial(); return; }
        document.querySelectorAll('.tour-highlight').forEach(n=>n.classList.remove('tour-highlight'));
        $('tourOverlay').style.display='block';
        $('tourPopup').style.display='block';
        $('tourPopupText').textContent=step.text;
        el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});
        setTimeout(()=>{
          el.classList.add('tour-highlight');
          positionTourPopup(el);
          $('tourPrevBtn').disabled=state.tutorial.stepIndex===0;
          $('tourNextBtn').disabled=state.tutorial.stepIndex>=state.tutorial.steps.length-1;
        },120);
      }

      function markTutorialStepReady(){
        if(!state.tutorial.active||state.tutorial.waitingAdvance) return;
        state.tutorial.waitingAdvance=true;
        $('tourOverlay').style.display='none';
        $('tourPopup').style.display='none';
        $('btnNext').classList.add('tutorial-next-ready');
      }

      function handleTutorialUserAction(evt){
        if(!state.tutorial.active||state.tutorial.waitingAdvance) return;
        const step=state.tutorial.steps[state.tutorial.stepIndex];
        if(!step) return;
        const el=$(step.target);
        if(!el) return;
        if(el===evt.target||el.contains(evt.target)) markTutorialStepReady();
      }

      function startTutorial(mode){
        state.tutorial.active=true;
        state.tutorial.mode=mode;
        state.tutorial.stepIndex=0;
        state.tutorial.steps=tutorialCatalog[mode]||[];
        state.tutorial.waitingAdvance=false;
        setTaskTutorialSelectionMode(false);
        showTutorialStep();
      }

      function renderI18n(){
        document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
        document.documentElement.lang=state.selectedLanguage;
        buildSelects();
        renderTabs();
        $('main-title').textContent=t('welcomeTitle');
        $('main-description').textContent=t('welcomeDescription');
        $('language-label').textContent=t('selectLanguageText');
        $('welcomeNextButton').textContent=t('nextBtn');
        $('langBtnEn').textContent=t('langEnglish');
        $('langBtnEs').textContent=t('langSpanish');
        $('langBtnKo').textContent=t('langKorean');
        document.querySelectorAll('.language-button').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.selectedLanguage));
        if(!state.tutorial.selecting){
          $('taskReceptionBtn').textContent=t('taskReception');
          $('taskConditioningBtn').textContent=t('taskConditioning');
        }
        renderTaskHelp();
        [$('taskReceptionBtn'),$('taskConditioningBtn')].forEach(b=>b.classList.toggle('active',b.dataset.task===state.selectedTask));
        $('modeCombinedBtn').textContent=t('modeCombined');
        $('modeEffBtn').textContent=t('modeEffluent');
        $('modeChemBtn').textContent=t('modeChemical');
        $('btnSummary').textContent=t('summaryBtn');
        $('maxEffluentM3').value=String(state.neutralizationStrategy.maxEffluentM3);
        if($('tankLevelMm').value.trim()!==''||$('tankPh').value.trim()!==''){ validateState(); }
        else { $('levelError').textContent=''; $('phError').textContent=''; $('estimatedVolume').textContent=t('estimatedVolume').replace('{value}','--'); setFieldTone($('tankLevelMm'),'input-empty'); setFieldTone($('tankPh'),'input-empty'); }
        renderEffluents(); renderNeutralization(); renderResults();
      }

      function bind(){
        document.querySelectorAll('.language-button').forEach(btn=>btn.addEventListener('click',()=>{state.selectedLanguage=btn.dataset.lang;renderI18n();}));
        $('welcomeNextButton').addEventListener('click',()=>show('task'));
        $('taskConditioningBtn').addEventListener('click',()=>{
          if(state.tutorial.selecting){ state.selectedTask='Ajuste de pH'; $('taskConditioningBtn').classList.add('active'); startTutorial('unico'); return; }
          state.selectedTask='Ajuste de pH'; renderI18n();
        });
        $('taskReceptionBtn').addEventListener('click',()=>{
          if(state.tutorial.selecting){ state.selectedTask='Recepción de Efluentes'; $('taskReceptionBtn').classList.add('active'); startTutorial('multiple'); return; }
          state.selectedTask='Recepción de Efluentes'; renderI18n();
        });
        $('tutorialBtn').addEventListener('click',()=>{ show('task'); setTaskTutorialSelectionMode(true); });
        $('tourOverlay').addEventListener('click',()=>{});
        $('tourPrevBtn').addEventListener('click',()=>{ if(state.tutorial.stepIndex>0){ state.tutorial.stepIndex-=1; showTutorialStep(); }});
        $('tourNextBtn').addEventListener('click',()=>{ if(state.tutorial.stepIndex<state.tutorial.steps.length-1){ state.tutorial.stepIndex+=1; showTutorialStep(); }});
        $('tourFinishBtn').addEventListener('click',finishTutorial);
        document.addEventListener('click',handleTutorialUserAction,true);
        document.addEventListener('input',handleTutorialUserAction,true);
        document.addEventListener('change',handleTutorialUserAction,true);
        $('settingsBtn').addEventListener('click',()=>$('settingsPanel').classList.toggle('open'));
        $('tankLevelMm').addEventListener('input',()=>{validateState(); $('btnNext').disabled=currentScreen==='state'?!validateState():false; renderNeutralization(); renderResults();});
        $('tankPh').addEventListener('input',()=>{validateState(); $('btnNext').disabled=currentScreen==='state'?!validateState():false; renderNeutralization(); renderResults();});
        $('addEffluentBtn').addEventListener('click',()=>{state.effluents.push({name:'LH',volumeM3:NaN,pH:NaN}); renderEffluents(); renderNeutralization(); renderResults();});
        $('naohPct').addEventListener('change',e=>{state.chemicals.naohPct=Number(e.target.value); renderResults();});
        $('h2so4Pct').addEventListener('change',e=>{state.chemicals.h2so4Pct=Number(e.target.value); renderResults();});
        [$('modeCombinedBtn'),$('modeEffBtn'),$('modeChemBtn')].forEach(btn=>btn.addEventListener('click',()=>{ state.neutralizationStrategy.selectedMode=btn.dataset.mode; renderNeutralization(); renderResults(); }));
        $('maxEffluentM3').addEventListener('change',e=>{ state.neutralizationStrategy.maxEffluentM3=num(e.target.value,10); renderResults(); });
        [$('targetPh7'),$('targetPh8'),$('targetPh85')].forEach(btn=>btn.addEventListener('click',()=>{ state.neutralizationStrategy.targetPh=num(btn.dataset.targetPh,7); renderNeutralization(); renderResults(); }));
        $('neutralizerPh').addEventListener('input',e=>{state.neutralization.referencePh=num(e.target.value); renderNeutralization(); renderResults();});
        $('developerBtn').addEventListener('click',()=>$('devModal').classList.add('open'));
        $('devCloseBtn').addEventListener('click',()=>$('devModal').classList.remove('open'));
        $('devModal').addEventListener('click',e=>{ if(e.target.id==='devModal') $('devModal').classList.remove('open'); });
        $('btnSummary').addEventListener('click',openSummary);
        $('summaryCloseBtn').addEventListener('click',()=>$('summaryModal').classList.remove('open'));
        $('summaryCopyBtn').addEventListener('click',copySummary);
        $('summaryModal').addEventListener('click',e=>{ if(e.target.id==='summaryModal') $('summaryModal').classList.remove('open'); });
        $('btnHome').addEventListener('click',()=>{ finishTutorial(); show('language'); });
        $('btnBack').addEventListener('click',()=>{const f=flow();const i=f.indexOf(currentScreen);if(i>0)show(f[i-1]);});
        $('btnNext').addEventListener('click',()=>{
          const f=flow();
          const i=f.indexOf(currentScreen);
          if(!isValid(currentScreen))return;
          if(i<f.length-1){
            show(f[i+1]);
            if(f[i+1]==='results')renderResults();
            if(state.tutorial.active&&state.tutorial.waitingAdvance){
              state.tutorial.stepIndex+=1;
              if(state.tutorial.stepIndex>=state.tutorial.steps.length) finishTutorial();
              else showTutorialStep();
            }
          }
        });
      }


      function show(id){
        currentScreen=id;
        ['language','task','state','effluents','neutralization','results'].forEach(scr=>$('screen-'+scr).classList.toggle('active',scr===id));
        $('btnBack').disabled=id==='language';
        const hide=id==='language';
        $('tabs').style.display=hide?'none':'flex';
        $('globalNav').style.display=hide?'none':'flex';
        if(state.tutorial.selecting && id!=='task') setTaskTutorialSelectionMode(false);
        $('developerLaunchWrap').style.display=(id==='language'||id==='task')?'flex':'none';
        if(id!=='language') $('devModal').classList.remove('open'); if(id!=='results') $('summaryModal').classList.remove('open');
        renderTabs();
        if(id==='state'){
          const hasAny=$('tankLevelMm').value.trim()!==''||$('tankPh').value.trim()!=='';
          $('btnNext').disabled=hasAny?!validateState():true;
          if(!hasAny){
            $('levelError').textContent=''; $('phError').textContent='';
            setFieldTone($('tankLevelMm'),'input-empty'); setFieldTone($('tankPh'),'input-empty');
          }
        } else if(id==='neutralization'){
          renderNeutralization();
          $('btnNext').disabled=false;
        } else {
          $('btnNext').disabled=false;
        }
        $('btnSummary').style.display=id==='results'?'inline-block':'none';
        $('btnNext').style.display=id==='results'?'none':'inline-block';
      }

      
      function openSummary(){
        const summary=buildSummaryPayload();
        $('summaryBody').innerHTML=summary.html;
        $('summaryBody').dataset.copyText=summary.text;
        $('summaryCopyStatus').textContent='';
        $('summaryModal').classList.add('open');
      }
      async function copySummary(){
        const text=$('summaryBody').dataset.copyText||'';
        try{
          if(navigator.clipboard&&navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
          else{
            const ta=document.createElement('textarea');
            ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
          }
          $('summaryCopyStatus').textContent=t('copiedMsg');
        }catch(_err){
          $('summaryCopyStatus').textContent=t('copyErrorMsg');
        }
      }

      function init(){ state.tankState.volumeM3=0; $('tankLevelMm').value=''; $('tankPh').value=''; bind(); renderI18n(); show('language'); verifyKnownCases(); }

      function verifyKnownCases(){
        const c1=calculateNeutralizationForState({volumeM3:mmToM3(2000),levelMm:2000,pH:12.5},{mode:'chemicals',safetyFactor:1.25,pumpExtraM3:2.5});
        const c2=calculateNeutralizationForState({volumeM3:mmToM3(3810),levelMm:3810,pH:2.45},{mode:'chemicals',safetyFactor:1.25,pumpExtraM3:2.5});
        console.info('check_case_1_H2SO4_L', fmt(c1.result.requiredVolumeFinalL,2));
        console.info('check_case_2_NaOH_L', fmt(c2.result.requiredVolumeFinalL,2));
      }
      init();
    </script>
  </body>
</html>

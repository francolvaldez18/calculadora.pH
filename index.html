<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora pH</title>
  <style>
    :root {
      --blue-900: #0d2a57;
      --blue-700: #1e4b8f;
      --blue-500: #2f67c1;
      --blue-300: #87afea;
      --bg: #eaf2ff;
      --white: #ffffff;
      --muted: #9bb3d9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, var(--blue-300), var(--bg));
      display: grid;
      place-items: center;
      color: var(--blue-900);
      padding: 16px;
    }

    .content {
      width: min(100%, 520px);
      background: var(--white);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(13, 42, 87, 0.16);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 30px;
      text-align: center;
      color: var(--blue-900);
    }

    .button-group {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .option-btn,
    .primary-btn {
      width: 100%;
      border: 2px solid var(--blue-700);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--white);
      color: var(--blue-700);
    }

    .option-btn:hover,
    .primary-btn:hover:enabled {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(30, 75, 143, 0.15);
    }

    .option-btn.active {
      background: var(--blue-500);
      color: var(--white);
      border-color: var(--blue-500);
    }

    .primary-btn {
      background: var(--blue-700);
      color: var(--white);
    }

    .primary-btn:disabled {
      opacity: 0.45;
      border-color: var(--muted);
      background: var(--muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 2px solid var(--blue-300);
      border-radius: 10px;
      padding: 10px;
      font-size: 16px;
    }

    @media (max-width: 480px) {
      .content {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .option-btn,
      .primary-btn {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="content">
    <section id="screen-language" class="screen active">
      <h1 id="title-language">Selecciona el idioma</h1>
      <div class="button-group" id="language-options">
        <button class="option-btn" data-language="es">Español</button>
        <button class="option-btn" data-language="en">English</button>
        <button class="option-btn" data-language="ko">한국어</button>
      </div>
      <button id="btn-language-next" class="primary-btn" disabled>Siguiente</button>
    </section>

    <section id="screen-task" class="screen">
      <h1 id="title-task">Selecciona la tarea</h1>
      <div class="button-group" id="task-options">
        <button class="option-btn" data-task="effluent_reception">Recepción de Efluentes</button>
        <button class="option-btn" data-task="tank_conditioning">Acondicionamiento de la pileta</button>
      </div>
      <button id="btn-task-next" class="primary-btn" disabled>Siguiente</button>
    </section>

    <section id="screen-pool-status" class="screen">
      <h1 id="title-pool-status">Estado de la pileta WWB</h1>
      <div class="field">
        <label id="label-level" for="pool-level">Nivel</label>
        <input id="pool-level" type="number" step="0.01" />
      </div>
      <div class="field">
        <label id="label-ph" for="pool-ph">pH de la pileta</label>
        <input id="pool-ph" type="number" step="0.01" />
      </div>
    </section>
  </main>

  <script>
    let selectedLanguage = null;
    let selectedTask = null;

    const screens = {
      language: document.getElementById('screen-language'),
      task: document.getElementById('screen-task'),
      poolStatus: document.getElementById('screen-pool-status')
    };

    const languageOptions = document.querySelectorAll('#language-options .option-btn');
    const taskOptions = document.querySelectorAll('#task-options .option-btn');
    const languageNextBtn = document.getElementById('btn-language-next');
    const taskNextBtn = document.getElementById('btn-task-next');

    const i18n = {
      es: {
        languageTitle: 'Selecciona el idioma',
        languageNext: 'Siguiente',
        taskTitle: 'Selecciona la tarea',
        task1: 'Recepción de Efluentes',
        task2: 'Acondicionamiento de la pileta',
        taskNext: 'Siguiente',
        poolTitle: 'Estado de la pileta WWB',
        levelLabel: 'Nivel',
        phLabel: 'pH de la pileta'
      },
      en: {
        languageTitle: 'Select language',
        languageNext: 'Next',
        taskTitle: 'Select the task',
        task1: 'Effluent Reception',
        task2: 'Tank Conditioning',
        taskNext: 'Next',
        poolTitle: 'WWB Pool Status',
        levelLabel: 'Level',
        phLabel: 'Pool pH'
      },
      ko: {
        languageTitle: '언어 선택',
        languageNext: '다음',
        taskTitle: '작업 선택',
        task1: '폐수 수령',
        task2: '조정조 컨디셔닝',
        taskNext: '다음',
        poolTitle: 'WWB 조 상태',
        levelLabel: '수위',
        phLabel: '조 pH'
      }
    };

    function showScreen(target) {
      Object.values(screens).forEach((screen) => screen.classList.remove('active'));
      screens[target].classList.add('active');
    }

    function applyTranslations() {
      const t = i18n[selectedLanguage || 'es'];
      document.getElementById('title-language').textContent = t.languageTitle;
      languageNextBtn.textContent = t.languageNext;
      document.getElementById('title-task').textContent = t.taskTitle;
      taskOptions[0].textContent = t.task1;
      taskOptions[1].textContent = t.task2;
      taskNextBtn.textContent = t.taskNext;
      document.getElementById('title-pool-status').textContent = t.poolTitle;
      document.getElementById('label-level').textContent = t.levelLabel;
      document.getElementById('label-ph').textContent = t.phLabel;
    }

    languageOptions.forEach((button) => {
      button.addEventListener('click', () => {
        languageOptions.forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        selectedLanguage = button.dataset.language;
        languageNextBtn.disabled = false;
        applyTranslations();
      });
    });

    taskOptions.forEach((button) => {
      button.addEventListener('click', () => {
        taskOptions.forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        selectedTask = button.dataset.task;
        taskNextBtn.disabled = false;
      });
    });

    languageNextBtn.addEventListener('click', () => {
      if (!selectedLanguage) return;
      showScreen('task');
    });

    taskNextBtn.addEventListener('click', () => {
      if (!selectedTask) return;
      showScreen('poolStatus');
    });

    applyTranslations();
  </script>
</body>
</html>

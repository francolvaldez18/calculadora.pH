<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora pH | WWB</title>
  <style>
    :root {
      --overlay-color: rgba(255, 255, 255, 0.76);
      --panel-color: rgba(255, 255, 255, 0.9);
      --panel-border: rgba(73, 119, 153, 0.2);
      --text-primary: #093a63;
      --text-secondary: #325f83;
      --button-text: #ffffff;
      --button-bg: #0d6eaa;
      --button-bg-hover: #1285cb;
      --error: #c62828;
      --warning: #8a5a00;
      --field-border: #8fb0c9;
      --field-focus: #0d6eaa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
      color: var(--text-primary);
      background-color: #e9edf2;
    }

    .app {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 8rem 1.25rem 2rem;
      overflow: hidden;
    }

    .background-image {
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(circle at 20% 20%, rgba(13, 110, 170, 0.12), transparent 35%),
        radial-gradient(circle at 80% 40%, rgba(13, 110, 170, 0.08), transparent 38%),
        linear-gradient(180deg, #f5f7fa 0%, #e8edf3 100%);
    }

    .background-logo {
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: 0.13;
      background-image: url("PoscoArg.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: min(75vw, 820px);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: var(--overlay-color);
      z-index: -1;
    }

    .top-logo {
      position: absolute;
      top: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      width: min(300px, 68vw);
      filter: drop-shadow(0 5px 10px rgba(5, 43, 72, 0.15));
    }

    .screen {
      display: none;
      width: min(960px, 100%);
      background: var(--panel-color);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: clamp(1.2rem, 4vw, 2.2rem);
      box-shadow: 0 18px 35px rgba(9, 58, 99, 0.12);
      text-align: left;
    }

    .screen.active { display: block; }

    .header {
      border-bottom: 1px solid rgba(73, 119, 153, 0.24);
      padding-bottom: .7rem;
      margin-bottom: 1.1rem;
    }

    .title {
      margin: 0;
      color: var(--text-primary);
      font-size: clamp(1.2rem, 2.4vw, 1.9rem);
      line-height: 1.35;
      text-wrap: balance;
    }

    .subtitle {
      margin: .65rem 0 0;
      color: var(--text-secondary);
      font-size: .98rem;
      line-height: 1.5;
    }

    .language-label {
      margin-top: .4rem;
      margin-bottom: .85rem;
      font-weight: 600;
      letter-spacing: .02em;
      color: #174e78;
      font-size: 1.05rem;
    }

    .language-buttons {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: .9rem;
      margin-bottom: .9rem;
    }

    .language-button,
    .btn,
    .task-button {
      border: none;
      border-radius: 12px;
      padding: .85rem 1rem;
      font-size: 1rem;
      font-weight: 700;
      color: var(--button-text);
      background: linear-gradient(180deg, var(--button-bg-hover), var(--button-bg));
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      box-shadow: 0 8px 16px rgba(9, 58, 99, 0.2);
    }

    .language-button:hover,
    .language-button:focus-visible,
    .btn:hover,
    .btn:focus-visible,
    .task-button:hover,
    .task-button:focus-visible {
      transform: translateY(-2px);
      background: linear-gradient(180deg, #1a92da, #0d6eaa);
      box-shadow: 0 10px 22px rgba(9, 58, 99, 0.28);
      outline: 2px solid rgba(13, 110, 170, 0.35);
      outline-offset: 1px;
    }

    .language-button.active,
    .task-button.active { background: linear-gradient(180deg, #0f8adb, #0a5f96); }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 4px 10px rgba(9, 58, 99, 0.18);
    }

    .btn-secondary {
      background: linear-gradient(180deg, #7ea1bb, #5f829b);
    }

    .actions {
      margin-top: 1rem;
      display: flex;
      justify-content: flex-end;
      gap: .6rem;
    }

    .tabs {
      display: inline-flex;
      background: rgba(13, 110, 170, 0.1);
      border: 1px solid rgba(73, 119, 153, 0.3);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 1rem;
      gap: 4px;
    }

    .tab {
      border: 0;
      border-radius: 10px;
      padding: .65rem 1rem;
      background: transparent;
      color: #1f5377;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      color: #ffffff;
      background: linear-gradient(180deg, var(--button-bg-hover), var(--button-bg));
      box-shadow: 0 8px 16px rgba(9, 58, 99, 0.18);
    }

    .tab.required::after {
      content: " *";
      color: #ffe7a9;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .field-grid,
    .chem-grid,
    .task-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .task-grid { margin-top: .8rem; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      text-align: left;
    }

    label {
      color: #174e78;
      font-weight: 700;
      font-size: .95rem;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--field-border);
      border-radius: 10px;
      padding: .72rem .78rem;
      font-size: 1rem;
      color: #083154;
      background: rgba(255, 255, 255, 0.95);
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--field-focus);
      box-shadow: 0 0 0 3px rgba(13, 110, 170, 0.16);
    }

    input.invalid,
    select.invalid {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.16);
    }

    .error {
      min-height: 18px;
      color: var(--error);
      font-size: .86rem;
      margin: 0;
    }

    .note {
      margin: .95rem 0 .2rem;
      border-left: 4px solid #c48a1f;
      background: rgba(255, 204, 102, 0.18);
      color: var(--warning);
      border-radius: 8px;
      padding: .65rem .75rem;
      font-size: .9rem;
    }

    .chem-block,
    .summary-card,
    .effluent-block {
      border: 1px solid rgba(73, 119, 153, 0.28);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.72);
      padding: .9rem;
    }

    .chem-name {
      margin: 0 0 .7rem;
      font-size: 1.02rem;
      color: #0b4f7f;
      font-weight: 700;
    }

    .chem-name small {
      font-weight: 600;
      color: #5b7b96;
    }

    .summary-card {
      margin-top: .8rem;
      background: rgba(238, 248, 255, 0.95);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: .8rem;
      padding: .3rem 0;
      font-size: .95rem;
      color: #1b4d73;
    }

    .summary-row strong { color: #0e3f66; }

    .effluent-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: .7rem;
    }

    .effluent-controls {
      display: flex;
      gap: .5rem;
    }

    .icon-btn {
      border: none;
      border-radius: 10px;
      width: 34px;
      height: 34px;
      font-size: 1.2rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      background: linear-gradient(180deg, #1a92da, #0d6eaa);
      box-shadow: 0 6px 12px rgba(9, 58, 99, 0.22);
    }

    .icon-btn.remove {
      background: linear-gradient(180deg, #d66e6e, #bf4141);
    }

    .warning-box {
      margin-top: .75rem;
      border-left: 4px solid #c48a1f;
      background: rgba(255, 204, 102, 0.22);
      color: var(--warning);
      border-radius: 8px;
      padding: .6rem .75rem;
      font-size: .9rem;
      font-weight: 600;
    }

    @media (max-width: 700px) {
      .app { padding-top: 6.8rem; }
      .screen { border-radius: 16px; }
      .language-buttons,
      .field-grid,
      .chem-grid,
      .task-grid { grid-template-columns: 1fr; }
      .actions { justify-content: stretch; }
      .actions .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="background-image"></div>
    <div class="background-logo"></div>
    <div class="overlay"></div>
    <img src="POSCO_logo.svg" alt="POSCO" class="top-logo" />

    <section id="screen-language" class="screen active">
      <header class="header">
        <h1 class="title" data-i18n="languageTitle"></h1>
        <p class="subtitle" data-i18n="languageSubtitle"></p>
      </header>
      <p class="language-label" data-i18n="languageLabel"></p>
      <div class="language-buttons">
        <button class="language-button" data-lang="es">Español</button>
        <button class="language-button" data-lang="en">English</button>
        <button class="language-button" data-lang="ko">한국어</button>
      </div>
      <div class="actions">
        <button id="btn-language-next" class="btn" data-i18n="next"></button>
      </div>
    </section>

    <section id="screen-task" class="screen">
      <header class="header">
        <h2 class="title" data-i18n="taskTitle"></h2>
        <p class="subtitle" data-i18n="taskSubtitle"></p>
      </header>
      <div class="task-grid">
        <button class="task-button" data-task="Recepción de Efluentes" data-i18n="taskEffluent"></button>
        <button class="task-button" data-task="Acondicionamiento de la pileta" data-i18n="taskConditioning"></button>
      </div>
      <div class="actions">
        <button id="btn-task-back" class="btn btn-secondary" data-i18n="back"></button>
        <button id="btn-task-next" class="btn" data-i18n="next" disabled></button>
      </div>
    </section>

    <section id="screen-variables" class="screen">
      <header class="header">
        <h2 class="title" data-i18n="variablesTitle"></h2>
        <p class="subtitle" id="task-subtitle"></p>
      </header>

      <div id="tabs-container" class="tabs"></div>

      <div id="panel-tank" class="panel active">
        <div class="chem-block">
          <h3 class="chem-name" data-i18n="tankTitle"></h3>
          <div class="field-grid">
            <div class="field">
              <label for="tank-level" data-i18n="levelLabel"></label>
              <input id="tank-level" type="number" min="0" step="0.01" placeholder="1200 - 4000" />
              <p id="level-error" class="error"></p>
            </div>
            <div class="field">
              <label data-i18n="equivalentVolume"></label>
              <input id="tank-volume" type="text" disabled />
              <p class="error"></p>
            </div>
            <div class="field">
              <label for="tank-ph">pH</label>
              <input id="tank-ph" type="number" min="0" max="14" step="0.01" placeholder="0 - 14" />
              <p id="ph-error" class="error"></p>
            </div>
          </div>
        </div>
      </div>

      <div id="panel-chemicals" class="panel">
        <div class="chem-grid">
          <div class="chem-block">
            <h3 class="chem-name">Neutralizante ácido <small>(H2SO4)</small></h3>
            <div class="field">
              <label for="acid-concentration" data-i18n="concentration"></label>
              <select id="acid-concentration">
                <option value="98">98%</option><option value="90">90%</option>
                <option value="80">80%</option><option value="70">70%</option>
                <option value="60">60%</option><option value="50">50%</option>
                <option value="40">40%</option><option value="30">30%</option>
              </select>
            </div>
          </div>
          <div class="chem-block">
            <h3 class="chem-name">Neutralizante básico <small>(NaOH)</small></h3>
            <div class="field">
              <label for="base-concentration" data-i18n="concentration"></label>
              <select id="base-concentration">
                <option value="10">10%</option><option value="20">20%</option>
                <option value="30" selected>30%</option><option value="40">40%</option>
                <option value="50">50%</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div id="panel-effluents" class="panel">
        <div id="effluents-list"></div>
        <div class="actions" style="margin-top:.7rem;justify-content:flex-start;">
          <button id="btn-add-effluent" class="icon-btn" aria-label="Agregar efluente">+</button>
        </div>
        <div class="summary-card">
          <div class="summary-row"><span data-i18n="totalEffluentVolume"></span><strong id="total-effluent-volume">0 m3</strong></div>
          <div class="summary-row"><span data-i18n="totalLevelIncrease"></span><strong id="total-level-increase">0 mm</strong></div>
          <div class="summary-row"><span data-i18n="estimatedFinalLevel"></span><strong id="final-level">0 mm</strong></div>
          <div class="summary-row"><span data-i18n="estimatedFinalVolume"></span><strong id="final-volume">0 m3</strong></div>
        </div>
        <div id="effluent-error" class="error"></div>
        <div id="high-level-warning" class="warning-box" style="display:none"></div>
      </div>

      <p id="conditioning-note" class="note" style="display:none" data-i18n="conditioningNote"></p>

      <div class="actions">
        <button id="btn-variables-back" class="btn btn-secondary" data-i18n="back"></button>
        <button id="btn-variables-next" class="btn" data-i18n="next" disabled></button>
      </div>
    </section>

    <section id="screen-placeholder" class="screen">
      <header class="header">
        <h2 class="title" data-i18n="placeholderTitle"></h2>
      </header>
      <p class="subtitle" data-i18n="placeholderSubtitle"></p>
    </section>
  </main>

  <script>
    const MM_PER_10_M3 = 166.66;
    const MM_PER_M3 = MM_PER_10_M3 / 10;
    const M3_PER_MM = 10 / MM_PER_10_M3;

    let selectedLanguage = 'es';
    let selectedTask = '';

    let tankState = {
      levelMm: null,
      volumeM3: null,
      ph: null,
    };

    let chemicals = {
      acidName: 'H2SO4',
      acidConcentration: 98,
      baseName: 'NaOH',
      baseConcentration: 30,
    };

    let effluents = [{ type: '', volumeM3: null, levelIncreaseMm: null }];

    let totalEffluentVolumeM3 = 0;
    let totalLevelIncreaseMm = 0;
    let finalLevelMm = 0;
    let finalVolumeM3 = 0;

    const i18n = {
      es: {
        languageTitle: 'Calculadora pH | WWB', languageSubtitle: 'Seleccione el idioma para continuar.', languageLabel: 'Idioma',
        taskTitle: 'Selección de tarea', taskSubtitle: 'Elija la operación a realizar.', taskEffluent: 'Recepción de Efluentes',
        taskConditioning: 'Acondicionamiento de la pileta', variablesTitle: 'Introducción de variables',
        tankTitle: 'Estado de la pileta WWB', levelLabel: 'Altura (mm)', equivalentVolume: 'Volumen equivalente (m3)',
        concentration: 'Concentración', next: 'Siguiente', back: 'Volver',
        tabTank: 'Estado de la pileta WWB', tabChemicals: 'Químicos', tabEffluents: 'Efluentes',
        levelLow: 'La pileta tiene nivel bajo.', levelHigh: 'La pileta está muy alta.',
        levelRangeError: 'La altura debe estar entre 1200 y 4000 mm.',
        phRangeError: 'El pH debe estar entre 0 y 14.',
        effluentType: 'Selección de efluente', effluentVolume: 'Volumen (m3)', addEffluent: 'Agregar efluente',
        estimatedIncrease: 'Incremento estimado (mm)', estimatedFinalLevel: 'Estado final estimado (mm)',
        estimatedFinalVolume: 'Volumen final estimado (m3)', totalEffluentVolume: 'Volumen total de efluentes',
        totalLevelIncrease: 'Incremento total de altura',
        effluentRequired: 'Debe cargar al menos un efluente válido y sin campos incompletos.',
        highLevelWarning: 'Advertencia: el estado final estimado supera 4000 mm.',
        conditioningNote: "NOTA: si hubo cambio de reactivos, modificar en la pestaña 'Químicos'.",
        placeholderTitle: 'Pantalla temporal', placeholderSubtitle: 'Próximo paso en construcción.',
      },
      en: {
        languageTitle: 'pH Calculator | WWB', languageSubtitle: 'Select language to continue.', languageLabel: 'Language',
        taskTitle: 'Task selection', taskSubtitle: 'Choose the operation to perform.', taskEffluent: 'Effluent Reception',
        taskConditioning: 'Pool Conditioning', variablesTitle: 'Variable input',
        tankTitle: 'WWB pool status', levelLabel: 'Level (mm)', equivalentVolume: 'Equivalent volume (m3)', concentration: 'Concentration',
        next: 'Next', back: 'Back', tabTank: 'WWB pool status', tabChemicals: 'Chemicals', tabEffluents: 'Effluents',
        levelLow: 'Pool level is low.', levelHigh: 'Pool level is too high.', levelRangeError: 'Level must be between 1200 and 4000 mm.',
        phRangeError: 'pH must be between 0 and 14.', effluentType: 'Effluent selection', effluentVolume: 'Volume (m3)',
        addEffluent: 'Add effluent', estimatedIncrease: 'Estimated increase (mm)', estimatedFinalLevel: 'Estimated final level (mm)',
        estimatedFinalVolume: 'Estimated final volume (m3)', totalEffluentVolume: 'Total effluent volume', totalLevelIncrease: 'Total level increase',
        effluentRequired: 'At least one valid effluent is required and all blocks must be complete.',
        highLevelWarning: 'Warning: estimated final level exceeds 4000 mm.',
        conditioningNote: "NOTE: if reagents changed, update the 'Chemicals' tab.",
        placeholderTitle: 'Temporary screen', placeholderSubtitle: 'Next step under construction.',
      },
      ko: {
        languageTitle: 'pH 계산기 | WWB', languageSubtitle: '계속하려면 언어를 선택하세요.', languageLabel: '언어',
        taskTitle: '작업 선택', taskSubtitle: '수행할 작업을 선택하세요.', taskEffluent: '폐수 유입',
        taskConditioning: '수조 컨디셔닝', variablesTitle: '변수 입력', tankTitle: 'WWB 수조 상태',
        levelLabel: '수위 (mm)', equivalentVolume: '환산 부피 (m3)', concentration: '농도', next: '다음', back: '뒤로',
        tabTank: 'WWB 수조 상태', tabChemicals: '약품', tabEffluents: '폐수',
        levelLow: '수조 수위가 낮습니다.', levelHigh: '수조 수위가 매우 높습니다.', levelRangeError: '수위는 1200~4000 mm 사이여야 합니다.',
        phRangeError: 'pH는 0~14 사이여야 합니다.', effluentType: '폐수 선택', effluentVolume: '부피 (m3)', addEffluent: '폐수 추가',
        estimatedIncrease: '예상 수위 증가 (mm)', estimatedFinalLevel: '예상 최종 수위 (mm)', estimatedFinalVolume: '예상 최종 부피 (m3)',
        totalEffluentVolume: '총 폐수 부피', totalLevelIncrease: '총 수위 증가',
        effluentRequired: '유효한 폐수 1개 이상이 필요하며 모든 블록이 완전해야 합니다.',
        highLevelWarning: '경고: 예상 최종 수위가 4000 mm를 초과합니다.',
        conditioningNote: "참고: 시약이 변경되었으면 '약품' 탭에서 수정하세요.",
        placeholderTitle: '임시 화면', placeholderSubtitle: '다음 단계는 준비 중입니다.',
      },
    };

    const screens = {
      language: document.getElementById('screen-language'),
      task: document.getElementById('screen-task'),
      variables: document.getElementById('screen-variables'),
      placeholder: document.getElementById('screen-placeholder'),
    };

    const tabsContainer = document.getElementById('tabs-container');
    const panelTank = document.getElementById('panel-tank');
    const panelChemicals = document.getElementById('panel-chemicals');
    const panelEffluents = document.getElementById('panel-effluents');
    const taskSubtitle = document.getElementById('task-subtitle');
    const conditioningNote = document.getElementById('conditioning-note');

    const tankLevelInput = document.getElementById('tank-level');
    const tankVolumeInput = document.getElementById('tank-volume');
    const tankPhInput = document.getElementById('tank-ph');
    const levelError = document.getElementById('level-error');
    const phError = document.getElementById('ph-error');

    const acidConcentration = document.getElementById('acid-concentration');
    const baseConcentration = document.getElementById('base-concentration');

    const effluentsList = document.getElementById('effluents-list');
    const addEffluentBtn = document.getElementById('btn-add-effluent');
    const effluentError = document.getElementById('effluent-error');
    const highLevelWarning = document.getElementById('high-level-warning');

    const totalEffluentVolumeEl = document.getElementById('total-effluent-volume');
    const totalLevelIncreaseEl = document.getElementById('total-level-increase');
    const finalLevelEl = document.getElementById('final-level');
    const finalVolumeEl = document.getElementById('final-volume');

    function t(key) {
      return i18n[selectedLanguage][key] ?? i18n.es[key] ?? key;
    }

    function translateStatic() {
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        el.textContent = t(el.dataset.i18n);
      });
      renderDynamicTexts();
    }

    function renderDynamicTexts() {
      taskSubtitle.textContent = selectedTask || '';
      document.getElementById('btn-add-effluent').title = t('addEffluent');
      highLevelWarning.textContent = t('highLevelWarning');
    }

    function showScreen(name) {
      Object.values(screens).forEach((screen) => screen.classList.remove('active'));
      screens[name].classList.add('active');
    }

    function mmToM3(mm) {
      return mm * M3_PER_MM;
    }

    function m3ToMm(m3) {
      return m3 * MM_PER_M3;
    }

    function round2(value) {
      return Number.isFinite(value) ? Number(value.toFixed(2)) : 0;
    }

    function setupTabs() {
      tabsContainer.innerHTML = '';
      const tankTab = createTab('tank', t('tabTank'), true);
      tabsContainer.appendChild(tankTab);

      if (selectedTask === 'Recepción de Efluentes') {
        tabsContainer.appendChild(createTab('effluents', t('tabEffluents'), true));
        panelChemicals.classList.remove('active');
      } else {
        tabsContainer.appendChild(createTab('chemicals', t('tabChemicals'), false));
        panelEffluents.classList.remove('active');
      }

      setActiveTab('tank');
      conditioningNote.style.display = selectedTask === 'Acondicionamiento de la pileta' ? 'block' : 'none';
      addEffluentBtn.style.display = selectedTask === 'Recepción de Efluentes' ? 'inline-flex' : 'none';
    }

    function createTab(target, label, required = false) {
      const button = document.createElement('button');
      button.className = `tab ${required ? 'required' : ''}`;
      button.textContent = label;
      button.dataset.target = target;
      button.addEventListener('click', () => setActiveTab(target));
      return button;
    }

    function setActiveTab(target) {
      tabsContainer.querySelectorAll('.tab').forEach((tab) => tab.classList.toggle('active', tab.dataset.target === target));
      panelTank.classList.toggle('active', target === 'tank');
      panelChemicals.classList.toggle('active', target === 'chemicals');
      panelEffluents.classList.toggle('active', target === 'effluents');
    }

    function renderEffluents() {
      effluentsList.innerHTML = '';
      effluents.forEach((item, index) => {
        const block = document.createElement('div');
        block.className = 'effluent-block';
        block.style.marginBottom = '.7rem';

        const title = document.createElement('div');
        title.className = 'effluent-header';
        title.innerHTML = `<strong>${t('tabEffluents')} #${index + 1}</strong>`;

        const controls = document.createElement('div');
        controls.className = 'effluent-controls';
        if (index === effluents.length - 1 && effluents.length < 4) {
          const addBtn = document.createElement('button');
          addBtn.className = 'icon-btn';
          addBtn.textContent = '+';
          addBtn.title = t('addEffluent');
          addBtn.addEventListener('click', addEffluent);
          controls.appendChild(addBtn);
        }
        if (effluents.length > 1) {
          const removeBtn = document.createElement('button');
          removeBtn.className = 'icon-btn remove';
          removeBtn.textContent = '−';
          removeBtn.addEventListener('click', () => {
            effluents.splice(index, 1);
            renderEffluents();
            validateAll();
          });
          controls.appendChild(removeBtn);
        }
        title.appendChild(controls);
        block.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'field-grid';

        const typeField = document.createElement('div');
        typeField.className = 'field';
        typeField.innerHTML = `<label>${t('effluentType')}</label>`;
        const typeSelect = document.createElement('select');
        ['', 'LH', 'IX', 'BPED', 'LS'].forEach((opt) => {
          const o = document.createElement('option');
          o.value = opt;
          o.textContent = opt || '--';
          typeSelect.appendChild(o);
        });
        typeSelect.value = item.type || '';
        typeSelect.addEventListener('change', () => {
          item.type = typeSelect.value;
          validateAll();
        });
        typeField.appendChild(typeSelect);

        const volField = document.createElement('div');
        volField.className = 'field';
        volField.innerHTML = `<label>${t('effluentVolume')}</label>`;
        const volInput = document.createElement('input');
        volInput.type = 'number';
        volInput.step = '0.01';
        volInput.min = '0';
        volInput.value = item.volumeM3 ?? '';
        volInput.addEventListener('input', () => {
          const vol = Number(volInput.value);
          item.volumeM3 = Number.isFinite(vol) && volInput.value !== '' ? vol : null;
          item.levelIncreaseMm = item.volumeM3 !== null ? round2(m3ToMm(item.volumeM3)) : null;
          renderEffluentSummary();
          validateAll();
        });
        volField.appendChild(volInput);

        grid.append(typeField, volField);
        block.appendChild(grid);

        const sum = document.createElement('div');
        sum.className = 'summary-card';
        const inc = item.levelIncreaseMm ?? 0;
        sum.innerHTML = `
          <div class="summary-row"><span>${t('estimatedIncrease')}</span><strong>${round2(inc)} mm</strong></div>
          <div class="summary-row"><span>${t('estimatedFinalLevel')}</span><strong>${round2((tankState.levelMm || 0) + totalLevelIncreaseMm)} mm</strong></div>
          <div class="summary-row"><span>${t('estimatedFinalVolume')}</span><strong>${round2(mmToM3((tankState.levelMm || 0) + totalLevelIncreaseMm))} m3</strong></div>
        `;
        block.appendChild(sum);

        effluentsList.appendChild(block);
      });

      addEffluentBtn.style.display = 'none';
      renderEffluentSummary();
    }

    function addEffluent() {
      if (effluents.length >= 4) return;
      effluents.push({ type: '', volumeM3: null, levelIncreaseMm: null });
      renderEffluents();
      validateAll();
    }

    function renderEffluentSummary() {
      totalEffluentVolumeM3 = round2(effluents.reduce((acc, item) => acc + (Number(item.volumeM3) || 0), 0));
      totalLevelIncreaseMm = round2(effluents.reduce((acc, item) => acc + (Number(item.levelIncreaseMm) || 0), 0));

      finalLevelMm = round2((tankState.levelMm || 0) + totalLevelIncreaseMm);
      finalVolumeM3 = round2(mmToM3(finalLevelMm));

      totalEffluentVolumeEl.textContent = `${totalEffluentVolumeM3} m3`;
      totalLevelIncreaseEl.textContent = `${totalLevelIncreaseMm} mm`;
      finalLevelEl.textContent = `${finalLevelMm} mm`;
      finalVolumeEl.textContent = `${finalVolumeM3} m3`;

      highLevelWarning.style.display = selectedTask === 'Recepción de Efluentes' && finalLevelMm > 4000 ? 'block' : 'none';
    }

    function validateTank() {
      const mm = Number(tankLevelInput.value);
      const ph = Number(tankPhInput.value);
      let valid = true;

      if (!Number.isFinite(mm)) {
        levelError.textContent = t('levelRangeError');
        tankLevelInput.classList.add('invalid');
        valid = false;
      } else if (mm < 1200) {
        levelError.textContent = t('levelLow');
        tankLevelInput.classList.add('invalid');
        valid = false;
      } else if (mm > 4000) {
        levelError.textContent = t('levelHigh');
        tankLevelInput.classList.add('invalid');
        valid = false;
      } else {
        levelError.textContent = '';
        tankLevelInput.classList.remove('invalid');
      }

      if (!Number.isFinite(ph) || ph < 0 || ph > 14) {
        phError.textContent = t('phRangeError');
        tankPhInput.classList.add('invalid');
        valid = false;
      } else {
        phError.textContent = '';
        tankPhInput.classList.remove('invalid');
      }

      tankState.levelMm = Number.isFinite(mm) ? round2(mm) : null;
      tankState.volumeM3 = Number.isFinite(mm) ? round2(mmToM3(mm)) : null;
      tankState.ph = Number.isFinite(ph) ? round2(ph) : null;

      tankVolumeInput.value = tankState.volumeM3 !== null ? `${tankState.volumeM3} m3` : '--';
      renderEffluentSummary();
      return valid;
    }

    function validateEffluents() {
      if (selectedTask !== 'Recepción de Efluentes') {
        effluentError.textContent = '';
        return true;
      }

      const completeValid = effluents.filter((item) => item.type && Number(item.volumeM3) > 0);
      const hasIncomplete = effluents.some((item) => !item.type || !(Number(item.volumeM3) > 0));
      const isValid = completeValid.length > 0 && !hasIncomplete;

      effluentError.textContent = isValid ? '' : t('effluentRequired');
      return isValid;
    }

    function validateAll() {
      const tankValid = validateTank();
      const effluentsValid = validateEffluents();
      document.getElementById('btn-variables-next').disabled = !(tankValid && effluentsValid);
    }

    function loadVariablesScreen() {
      setupTabs();
      translateStatic();
      renderEffluents();
      validateAll();
      showScreen('variables');
    }

    document.querySelectorAll('.language-button').forEach((button) => {
      button.addEventListener('click', () => {
        selectedLanguage = button.dataset.lang;
        document.querySelectorAll('.language-button').forEach((b) => b.classList.toggle('active', b === button));
        translateStatic();
      });
    });

    document.getElementById('btn-language-next').addEventListener('click', () => {
      showScreen('task');
    });

    document.querySelectorAll('.task-button').forEach((button) => {
      button.addEventListener('click', () => {
        selectedTask = button.dataset.task;
        document.querySelectorAll('.task-button').forEach((b) => b.classList.toggle('active', b === button));
        document.getElementById('btn-task-next').disabled = !selectedTask;
      });
    });

    document.getElementById('btn-task-back').addEventListener('click', () => showScreen('language'));
    document.getElementById('btn-task-next').addEventListener('click', () => loadVariablesScreen());
    document.getElementById('btn-variables-back').addEventListener('click', () => showScreen('task'));

    tankLevelInput.addEventListener('input', validateAll);
    tankPhInput.addEventListener('input', validateAll);

    acidConcentration.addEventListener('change', () => {
      chemicals.acidConcentration = Number(acidConcentration.value);
    });

    baseConcentration.addEventListener('change', () => {
      chemicals.baseConcentration = Number(baseConcentration.value);
    });

    addEffluentBtn.addEventListener('click', addEffluent);

    document.getElementById('btn-variables-next').addEventListener('click', () => {
      chemicals.acidConcentration = Number(acidConcentration.value);
      chemicals.baseConcentration = Number(baseConcentration.value);

      const fullState = {
        selectedLanguage,
        selectedTask,
        tankState,
        chemicals,
        effluents,
        totalEffluentVolumeM3,
        totalLevelIncreaseMm,
        finalLevelMm,
        finalVolumeM3,
      };

      console.log('Estado calculado:', fullState);
      showScreen('placeholder');
    });

    translateStatic();
    document.querySelector('.language-button[data-lang="es"]').classList.add('active');
  </script>
</body>
</html>

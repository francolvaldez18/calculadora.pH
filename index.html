<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora pH</title>
    <style>
      :root { --overlay-color: rgba(255,255,255,.76); --panel-color: rgba(255,255,255,.88); --text-primary:#093a63; --text-secondary:#325f83; --button-bg:#0d6eaa; --button-bg-hover:#1285cb; --border:rgba(73,119,153,.25); --danger:#b8302d; --warning:#9b6200; }
      *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:"Segoe UI","Roboto",Arial,sans-serif;color:var(--text-primary);background:#e9edf2}
      .app-screen{position:relative;min-height:100vh;display:grid;place-items:center;padding:7.2rem 1.25rem 1.8rem;overflow:hidden}
      .background-image{position:absolute;inset:0;z-index:-3;background:radial-gradient(circle at 20% 20%, rgba(13,110,170,.12), transparent 35%),radial-gradient(circle at 80% 40%, rgba(13,110,170,.08), transparent 38%),linear-gradient(180deg,#f5f7fa 0%,#e8edf3 100%)}
      .background-logo{position:absolute;inset:0;z-index:-2;opacity:.12;background:none}
      .overlay{position:absolute;inset:0;background:var(--overlay-color);z-index:-1}
      .top-logo{position:absolute;top:.6rem;left:50%;transform:translateX(-50%);width:min(210px,46vw);max-height:74px;object-fit:contain;mix-blend-mode:multiply;filter:drop-shadow(0 4px 8px rgba(5,43,72,.12));z-index:2;pointer-events:none}
      .content{position:relative;z-index:1;width:min(1040px,100%);background:var(--panel-color);border:1px solid var(--border);border-radius:20px;padding:clamp(1rem,2.8vw,1.8rem);box-shadow:0 18px 35px rgba(9,58,99,.12)}
      .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.tab{border:1px solid rgba(13,110,170,.25);padding:7px 11px;border-radius:999px;font-size:.84rem;color:var(--text-secondary);font-weight:600;background:rgba(255,255,255,.75)}.tab.active{color:var(--button-bg);background:rgba(13,110,170,.13);border-color:rgba(13,110,170,.42)}
      .screen{display:none}.screen.active{display:block} h3{margin:0 0 10px;font-size:1.04rem}
      .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .field{display:flex;flex-direction:column;gap:5px} label{font-size:.84rem;color:var(--text-secondary);font-weight:600}
      input,select{border:1px solid rgba(73,119,153,.28);border-radius:10px;padding:9px 10px;background:#fff;color:var(--text-primary);width:100%}
      .input-invalid{border:2px solid var(--danger);background:#fff7f7}.btn{border:none;border-radius:12px;padding:.8rem 1rem;font-size:.96rem;font-weight:700;color:#fff;background:linear-gradient(180deg,var(--button-bg-hover),var(--button-bg));cursor:pointer;box-shadow:0 8px 16px rgba(9,58,99,.2)}.btn:disabled{opacity:.55;cursor:not-allowed}
      .choice-buttons{display:grid;grid-template-columns:repeat(2,minmax(140px,1fr));gap:.8rem}.choice-button{border:2px solid #0d6eaa;border-radius:12px;padding:.9rem 1rem;font-size:clamp(1.02rem,1.8vw,1.12rem);font-weight:800;color:#0d6eaa;background:#fff;box-shadow:0 8px 16px rgba(9,58,99,.2);cursor:pointer}.choice-button.active{background:linear-gradient(180deg,#1285cb,#0d6eaa);color:#fff}
      .card{border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.84);padding:11px}.card h4{margin:0 0 6px;font-size:.9rem;color:var(--button-bg)}.dose-card{text-align:center;margin-top:10px}.dose-type{font-size:1.05rem;font-weight:700;color:var(--text-secondary)}.dose-value{font-size:2.35rem;font-weight:800;color:var(--button-bg);line-height:1.2}
      .kpi{margin-top:10px;border:1px solid rgba(13,110,170,.35);border-radius:12px;background:rgba(13,110,170,.1);padding:12px}.kpi-label{font-size:.84rem;color:var(--text-secondary)}.kpi-value{font-size:1.8rem;font-weight:800;color:var(--button-bg)}
      .notice{margin-top:8px;font-size:.88rem;color:var(--text-secondary)}.error{margin-top:6px;font-size:.85rem;color:var(--danger)}.warn{color:var(--warning);font-weight:700}
      .welcome-main{text-align:center;padding:clamp(.6rem,1.5vw,1rem) 0}.welcome-main h2{margin:0;font-size:clamp(1.35rem,2.5vw,2.15rem);line-height:1.35}.welcome-description{margin:1rem auto 0;max-width:70ch;color:var(--text-secondary);font-size:clamp(.95rem,1.4vw,1.1rem);line-height:1.55}.language-label{margin-top:1.8rem;margin-bottom:1rem;font-weight:600;color:#174e78;font-size:clamp(1rem,1.8vw,1.2rem)}
      .language-buttons{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:.9rem}.language-button{border:2px solid #0d6eaa;border-radius:12px;padding:.95rem 1rem;font-size:clamp(1.08rem,2.2vw,1.2rem);font-weight:800;color:#0d6eaa;background:#fff;box-shadow:0 8px 16px rgba(9,58,99,.2);cursor:pointer}.language-button.active{background:linear-gradient(180deg,#1285cb,#0d6eaa);color:#fff}
      .welcome-actions{margin-top:1.1rem;display:flex;justify-content:center}.welcome-next{min-width:min(280px,100%)} .top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.settings-panel{display:none;margin-top:10px}.settings-panel.open{display:block}
      .effluent-item{margin-top:12px;padding:10px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.65)}

    </style>
  </head>
  <body>
    <main class="app-screen">
      <div class="background-image" aria-hidden="true"></div>
      <div class="background-logo" aria-hidden="true"></div>
      <div class="overlay" aria-hidden="true"></div>
      <img class="top-logo" alt="Logo POSCO" src="POSCO_logo.svg" onerror="this.onerror=null;this.src='PoscoArg.png';" />
      <section class="content">
        <div class="tabs" id="tabs"></div>

        <section class="screen" id="screen-language">
          <div class="welcome-main">
            <h2 id="main-title"></h2><p class="welcome-description" id="main-description"></p><p class="language-label" id="language-label"></p>
            <div class="language-buttons"><button class="language-button" id="langBtnEn" data-lang="en"></button><button class="language-button" id="langBtnEs" data-lang="es"></button><button class="language-button" id="langBtnKo" data-lang="ko"></button></div>

        </section>

        <section class="screen" id="screen-task"><h3 data-i18n="taskTitle"></h3><div class="choice-buttons"><button class="choice-button" id="taskReceptionBtn" data-task="Recepción de Efluentes" type="button"></button><button class="choice-button" id="taskConditioningBtn" data-task="Acondicionamiento de la pileta" type="button"></button></div></section>

        <section class="screen" id="screen-state">
          <div class="top-row"><h3 data-i18n="tankTitleWWB"></h3><button class="btn" id="settingsBtn" type="button">⚙️ <span data-i18n="settingsBtn"></span></button></div>
          <div class="grid">
            <div class="field"><label data-i18n="levelMm"></label><input id="tankLevelMm" type="number" step="0.01" placeholder="1200 - 4000" /><div id="levelError" class="error"></div></div>
            <div class="field"><label data-i18n="phLabel"></label><input id="tankPh" type="number" step="0.01" placeholder="0 - 14" /><div id="phError" class="error"></div></div>
          </div>
          <div class="notice" id="estimatedVolume"></div><div class="notice" data-i18n="volumeHint"></div>
          <div class="settings-panel" id="settingsPanel">
            <h3 data-i18n="chemicalsOptionalTitle"></h3>
            <div class="grid"><div class="field"><label data-i18n="naohConcentration"></label><select id="naohPct"></select></div><div class="field"><label data-i18n="h2so4Concentration"></label><select id="h2so4Pct"></select></div></div>
          </div>
        </section>

        <section class="screen" id="screen-effluents">
          <div class="top-row"><h3 data-i18n="effluentsTitle"></h3><button class="btn" id="addEffluentBtn" type="button">+ <span data-i18n="addEffluent"></span></button></div>
          <div id="effluentList"></div>
        </section>

        <section class="screen" id="screen-results">
          <h3 data-i18n="resultsTitle"></h3>
          <div class="cards"><div class="card"><h4 data-i18n="stateCard"></h4><div id="stateSummary"></div></div><div class="card"><h4 data-i18n="methodCard"></h4><div id="methodSummary"></div></div><div class="card"><h4 data-i18n="reagentCard"></h4><div id="reagentSummary"></div></div><div class="card"><h4 data-i18n="calcCard"></h4><div id="calcSummary"></div></div></div>
          <div class="card" id="modeBlock" style="display:none;margin-top:10px;"><h4 data-i18n="neutralizationMode"></h4><div class="grid"><div class="field"><label data-i18n="modeLabel"></label><div class="choice-buttons"><button class="choice-button" id="modeChemBtn" data-mode="chemicals" type="button"></button><button class="choice-button" id="modeEffBtn" data-mode="effluent" type="button"></button></div></div><div class="field" id="neutralizerPhField" style="display:none;"><label id="neutralizerPhLabel"></label><input id="neutralizerPh" type="number" min="0" max="14" step="0.01" placeholder="0 - 14" /><div id="neutralizerPhError" class="error"></div></div></div></div>
          <div class="card dose-card" id="conditioningDoseCard" style="display:none;"><h4 data-i18n="conditioningDoseTitle"></h4><div class="dose-type" id="conditioningDoseType">-</div><div class="dose-value" id="conditioningDoseValue">-</div></div><div class="kpi"><div class="kpi-label" data-i18n="requiredAmount"></div><div class="kpi-value" id="requiredKpi">-</div></div><div class="notice" data-i18n="idealLegend"></div><div class="notice" id="conditioningNote" style="display:none;"></div><div class="notice warn" id="overflowWarn" style="display:none;"></div>
        </section>

        <div class="nav" id="globalNav"><button class="btn" id="btnHome" data-i18n="homeBtn"></button><div class="nav-right"><button class="btn" id="btnBack" data-i18n="backBtn"></button><button class="btn" id="btnNext" data-i18n="nextBtn"></button></div></div>
        <div id="screenError" class="error"></div>
      </section>
    </main>

eferencePhLabel:'pH referencia',volumeLabel:'Volumen',levelDeltaLabel:'Δ nivel',projectedLevelLabel:'Nivel proyectado',welcomeTitle:'Calculadora pH - WWT - Utilities - Departamento de Producción LH Güemes',welcomeDescription:'Cálculo de reactivo de neutralización para la planta de tratamiento de aguas.',selectLanguageText:'Seleccionar idioma',langEnglish:'English',langSpanish:'Español',langKorean:'한국어',newTankLevel:'Altura nueva de la pileta',newTankPh:'pH nuevo de la pileta',conditioningPumpNote:'* Considerando que la adición de la bomba sumergible representa 2 m3.',calcError:'No se pudo calcular el resultado técnico.',minAdjustment:'Ajuste mínimo / no requerido.',conditioningDoseTitle:'Reactivo para neutralizar (L)'},
        en:{taskTitle:'Task selection',taskReception:'Effluent Reception',taskConditioning:'Tank Conditioning',tankTitleWWB:'WWB tank state',levelMm:'Level (mm)',phLabel:'pH',volumeHint:'Fixed reference: 10 m³ = 166.66 mm.',estimatedVolume:'Estimated volume: {value} m³',settingsBtn:'Settings',chemicalsOptionalTitle:'Chemicals (optional)',naohConcentration:'NaOH concentration (% w/w)',h2so4Concentration:'H2SO4 concentration (% w/w)',effluentsTitle:'Incoming effluents',addEffluent:'Add effluent',effluentName:'Effluent',effVol:'Volume (m³)',effPh:'pH',effTypeAuto:'Type (automatic)',acidic:'Acidic',basic:'Basic',neutral:'Neutral',resultsTitle:'Results',stateCard:'Current/final tank state',methodCard:'Neutralization mode',reagentCard:'Required reagent/effluent',calcCard:'Technical calculation data',neutralizationMode:'Neutralization mode',modeLabel:'Mode',modeChemicals:'Chemicals',modeEffluent:'Effluent',requiredAmount:'Estimated required amount',idealLegend:'This is an ideal stoichiometric estimate and does not account for alkalinity, buffers, or side reactions.',homeBtn:'Home',backBtn:'Back',nextBtn:'Next',tabLanguage:'Language',tabTask:'Task',tabState:'State',tabEff:'Effluents',tabRes:'Results',errSelectTask:'Please select a task.',errPh:'pH must be between 0 and 14.',levelLow:'Tank level is low.',levelHigh:'Tank level is too high.',levelInvalid:'Enter a valid numeric level.',nearNeutral:'pH close to 7: minimal or no adjustment required.',species:'Neutralized species',eqNeutralize:'Estimated equivalents',methodCalc:'Method',overflow:'Warning: projected level exceeds tank maximum height.',neutralizerPhLH:'LH effluent pH (base)',neutralizerPhIX:'IX effluent pH (acid)',invalidNeutralizerPh:'Enter a valid pH between 0 and 14.',stoichMethodText:'Ideal stoichiometry with target pH',typeLabel:'Type',concentrationLabel:'Concentration',referencePhLabel:'Reference pH',volumeLabel:'Volume',levelDeltaLabel:'Level Δ',projectedLevelLabel:'Projected level',welcomeTitle:'pH Calculator - WWT - Utilities - LH Güemes Production Department',welcomeDescription:'Neutralization reagent calculation for the water treatment plant.',selectLanguageText:'Select language',langEnglish:'English',langSpanish:'Español',langKorean:'한국어',newTankLevel:'New tank height',newTankPh:'New tank pH',conditioningPumpNote:'* Considering that the submerged pump addition represents 2 m3.',calcError:'Could not compute technical result.',minAdjustment:'Minimum adjustment / not required.',conditioningDoseTitle:'Reagent to neutralize (L)'},

      };

      const state={selectedLanguage:'es',selectedTask:'',tankState:{levelMm:2000,volumeM3:0,pH:7},chemicals:{naohPct:30,h2so4Pct:98},effluents:[{name:'LH',volumeM3:0,pH:7}],neutralization:{mode:'chemicals',referencePh:null}};
      let currentScreen='language';
      const $=id=>document.getElementById(id); const t=k=>tr[state.selectedLanguage][k]??k; const fmt=(v,n=3)=>Number(v).toFixed(n);
      const mmToM3=mm=>(Number(mm)||0)*(CAL.MM_EQ_M3_DEN/CAL.MM_EQ_M3_NUM); const m3ToL=m3=>(Number(m3)||0)*1000; const m3ToMm=m3=>(Number(m3)||0)*(CAL.MM_EQ_M3_NUM/CAL.MM_EQ_M3_DEN);
      const hFromPh=ph=>Math.pow(10,-Math.min(14,Math.max(0,Number(ph)||0))); const ohFromPh=ph=>Math.pow(10,-(14-Math.min(14,Math.max(0,Number(ph)||0))));
      const naohEqPerL=pct=>((CAL.naohDensity[pct]||CAL.naohDensity[30])*(pct/100)*1000)/CAL.PM_NAOH; const h2so4EqPerL=pct=>(((CAL.h2so4Density[pct]||CAL.h2so4Density[98])*(pct/100)*1000)/CAL.PM_H2SO4)*2;
      const flow=()=>state.selectedTask==='Recepción de Efluentes'?['language','task','state','effluents','results']:['language','task','state','results'];

      function effluentKind(ph){ if(ph>7) return 'basic'; if(ph<7) return 'acidic'; return 'neutral'; }
      function renderTabs(){ const m={language:'tabLanguage',task:'tabTask',state:'tabState',effluents:'tabEff',results:'tabRes'}; $('tabs').innerHTML=flow().map(s=>`<span class="tab ${s===currentScreen?'active':''}">${t(m[s])}</span>`).join(''); }
      function setError(msg){ $('screenError').textContent=msg; }
      function validateState(){
        const lRaw=$('tankLevelMm').value.trim(), pRaw=$('tankPh').value.trim();
        let lOk=true,pOk=true,lMsg='',pMsg='';
        const l=Number(lRaw), p=Number(pRaw);
        if(lRaw===''||Number.isNaN(l)){lOk=false;lMsg=t('levelInvalid')} else if(l<1200){lOk=false;lMsg=t('levelLow')} else if(l>4000){lOk=false;lMsg=t('levelHigh')}
        if(pRaw===''||Number.isNaN(p)||p<0||p>14){pOk=false;pMsg=t('errPh')}
        $('levelError').textContent=lMsg; $('phError').textContent=pMsg; $('tankLevelMm').classList.toggle('input-invalid',!lOk); $('tankPh').classList.toggle('input-invalid',!pOk);
        if(lOk) state.tankState.levelMm=l; if(pOk) state.tankState.pH=p; state.tankState.volumeM3=mmToM3(state.tankState.levelMm);
        $('estimatedVolume').textContent=t('estimatedVolume').replace('{value}',fmt(state.tankState.volumeM3,2));
        return lOk&&pOk;
      }
      function isValid(screen){
        if(screen==='task'&&!state.selectedTask){setError(t('errSelectTask'));return false;}
        if(screen==='state'&&!validateState()){setError('');return false;}
        if(screen==='effluents'){for(const e of state.effluents){if(!(e.volumeM3>=0)&&!(e.pH>=0&&e.pH<=14)){setError(t('errPh'));return false;} if(e.pH<0||e.pH>14){setError(t('errPh'));return false;}}}
        setError(''); return true;
      }
      function show(id){ currentScreen=id; ['language','task','state','effluents','results'].forEach(s=>$('screen-'+s).classList.toggle('active',s===id)); $('btnBack').disabled=id==='language'; const hide=id==='language'; $('tabs').style.display=hide?'none':'flex'; $('globalNav').style.display=hide?'none':'flex'; renderTabs(); $('btnNext').disabled=id==='state'?!validateState():false; }

      function renderEffluents(){
        const names=['LH','BPED','IX','LS'];
        $('effluentList').innerHTML=state.effluents.map((e,i)=>`<div class="effluent-item"><div class="grid grid-3"><div class="field"><label>${t('effluentName')} ${i+1}</label><select data-ix="${i}" data-f="name">${names.map(n=>`<option value="${n}" ${e.name===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>${t('effVol')}</label><input data-ix="${i}" data-f="volumeM3" type="number" min="0" step="0.01" placeholder=">= 0" value="${e.volumeM3}" /></div><div class="field"><label>${t('effPh')}</label><input data-ix="${i}" data-f="pH" type="number" min="0" max="14" step="0.01" placeholder="0 - 14" value="${e.pH}" /></div></div><div class="notice">${t('effTypeAuto')}: <b>${t(effluentKind(Number(e.pH)||7))}</b>${i>0?` &nbsp; <button class='btn' data-remove='${i}' type='button'>-</button>`:''}</div></div>`).join('');
        $('effluentList').querySelectorAll('[data-f]').forEach(el=>el.addEventListener('input',e=>{ const ix=Number(e.target.dataset.ix), f=e.target.dataset.f; state.effluents[ix][f]=f==='name'?e.target.value:Number(e.target.value)||0; renderEffluents(); renderResults(); }));
        $('effluentList').querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',()=>{ state.effluents.splice(Number(el.dataset.remove),1); renderEffluents(); renderResults(); }));
      }

      function mix(){ let totalM3=state.tankState.volumeM3,totalH=state.tankState.pH<7?hFromPh(state.tankState.pH)*m3ToL(state.tankState.volumeM3):0,totalOH=state.tankState.pH>7?ohFromPh(state.tankState.pH)*m3ToL(state.tankState.volumeM3):0; state.effluents.forEach(e=>{totalM3+=e.volumeM3; const l=m3ToL(e.volumeM3); if((Number(e.pH)||7)<7) totalH+=hFromPh(e.pH)*l; else if((Number(e.pH)||7)>7) totalOH+=ohFromPh(e.pH)*l;}); const totalL=m3ToL(totalM3); let ph=7; if(totalL>0){ if(totalH>totalOH) ph=-Math.log10(Math.max((totalH-totalOH)/totalL,1e-14)); else if(totalOH>totalH) ph=14+Math.log10(Math.max((totalOH-totalH)/totalL,1e-14)); } return {volumeM3:totalM3,levelMm:state.tankState.levelMm+m3ToMm(totalM3-state.tankState.volumeM3),pH:Math.min(14,Math.max(0,ph))}; }

      function calc(){
        const isConditioning=state.selectedTask==='Acondicionamiento de la pileta';
        if(isConditioning){
          const src={volumeM3:Math.max(0,mmToM3(state.tankState.levelMm)),levelMm:Math.max(0,Number(state.tankState.levelMm)||0),pH:Math.min(14,Math.max(0,Number(state.tankState.pH)||7))};
          const volumeL=m3ToL(src.volumeM3), hTarget=Math.pow(10,-CAL.PH_TARGET), ohTarget=Math.pow(10,-(14-CAL.PH_TARGET));
          let requiredType='', requiredConcentration=null, species='', reagentEqPerL=0, equivalentsToNeutralize=0;
          if(src.pH<7){
            species='H+';
            requiredType='NaOH';
            requiredConcentration=Number(state.chemicals.naohPct)||30;
            equivalentsToNeutralize=Math.max((hFromPh(src.pH)-hTarget)*volumeL,0);
            reagentEqPerL=Math.max(naohEqPerL(requiredConcentration),0);
          } else if(src.pH>7){
            species='OH-';
            requiredType='H2SO4';
            requiredConcentration=Number(state.chemicals.h2so4Pct)||98;
            equivalentsToNeutralize=Math.max((ohFromPh(src.pH)-ohTarget)*volumeL,0);
            reagentEqPerL=Math.max(h2so4EqPerL(requiredConcentration),0);
          }
          const requiredVolumeTheoreticalL=(reagentEqPerL>0)?(equivalentsToNeutralize/reagentEqPerL):0;
          const safeTheo=Number.isFinite(requiredVolumeTheoreticalL)&&requiredVolumeTheoreticalL>0?requiredVolumeTheoreticalL:0;
          const minimal=(Math.abs(src.pH-7)<1e-6)||safeTheo<0.5;
          const requiredVolumeFinalL=minimal?0:(safeTheo*1.25);
          const requiredVolumeFinalM3=requiredVolumeFinalL/1000;
          const pumpExtraM3=2;
          const finalTankVolumeM3=Math.max(0,src.volumeM3+requiredVolumeFinalM3+pumpExtraM3);
          const finalTankLevelMm=Math.max(0,finalTankVolumeM3*CAL.MM_PER_M3);
          const finalPh=7;
          const hasError=![src.volumeM3,reagentEqPerL,equivalentsToNeutralize,requiredVolumeFinalL,finalTankVolumeM3,finalTankLevelMm].every(v=>Number.isFinite(v));
          const result={targetPh:7,currentPh:src.pH,requiredType,requiredConcentration,equivalentsToNeutralize,reagentEqPerL,requiredVolumeTheoreticalL:safeTheo,requiredVolumeFinalL,requiredVolumeFinalM3,pumpExtraM3,finalTankVolumeM3,finalTankLevelMm,finalPh,minimal,hasError};
          state.neutralization={...state.neutralization,...result};
          return {isConditioning,src,mode:'chemicals',species,type:requiredType,conc:requiredConcentration,eqL:reagentEqPerL,eq:equivalentsToNeutralize,reqL:requiredVolumeFinalL,reqM3:requiredVolumeFinalM3,proj:finalTankLevelMm,result};
        }
        const src=state.selectedTask==='Recepción de Efluentes'?mix():{volumeM3:state.tankState.volumeM3,levelMm:state.tankState.levelMm,pH:state.tankState.pH};
        const mode=state.selectedTask==='Acondicionamiento de la pileta'?'chemicals':state.neutralization.mode;
        let eq=0,species='',type='',conc=null,ref=null,eqL=0;
        if(Math.abs(src.pH-7)>=.15){
          if(src.pH<7){eq=hFromPh(src.pH)*m3ToL(src.volumeM3);species='H+'; if(mode==='effluent'){type='LH';ref=state.neutralization.referencePh??12.5;eqL=ohFromPh(ref);} else {type='NaOH';conc=state.chemicals.naohPct;eqL=naohEqPerL(conc);} }
          else {eq=ohFromPh(src.pH)*m3ToL(src.volumeM3);species='OH-'; if(mode==='effluent'){type='IX';ref=state.neutralization.referencePh??1.5;eqL=hFromPh(ref);} else {type='H2SO4';conc=state.chemicals.h2so4Pct;eqL=h2so4EqPerL(conc);} }
        }
        const reqL=eqL>0?eq/eqL:0, reqM3=reqL/1000, dMm=m3ToMm(reqM3);
        return {isConditioning:false,src,mode,species,type,conc,ref,eqL,eq,reqL,reqM3,dMm,proj:src.levelMm+dMm};
      }

      function renderResults(){
        const n=calc();
        const isConditioning=state.selectedTask==='Acondicionamiento de la pileta';
        const methodCard=$('methodSummary').closest('.card'), reagentCard=$('reagentSummary').closest('.card'), calcCard=$('calcSummary').closest('.card');
        const kpiBlock=$('requiredKpi').closest('.kpi');
        const idealLegend=document.querySelector('[data-i18n="idealLegend"]');
        const conditioningDoseCard=$('conditioningDoseCard');
        $('conditioningNote').style.display=isConditioning?'block':'none';
        conditioningDoseCard.style.display=isConditioning?'block':'none';
        kpiBlock.style.display=isConditioning?'none':'block';
        if(idealLegend) idealLegend.style.display=isConditioning?'none':'block';
        $('conditioningNote').textContent=t('conditioningPumpNote');
        if(isConditioning){
          $('modeBlock').style.display='none';
          methodCard.style.display='none'; reagentCard.style.display='none'; calcCard.style.display='none';
          if(n.result.hasError){
            $('stateSummary').innerHTML=`<div class='warn'>${t('calcError')}</div>`;
            $('requiredKpi').textContent='-';
            $('conditioningDoseType').textContent='-';
            $('conditioningDoseValue').textContent='-';
            $('overflowWarn').style.display='none';
            return;
          }
          $('stateSummary').innerHTML=`<div>${t('newTankLevel')}: <b>${fmt(n.result.finalTankLevelMm,2)} mm</b></div><div>${t('newTankPh')}: <b>${fmt(n.result.finalPh,2)}</b></div>`;
          $('requiredKpi').textContent=n.result.minimal?t('minAdjustment'):`${fmt(n.result.requiredVolumeFinalL,2)} L`;
          $('conditioningDoseType').textContent=n.result.requiredType||'-';
          $('conditioningDoseValue').textContent=n.result.minimal?'0.00 L':`${fmt(n.result.requiredVolumeFinalL,2)} L`;
          $('overflowWarn').style.display=n.result.finalTankLevelMm>CAL.TANK_MAX_MM?'block':'none';
          $('overflowWarn').textContent=n.result.finalTankLevelMm>CAL.TANK_MAX_MM?t('overflow'):'';
          return;
        }
        methodCard.style.display='block'; reagentCard.style.display='block'; calcCard.style.display='block';
        $('modeBlock').style.display=state.selectedTask==='Recepción de Efluentes'?'block':'none';
        [$('modeChemBtn'),$('modeEffBtn')].forEach(b=>b.classList.toggle('active',b.dataset.mode===n.mode));
        const effNames=state.selectedTask==='Recepción de Efluentes'?`<div>${t('effluentsTitle')}: <b>${state.effluents.map(e=>e.name).join(', ')}</b></div>`:'';
        $('stateSummary').innerHTML=`<div>${t('levelMm')}: <b>${fmt(n.src.levelMm,2)}</b></div><div>${t('volumeLabel')}: <b>${fmt(n.src.volumeM3,3)} m³</b></div><div>${t('phLabel')}: <b>${fmt(n.src.pH,2)}</b></div>${effNames}`;
        $('methodSummary').innerHTML=`<div>${t('modeLabel')}: <b>${n.mode==='effluent'?t('modeEffluent'):t('modeChemicals')}</b></div><div>${t('methodCalc')}: <b>${t('stoichMethodText')} ${CAL.PH_TARGET}</b></div>`;
        $('reagentSummary').innerHTML=`<div>${t('typeLabel')}: <b>${n.type||'-'}</b></div><div>${t('concentrationLabel')}: <b>${n.conc?`${n.conc}%`:'-'}</b></div><div>${t('referencePhLabel')}: <b>${n.ref!=null?fmt(n.ref,2):'-'}</b></div><div>Eq/L: <b>${fmt(n.eqL,6)}</b></div>`;
        $('calcSummary').innerHTML=`<div>${t('species')}: <b>${n.species||'-'}</b></div><div>${t('eqNeutralize')}: <b>${fmt(n.eq,6)} eq</b></div><div>${t('volumeLabel')}: <b>${fmt(n.reqL,2)} L (${fmt(n.reqM3,4)} m³)</b></div><div>${t('levelDeltaLabel')}: <b>${fmt(n.dMm,3)} mm</b></div><div>${t('projectedLevelLabel')}: <b>${fmt(n.proj,3)} mm</b></div>${n.eq===0?`<div class='warn'>${t('nearNeutral')}</div>`:''}`;
        $('requiredKpi').textContent=`${fmt(n.reqL,2)} L`;
        $('overflowWarn').style.display=n.proj>CAL.TANK_MAX_MM?'block':'none';
        $('overflowWarn').textContent=n.proj>CAL.TANK_MAX_MM?t('overflow'):'';
      }

      function buildSelects(){ $('naohPct').innerHTML=[10,20,30,40,50].map(v=>`<option value='${v}'>${v}%</option>`).join(''); $('h2so4Pct').innerHTML=[98,90,80,70,60,50,40,30].map(v=>`<option value='${v}'>${v}%</option>`).join(''); $('naohPct').value=state.chemicals.naohPct; $('h2so4Pct').value=state.chemicals.h2so4Pct; }
      function renderI18n(){ document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n)); document.documentElement.lang=state.selectedLanguage; buildSelects(); renderTabs(); $('main-title').textContent=t('welcomeTitle'); $('main-description').textContent=t('welcomeDescription'); $('language-label').textContent=t('selectLanguageText'); $('welcomeNextButton').textContent=t('nextBtn'); $('langBtnEn').textContent=t('langEnglish'); $('langBtnEs').textContent=t('langSpanish'); $('langBtnKo').textContent=t('langKorean'); document.querySelectorAll('.language-button').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.selectedLanguage)); $('taskReceptionBtn').textContent=t('taskReception'); $('taskConditioningBtn').textContent=t('taskConditioning'); [$('taskReceptionBtn'),$('taskConditioningBtn')].forEach(b=>b.classList.toggle('active',b.dataset.task===state.selectedTask)); $('modeChemBtn').textContent=t('modeChemicals'); $('modeEffBtn').textContent=t('modeEffluent'); validateState(); renderEffluents(); renderResults(); }

      function bind(){
        document.querySelectorAll('.language-button').forEach(btn=>btn.addEventListener('click',()=>{state.selectedLanguage=btn.dataset.lang;renderI18n();}));
        $('welcomeNextButton').addEventListener('click',()=>show('task'));
        [$('taskReceptionBtn'),$('taskConditioningBtn')].forEach(btn=>btn.addEventListener('click',()=>{state.selectedTask=btn.dataset.task; renderI18n();}));
        $('settingsBtn').addEventListener('click',()=>$('settingsPanel').classList.toggle('open'));
        $('tankLevelMm').addEventListener('input',()=>{validateState(); $('btnNext').disabled=currentScreen==='state'?!validateState():false; renderResults();});
        $('tankPh').addEventListener('input',()=>{validateState(); $('btnNext').disabled=currentScreen==='state'?!validateState():false; renderResults();});
        $('addEffluentBtn').addEventListener('click',()=>{state.effluents.push({name:'LH',volumeM3:0,pH:7}); renderEffluents(); renderResults();});
        $('naohPct').addEventListener('change',e=>{state.chemicals.naohPct=Number(e.target.value); renderResults();});
        $('h2so4Pct').addEventListener('change',e=>{state.chemicals.h2so4Pct=Number(e.target.value); renderResults();});
        [$('modeChemBtn'),$('modeEffBtn')].forEach(btn=>btn.addEventListener('click',()=>{state.neutralization.mode=btn.dataset.mode; renderI18n();}));
        $('neutralizerPh').addEventListener('input',e=>{state.neutralization.referencePh=Number(e.target.value); $('neutralizerPhError').textContent=(state.neutralization.referencePh>=0&&state.neutralization.referencePh<=14)?'':t('invalidNeutralizerPh'); renderResults();});
        $('btnHome').addEventListener('click',()=>show('language'));
        $('btnBack').addEventListener('click',()=>{const f=flow();const i=f.indexOf(currentScreen);if(i>0)show(f[i-1]);});
        $('btnNext').addEventListener('click',()=>{const f=flow();const i=f.indexOf(currentScreen);if(!isValid(currentScreen))return;if(i<f.length-1){show(f[i+1]);if(f[i+1]==='results')renderResults();}});
      }

      function show(id){ currentScreen=id; ['language','task','state','effluents','results'].forEach(s=>$('screen-'+s).classList.toggle('active',s===id)); $('btnBack').disabled=id==='language'; const hide=id==='language'; $('tabs').style.display=hide?'none':'flex'; $('globalNav').style.display=hide?'none':'flex'; renderTabs(); $('btnNext').disabled=id==='state'?!validateState():false; }
      function init(){ state.tankState.volumeM3=mmToM3(state.tankState.levelMm); $('tankLevelMm').value=String(state.tankState.levelMm); $('tankPh').value=String(state.tankState.pH); bind(); renderI18n(); show('language'); }
      init();
    </script>
  </body>
</html>

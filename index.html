<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora pH</title>
    <style>
      :root {
        --overlay-color: rgba(255, 255, 255, 0.76);
        --panel-color: rgba(255, 255, 255, 0.88);
        --text-primary: #093a63;
        --text-secondary: #325f83;
        --button-bg: #0d6eaa;
        --button-bg-hover: #1285cb;
        --border: rgba(73, 119, 153, 0.25);
        --danger: #b8302d;
        --warning: #9b6200;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; font-family: "Segoe UI", "Roboto", Arial, sans-serif; color: var(--text-primary); background:#e9edf2; }
      .app-screen { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 7.2rem 1.25rem 1.8rem; overflow: hidden; }
      .background-image { position:absolute; inset:0; z-index:-3; background: radial-gradient(circle at 20% 20%, rgba(13,110,170,.12), transparent 35%), radial-gradient(circle at 80% 40%, rgba(13,110,170,.08), transparent 38%), linear-gradient(180deg,#f5f7fa 0%,#e8edf3 100%); }
      .background-logo { position:absolute; inset:0; z-index:-2; opacity:.12; background:url("POSCO_logo.svg") center/ min(72vw,700px) no-repeat; }
      .overlay { position:absolute; inset:0; background:var(--overlay-color); z-index:-1; }
      .top-logo { position:absolute; top:1.2rem; left:50%; transform:translateX(-50%); width:min(240px,60vw); filter:drop-shadow(0 5px 10px rgba(5,43,72,.15)); }
      .content { width:min(1040px,100%); background:var(--panel-color); border:1px solid var(--border); border-radius:20px; padding:clamp(1rem,2.8vw,1.8rem); box-shadow:0 18px 35px rgba(9,58,99,.12); }
      .tabs { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
      .tab { border:1px solid rgba(13,110,170,.25); padding:7px 11px; border-radius:999px; font-size:.84rem; color:var(--text-secondary); font-weight:600; background:rgba(255,255,255,.75); }
      .tab.active { color:var(--button-bg); background:rgba(13,110,170,.13); border-color:rgba(13,110,170,.42); }
      .screen { display:none; }
      .screen.active { display:block; }
      h3 { margin:0 0 10px; font-size:1.04rem; }
      .section-gap { margin-top:16px; }
      .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .grid-3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .field { display:flex; flex-direction:column; gap:5px; }
      label { font-size:.84rem; color:var(--text-secondary); font-weight:600; }
      input, select { border:1px solid rgba(73,119,153,.28); border-radius:10px; padding:9px 10px; background:#fff; color:var(--text-primary); width:100%; }
      .input-readonly { background:#f6fbff; border-style:dashed; }
      .input-invalid { border:2px solid var(--danger); background:#fff7f7; }
      .btn { border:none; border-radius:12px; padding:.8rem 1rem; font-size:.96rem; font-weight:700; color:#fff; background:linear-gradient(180deg,var(--button-bg-hover),var(--button-bg)); cursor:pointer; transition:transform .2s ease,box-shadow .2s ease; box-shadow:0 8px 16px rgba(9,58,99,.2); }
      .btn:hover { transform:translateY(-1px); box-shadow:0 10px 22px rgba(9,58,99,.28); }
      .btn:disabled { opacity:.55; cursor:not-allowed; transform:none; }
      .choice-buttons { display:grid; grid-template-columns:repeat(2,minmax(140px,1fr)); gap:.8rem; }
      .choice-button { border:2px solid #0d6eaa; border-radius:12px; padding:.9rem 1rem; font-size:clamp(1.02rem,1.8vw,1.12rem); font-weight:800; color:#0d6eaa; background:#fff; box-shadow:0 8px 16px rgba(9,58,99,.2); cursor:pointer; }
      .choice-button.active { background:linear-gradient(180deg,#1285cb,#0d6eaa); color:#fff; box-shadow:0 10px 22px rgba(9,58,99,.3); }
      .nav { margin-top:14px; padding-top:12px; border-top:1px solid var(--border); display:flex; justify-content:space-between; gap:8px; }
      .nav-right { display:flex; gap:8px; }
      .card { border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,.84); padding:11px; }
      .card h4 { margin:0 0 6px; font-size:.9rem; color:var(--button-bg); }
      .kpi { margin-top:10px; border:1px solid rgba(13,110,170,.35); border-radius:12px; background:rgba(13,110,170,.1); padding:12px; }
      .kpi-label { font-size:.84rem; color:var(--text-secondary); }
      .kpi-value { font-size:1.8rem; font-weight:800; color:var(--button-bg); }
      .notice { margin-top:8px; font-size:.88rem; color:var(--text-secondary); }
      .warn { color:var(--warning); font-weight:700; }
      .error { margin-top:6px; font-size:.85rem; color:var(--danger); }
      .welcome-main { text-align:center; padding:clamp(.6rem,1.5vw,1rem) 0; }
      .welcome-main h2 { margin:0; font-size:clamp(1.35rem,2.5vw,2.15rem); line-height:1.35; }
      .welcome-description { margin:1rem auto 0; max-width:70ch; color:var(--text-secondary); font-size:clamp(.95rem,1.4vw,1.1rem); line-height:1.55; }
      .language-label { margin-top:1.8rem; margin-bottom:1rem; font-weight:600; color:#174e78; font-size:clamp(1rem,1.8vw,1.2rem); }
      .language-buttons { display:grid; grid-template-columns:repeat(3,minmax(120px,1fr)); gap:.9rem; }
      .language-button { border:2px solid #0d6eaa; border-radius:12px; padding:.95rem 1rem; font-size:clamp(1.08rem,2.2vw,1.2rem); font-weight:800; color:#0d6eaa; background:#fff; box-shadow:0 8px 16px rgba(9,58,99,.2); cursor:pointer; }
      .language-button.active { background:linear-gradient(180deg,#1285cb,#0d6eaa); color:#fff; }
      .welcome-actions { margin-top:1.1rem; display:flex; justify-content:center; }
      .welcome-next { min-width:min(280px,100%); }
      .top-row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
      .settings-panel { display:none; margin-top:10px; }
      .settings-panel.open { display:block; }
      @media (max-width:860px) { .grid,.grid-3,.cards,.choice-buttons,.language-buttons { grid-template-columns:1fr; } .app-screen{padding-top:6.5rem;} }
    </style>
  </head>
  <body>
    <main class="app-screen">
      <div class="background-image" aria-hidden="true"></div>
      <div class="background-logo" aria-hidden="true"></div>
      <div class="overlay" aria-hidden="true"></div>
      <img class="top-logo" alt="Logo POSCO" src="POSCO_logo.svg" />

      <section class="content">
        <div class="tabs" id="tabs"></div>

        <section class="screen" id="screen-language">
          <div class="welcome-main">
            <h2 id="main-title"></h2>
            <p class="welcome-description" id="main-description"></p>
            <p class="language-label" id="language-label"></p>
            <div class="language-buttons" role="group">
              <button class="language-button" data-lang="en" id="langBtnEn"></button>
              <button class="language-button" data-lang="es" id="langBtnEs"></button>
              <button class="language-button" data-lang="ko" id="langBtnKo"></button>
            </div>
            <div class="welcome-actions"><button class="btn welcome-next" id="welcomeNextButton" type="button"></button></div>
          </div>
        </section>

        <section class="screen" id="screen-task">
          <h3 data-i18n="taskTitle"></h3>
          <div class="choice-buttons" role="group">
            <button class="choice-button" id="taskReceptionBtn" type="button" data-task="Recepción de Efluentes"></button>
            <button class="choice-button" id="taskConditioningBtn" type="button" data-task="Acondicionamiento de la pileta"></button>
          </div>
        </section>

        <section class="screen" id="screen-state">
          <div class="top-row">
            <h3 data-i18n="tankTitleWWB"></h3>
            <button class="btn" id="settingsBtn" type="button">⚙️ <span data-i18n="settingsBtn"></span></button>
          </div>
          <div class="grid">
            <div class="field">
              <label data-i18n="levelMm"></label>
              <input id="tankLevelMm" type="number" step="0.01" inputmode="decimal" />
              <div id="levelError" class="error"></div>
            </div>
            <div class="field">
              <label data-i18n="phLabel"></label>
              <input id="tankPh" type="number" step="0.01" inputmode="decimal" />
              <div id="phError" class="error"></div>
            </div>
          </div>
          <div class="notice" id="estimatedVolume"></div>
          <div class="notice" data-i18n="volumeHint"></div>

          <div class="settings-panel" id="settingsPanel">
            <h3 class="section-gap" data-i18n="chemicalsOptionalTitle"></h3>
            <div class="grid" style="margin-top:8px;">
              <div class="field"><label data-i18n="naohConcentration"></label><select id="naohPct"></select></div>
              <div class="field"><label data-i18n="h2so4Concentration"></label><select id="h2so4Pct"></select></div>
            </div>
          </div>
        </section>

        <section class="screen" id="screen-effluents">
          <h3 data-i18n="effluentsTitle"></h3>
          <div class="grid grid-3">
            <div class="field"><label data-i18n="eff1Vol"></label><input id="eff1Vol" type="number" min="0" step="0.01" /></div>
            <div class="field"><label data-i18n="eff1Ph"></label><input id="eff1Ph" type="number" min="0" max="14" step="0.01" /></div>
            <div class="field"><label data-i18n="eff1Kind"></label><div class="choice-buttons"><button class="choice-button" id="eff1KindAcid" type="button"></button><button class="choice-button" id="eff1KindBase" type="button"></button></div></div>
          </div>
          <div class="grid grid-3" style="margin-top:10px;">
            <div class="field"><label data-i18n="eff2Vol"></label><input id="eff2Vol" type="number" min="0" step="0.01" /></div>
            <div class="field"><label data-i18n="eff2Ph"></label><input id="eff2Ph" type="number" min="0" max="14" step="0.01" /></div>
            <div class="field"><label data-i18n="eff2Kind"></label><div class="choice-buttons"><button class="choice-button" id="eff2KindAcid" type="button"></button><button class="choice-button" id="eff2KindBase" type="button"></button></div></div>
          </div>
        </section>

        <section class="screen" id="screen-results">
          <h3 data-i18n="resultsTitle"></h3>
          <div class="cards">
            <div class="card"><h4 data-i18n="stateCard"></h4><div id="stateSummary"></div></div>
            <div class="card"><h4 data-i18n="methodCard"></h4><div id="methodSummary"></div></div>
            <div class="card"><h4 data-i18n="reagentCard"></h4><div id="reagentSummary"></div></div>
            <div class="card"><h4 data-i18n="calcCard"></h4><div id="calcSummary"></div></div>
          </div>
          <div class="card" id="modeBlock" style="display:none; margin-top:10px;">
            <h4 data-i18n="neutralizationMode"></h4>
            <div class="grid">
              <div class="field"><label data-i18n="modeLabel"></label><div class="choice-buttons"><button class="choice-button" id="modeChemBtn" data-mode="chemicals" type="button"></button><button class="choice-button" id="modeEffBtn" data-mode="effluent" type="button"></button></div></div>
              <div class="field" id="neutralizerPhField" style="display:none;"><label id="neutralizerPhLabel"></label><input id="neutralizerPh" type="number" min="0" max="14" step="0.01" /><div id="neutralizerPhError" class="error"></div></div>
            </div>
          </div>
          <div class="kpi"><div class="kpi-label" data-i18n="requiredAmount"></div><div class="kpi-value" id="requiredKpi">-</div></div>
          <div class="notice" data-i18n="idealLegend"></div>
          <div class="notice warn" id="overflowWarn" style="display:none;"></div>
        </section>

        <div class="nav" id="globalNav">
          <button class="btn" id="btnHome" data-i18n="homeBtn"></button>
          <div class="nav-right"><button class="btn" id="btnBack" data-i18n="backBtn"></button><button class="btn" id="btnNext" data-i18n="nextBtn"></button></div>
        </div>
        <div id="screenError" class="error"></div>
      </section>
    </main>

    <script>
      const CAL = { MM_EQ_M3_NUM:166.66, MM_EQ_M3_DEN:10, PH_TARGET:7, TANK_MAX_MM:4000, PM_NAOH:40, PM_H2SO4:98.079, naohDensity:{10:1.11,20:1.22,30:1.33,40:1.43,50:1.53}, h2so4Density:{98:1.84,90:1.8,80:1.73,70:1.61,60:1.5,50:1.4,40:1.3,30:1.22} };
      CAL.M3_PER_MM = CAL.MM_EQ_M3_DEN / CAL.MM_EQ_M3_NUM;
      CAL.MM_PER_M3 = CAL.MM_EQ_M3_NUM / CAL.MM_EQ_M3_DEN;

      const tr = {
        es:{taskTitle:'Selección de tarea',taskReception:'Recepción de Efluentes',taskConditioning:'Acondicionamiento de la pileta',tankTitleWWB:'Estado de la pileta WWB',levelMm:'Nivel (mm)',phLabel:'pH',volumeHint:'Referencia fija: 10 m³ = 166.66 mm.',estimatedVolume:'Volumen estimado: {value} m³',settingsBtn:'Ajustes',chemicalsOptionalTitle:'Químicos (opcional)',naohConcentration:'Concentración NaOH (% p/p)',h2so4Concentration:'Concentración H2SO4 (% p/p)',effluentsTitle:'Efluentes de ingreso',eff1Vol:'Efluente 1 volumen (m³)',eff1Ph:'Efluente 1 pH',eff1Kind:'Efluente 1 tipo',eff2Vol:'Efluente 2 volumen (m³)',eff2Ph:'Efluente 2 pH',eff2Kind:'Efluente 2 tipo',acidic:'Ácido',basic:'Básico',resultsTitle:'Resultados',stateCard:'Estado actual/final de la pileta',methodCard:'Método de neutralización',reagentCard:'Reactivo/Efluente requerido',calcCard:'Datos técnicos de cálculo',neutralizationMode:'Modo de neutralización',modeLabel:'Modo',modeChemicals:'Químicos',modeEffluent:'Efluente',requiredAmount:'Cantidad estimada requerida',idealLegend:'El cálculo corresponde a una estimación estequiométrica ideal y no contempla alcalinidad, buffers ni reacciones secundarias.',homeBtn:'Inicio',backBtn:'Volver',nextBtn:'Siguiente',tabLanguage:'Idioma',tabTask:'Tarea',tabState:'Estado',tabEff:'Efluentes',tabRes:'Resultados',errSelectTask:'Seleccione una tarea.',errPh:'El pH debe estar entre 0 y 14.',nearNeutral:'pH cercano a 7: ajuste mínimo o no requerido.',species:'Especie neutralizada',eqNeutralize:'Equivalentes a neutralizar',methodCalc:'Método',overflow:'Advertencia: el nivel proyectado supera la altura máxima de la pileta.',neutralizerPhLH:'pH del efluente LH (base)',neutralizerPhIX:'pH del efluente IX (ácido)',invalidNeutralizerPh:'Ingrese pH válido entre 0 y 14.',stoichMethodText:'Estequiometría ideal con pH objetivo',typeLabel:'Tipo',concentrationLabel:'Concentración',referencePhLabel:'pH referencia',volumeLabel:'Volumen',levelDeltaLabel:'Δ nivel',projectedLevelLabel:'Nivel proyectado',welcomeTitle:'Calculadora pH - WWT - Utilities - Departamento de Producción LH Güemes',welcomeDescription:'Cálculo de reactivo de neutralización para la planta de tratamiento de aguas.',selectLanguageText:'Seleccionar idioma',langEnglish:'English',langSpanish:'Español',langKorean:'한국어',levelLow:'La pileta tiene nivel bajo.',levelHigh:'La pileta está muy alta.',levelInvalid:'Ingrese un valor numérico válido para nivel.'},
        en:{taskTitle:'Task selection',taskReception:'Effluent Reception',taskConditioning:'Tank Conditioning',tankTitleWWB:'WWB tank state',levelMm:'Level (mm)',phLabel:'pH',volumeHint:'Fixed reference: 10 m³ = 166.66 mm.',estimatedVolume:'Estimated volume: {value} m³',settingsBtn:'Settings',chemicalsOptionalTitle:'Chemicals (optional)',naohConcentration:'NaOH concentration (% w/w)',h2so4Concentration:'H2SO4 concentration (% w/w)',effluentsTitle:'Incoming effluents',eff1Vol:'Effluent 1 volume (m³)',eff1Ph:'Effluent 1 pH',eff1Kind:'Effluent 1 type',eff2Vol:'Effluent 2 volume (m³)',eff2Ph:'Effluent 2 pH',eff2Kind:'Effluent 2 type',acidic:'Acidic',basic:'Basic',resultsTitle:'Results',stateCard:'Current/final tank state',methodCard:'Neutralization mode',reagentCard:'Required reagent/effluent',calcCard:'Technical calculation data',neutralizationMode:'Neutralization mode',modeLabel:'Mode',modeChemicals:'Chemicals',modeEffluent:'Effluent',requiredAmount:'Estimated required amount',idealLegend:'This is an ideal stoichiometric estimate and does not account for alkalinity, buffers, or side reactions.',homeBtn:'Home',backBtn:'Back',nextBtn:'Next',tabLanguage:'Language',tabTask:'Task',tabState:'State',tabEff:'Effluents',tabRes:'Results',errSelectTask:'Please select a task.',errPh:'pH must be between 0 and 14.',nearNeutral:'pH close to 7: minimal or no adjustment required.',species:'Neutralized species',eqNeutralize:'Estimated equivalents',methodCalc:'Method',overflow:'Warning: projected level exceeds tank maximum height.',neutralizerPhLH:'LH effluent pH (base)',neutralizerPhIX:'IX effluent pH (acid)',invalidNeutralizerPh:'Enter a valid pH between 0 and 14.',stoichMethodText:'Ideal stoichiometry with target pH',typeLabel:'Type',concentrationLabel:'Concentration',referencePhLabel:'Reference pH',volumeLabel:'Volume',levelDeltaLabel:'Level Δ',projectedLevelLabel:'Projected level',welcomeTitle:'pH Calculator - WWT - Utilities - LH Güemes Production Department',welcomeDescription:'Neutralization reagent calculation for the water treatment plant.',selectLanguageText:'Select language',langEnglish:'English',langSpanish:'Español',langKorean:'한국어',levelLow:'Tank level is low.',levelHigh:'Tank level is too high.',levelInvalid:'Enter a valid numeric level.'},
        ko:{taskTitle:'작업 선택',taskReception:'폐수 수령',taskConditioning:'탱크 컨디셔닝',tankTitleWWB:'WWB 탱크 상태',levelMm:'수위 (mm)',phLabel:'pH',volumeHint:'고정 기준: 10 m³ = 166.66 mm.',estimatedVolume:'추정 부피: {value} m³',settingsBtn:'설정',chemicalsOptionalTitle:'약품 (선택)',naohConcentration:'NaOH 농도 (% w/w)',h2so4Concentration:'H2SO4 농도 (% w/w)',effluentsTitle:'유입 폐수',eff1Vol:'폐수 1 부피 (m³)',eff1Ph:'폐수 1 pH',eff1Kind:'폐수 1 유형',eff2Vol:'폐수 2 부피 (m³)',eff2Ph:'폐수 2 pH',eff2Kind:'폐수 2 유형',acidic:'산성',basic:'염기성',resultsTitle:'결과',stateCard:'현재/최종 탱크 상태',methodCard:'중화 방식',reagentCard:'필요 시약/폐수',calcCard:'기술 계산 데이터',neutralizationMode:'중화 모드',modeLabel:'모드',modeChemicals:'약품',modeEffluent:'폐수',requiredAmount:'예상 필요량',idealLegend:'본 계산은 이상적인 화학양론 추정이며 알칼리도, 완충, 부반응을 고려하지 않습니다.',homeBtn:'홈',backBtn:'뒤로',nextBtn:'다음',tabLanguage:'언어',tabTask:'작업',tabState:'상태',tabEff:'폐수',tabRes:'결과',errSelectTask:'작업을 선택하세요.',errPh:'pH는 0~14 범위여야 합니다.',nearNeutral:'pH가 7에 가까워 조정이 거의 필요하지 않습니다.',species:'중화 대상 종',eqNeutralize:'중화 등가량',methodCalc:'방법',overflow:'경고: 예상 수위가 탱크 최대 높이를 초과합니다.',neutralizerPhLH:'LH 폐수 pH (염기)',neutralizerPhIX:'IX 폐수 pH (산)',invalidNeutralizerPh:'0~14 사이의 유효한 pH를 입력하세요.',stoichMethodText:'목표 pH 기반 이상 화학양론',typeLabel:'유형',concentrationLabel:'농도',referencePhLabel:'기준 pH',volumeLabel:'부피',levelDeltaLabel:'수위 Δ',projectedLevelLabel:'예상 수위',welcomeTitle:'pH 계산기 - WWT - Utilities - LH Güemes 생산 부서',welcomeDescription:'수처리 플랜트용 중화 시약 계산.',selectLanguageText:'언어 선택',langEnglish:'English',langSpanish:'Español',langKorean:'한국어',levelLow:'탱크 수위가 낮습니다.',levelHigh:'탱크 수위가 너무 높습니다.',levelInvalid:'유효한 수치 수위를 입력하세요.'}
      };

      const state = { selectedLanguage:'es', selectedTask:'', tankState:{ levelMm:2000, volumeM3:0, pH:7 }, chemicals:{ naohPct:30, h2so4Pct:98 }, effluents:[{volumeM3:0,pH:7,kind:'acid'},{volumeM3:0,pH:7,kind:'acid'}], neutralization:{ mode:'chemicals', referencePh:null } };
      const $ = (id) => document.getElementById(id);
      const t = (k) => tr[state.selectedLanguage][k] ?? k;
      const fmt = (v,n=3)=>Number(v).toFixed(n);
      const clampPh = (p)=>Math.min(14,Math.max(0,Number(p)||0));
      const m3ToL = (m3)=>(Number(m3)||0)*1000;
      const m3ToMm = (m3)=>(Number(m3)||0)*CAL.MM_PER_M3;
      const mmToM3 = (mm)=>(Number(mm)||0)*CAL.M3_PER_MM;
      const hFromPh=(ph)=>Math.pow(10,-clampPh(ph));
      const ohFromPh=(ph)=>Math.pow(10,-(14-clampPh(ph)));
      const naohEqPerL=(pct)=>((CAL.naohDensity[pct]||CAL.naohDensity[30])*(pct/100)*1000)/CAL.PM_NAOH;
      const h2so4EqPerL=(pct)=>(((CAL.h2so4Density[pct]||CAL.h2so4Density[98])*(pct/100)*1000)/CAL.PM_H2SO4)*2;
      let currentScreen='language';

      function getFlow(){ return state.selectedTask==='Recepción de Efluentes' ? ['language','task','state','effluents','results'] : ['language','task','state','results']; }
      function renderTabs(){ const map={language:'tabLanguage',task:'tabTask',state:'tabState',effluents:'tabEff',results:'tabRes'}; $('tabs').innerHTML=getFlow().map(s=>`<span class="tab ${s===currentScreen?'active':''}">${t(map[s])}</span>`).join(''); }
      function setError(msg){ $('screenError').textContent=msg; }

      function validateStateFields(){
        const levelRaw = $('tankLevelMm').value.trim();
        const phRaw = $('tankPh').value.trim();
        let levelValid=true, phValid=true;
        let levelMsg='', phMsg='';

        const levelNum = Number(levelRaw);
        if (levelRaw==='' || Number.isNaN(levelNum)) { levelValid=false; levelMsg=t('levelInvalid'); }
        else if (levelNum<1200) { levelValid=false; levelMsg=t('levelLow'); }
        else if (levelNum>4000) { levelValid=false; levelMsg=t('levelHigh'); }

        const phNum = Number(phRaw);
        if (phRaw==='' || Number.isNaN(phNum) || phNum<0 || phNum>14) { phValid=false; phMsg=t('errPh'); }

        $('levelError').textContent=levelMsg;
        $('phError').textContent=phMsg;
        $('tankLevelMm').classList.toggle('input-invalid', !levelValid);
        $('tankPh').classList.toggle('input-invalid', !phValid);

        if (levelValid) state.tankState.levelMm = levelNum;
        if (phValid) state.tankState.pH = phNum;
        state.tankState.volumeM3 = mmToM3(state.tankState.levelMm);
        $('estimatedVolume').textContent = t('estimatedVolume').replace('{value}', fmt(state.tankState.volumeM3,2));
        return levelValid && phValid;
      }

      function isScreenValid(screen){
        if (screen==='task' && !state.selectedTask) return setError(t('errSelectTask')), false;
        if (screen==='state' && !validateStateFields()) return setError(''), false;
        if (screen==='effluents') {
          for (const ef of state.effluents) if (!(ef.volumeM3>=0 && ef.pH>=0 && ef.pH<=14)) return setError(t('errPh')), false;
        }
        if (screen==='results' && state.neutralization.mode==='effluent' && !(state.neutralization.referencePh>=0 && state.neutralization.referencePh<=14)) return setError(t('invalidNeutralizerPh')), false;
        setError('');
        return true;
      }

      function showScreen(id){
        currentScreen=id;
        ['language','task','state','effluents','results'].forEach(s=>$('screen-'+s).classList.toggle('active', s===id));
        $('btnBack').disabled=id==='language';
        const hideNav=id==='language';
        $('tabs').style.display=hideNav?'none':'flex';
        $('globalNav').style.display=hideNav?'none':'flex';
        renderTabs();
        updateNextButtonState();
      }

      function updateNextButtonState(){
        $('btnNext').disabled = currentScreen==='state' ? !validateStateFields() : false;
      }

      function buildSelects(){
        $('naohPct').innerHTML=[10,20,30,40,50].map(v=>`<option value="${v}">${v}%</option>`).join('');
        $('h2so4Pct').innerHTML=[98,90,80,70,60,50,40,30].map(v=>`<option value="${v}">${v}%</option>`).join('');
        $('naohPct').value=state.chemicals.naohPct; $('h2so4Pct').value=state.chemicals.h2so4Pct;
      }

      function renderI18n(){
        document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
        document.documentElement.lang=state.selectedLanguage;
        buildSelects();
        renderTabs();
        $('main-title').textContent=t('welcomeTitle');
        $('main-description').textContent=t('welcomeDescription');
        $('language-label').textContent=t('selectLanguageText');
        $('welcomeNextButton').textContent=t('nextBtn');
        $('langBtnEn').textContent=t('langEnglish'); $('langBtnEs').textContent=t('langSpanish'); $('langBtnKo').textContent=t('langKorean');
        document.querySelectorAll('.language-button').forEach(b=>b.classList.toggle('active', b.dataset.lang===state.selectedLanguage));
        $('taskReceptionBtn').textContent=t('taskReception'); $('taskConditioningBtn').textContent=t('taskConditioning');
        [$('taskReceptionBtn'),$('taskConditioningBtn')].forEach(b=>b.classList.toggle('active', b.dataset.task===state.selectedTask));
        $('eff1KindAcid').textContent=t('acidic'); $('eff1KindBase').textContent=t('basic'); $('eff2KindAcid').textContent=t('acidic'); $('eff2KindBase').textContent=t('basic');
        $('modeChemBtn').textContent=t('modeChemicals'); $('modeEffBtn').textContent=t('modeEffluent');
        validateStateFields();
        renderResults();
      }

      function computeMixedState(){
        let totalM3=state.tankState.volumeM3;
        let totalH=state.tankState.pH<7 ? hFromPh(state.tankState.pH)*m3ToL(state.tankState.volumeM3) : 0;
        let totalOH=state.tankState.pH>7 ? ohFromPh(state.tankState.pH)*m3ToL(state.tankState.volumeM3) : 0;
        state.effluents.forEach(ef=>{ totalM3+=ef.volumeM3; const l=m3ToL(ef.volumeM3); if (ef.kind==='acid') totalH += hFromPh(ef.pH)*l; else totalOH += ohFromPh(ef.pH)*l; });
        const totalL=m3ToL(totalM3); let finalPh=7;
        if (totalL>0){ if(totalH>totalOH) finalPh=-Math.log10(Math.max((totalH-totalOH)/totalL,1e-14)); else if(totalOH>totalH) finalPh=14+Math.log10(Math.max((totalOH-totalH)/totalL,1e-14)); }
        return { finalVolumeM3:totalM3, finalLevelMm:state.tankState.levelMm+m3ToMm(totalM3-state.tankState.volumeM3), finalPh:Math.min(14,Math.max(0,finalPh)) };
      }

      function calculateNeutralization(){
        const task=state.selectedTask;
        let source={volumeM3:state.tankState.volumeM3, levelMm:state.tankState.levelMm, pH:state.tankState.pH};
        if (task==='Recepción de Efluentes') source=computeMixedState();
        const mode = task==='Acondicionamiento de la pileta' ? 'chemicals' : state.neutralization.mode;
        let equivalents=0,species='',requiredType='',requiredConcentration=null,referencePh=null,reagentEqPerL=0;
        if (Math.abs(source.pH-CAL.PH_TARGET)>=0.15){
          if(source.pH<7){ equivalents=hFromPh(source.pH)*m3ToL(source.volumeM3); species='H+'; if(mode==='effluent'){ requiredType='LH'; referencePh=(state.neutralization.referencePh??12.5); reagentEqPerL=ohFromPh(referencePh);} else {requiredType='NaOH'; requiredConcentration=state.chemicals.naohPct; reagentEqPerL=naohEqPerL(requiredConcentration);} }
          else { equivalents=ohFromPh(source.pH)*m3ToL(source.volumeM3); species='OH-'; if(mode==='effluent'){ requiredType='IX'; referencePh=(state.neutralization.referencePh??1.5); reagentEqPerL=hFromPh(referencePh);} else {requiredType='H2SO4'; requiredConcentration=state.chemicals.h2so4Pct; reagentEqPerL=h2so4EqPerL(requiredConcentration);} }
        }
        const requiredVolumeL = reagentEqPerL>0 ? equivalents/reagentEqPerL : 0;
        const requiredVolumeM3 = requiredVolumeL/1000;
        return {source, mode, species, requiredType, requiredConcentration, referencePh, reagentEqPerL, equivalentsToNeutralize:equivalents, requiredVolumeL, requiredVolumeM3, levelIncreaseMm:m3ToMm(requiredVolumeM3), projectedFinalLevelMm:source.levelMm+m3ToMm(requiredVolumeM3)};
      }

      function renderResults(){
        const n=calculateNeutralization();
        $('modeBlock').style.display = state.selectedTask==='Recepción de Efluentes' ? 'block' : 'none';
        [$('modeChemBtn'),$('modeEffBtn')].forEach(b=>b.classList.toggle('active', b.dataset.mode===n.mode));
        $('stateSummary').innerHTML=`<div>${t('levelMm')}: <b>${fmt(n.source.levelMm,2)}</b></div><div>${t('volumeLabel')}: <b>${fmt(n.source.volumeM3,3)} m³</b></div><div>${t('phLabel')}: <b>${fmt(n.source.pH,2)}</b></div>`;
        $('methodSummary').innerHTML=`<div>${t('modeLabel')}: <b>${n.mode==='effluent'?t('modeEffluent'):t('modeChemicals')}</b></div><div>${t('methodCalc')}: <b>${t('stoichMethodText')} ${CAL.PH_TARGET}</b></div>`;
        $('reagentSummary').innerHTML=`<div>${t('typeLabel')}: <b>${n.requiredType||'-'}</b></div><div>${t('concentrationLabel')}: <b>${n.requiredConcentration?`${n.requiredConcentration}%`:'-'}</b></div><div>${t('referencePhLabel')}: <b>${n.referencePh!=null?fmt(n.referencePh,2):'-'}</b></div><div>Eq/L: <b>${fmt(n.reagentEqPerL,6)}</b></div>`;
        $('calcSummary').innerHTML=`<div>${t('species')}: <b>${n.species||'-'}</b></div><div>${t('eqNeutralize')}: <b>${fmt(n.equivalentsToNeutralize,6)} eq</b></div><div>${t('volumeLabel')}: <b>${fmt(n.requiredVolumeL,2)} L (${fmt(n.requiredVolumeM3,4)} m³)</b></div><div>${t('levelDeltaLabel')}: <b>${fmt(n.levelIncreaseMm,3)} mm</b></div><div>${t('projectedLevelLabel')}: <b>${fmt(n.projectedFinalLevelMm,3)} mm</b></div>${n.equivalentsToNeutralize===0?`<div class="warn">${t('nearNeutral')}</div>`:''}`;
        $('requiredKpi').textContent=`${fmt(n.requiredVolumeL,2)} L`;
        $('overflowWarn').style.display=n.projectedFinalLevelMm>CAL.TANK_MAX_MM?'block':'none';
        $('overflowWarn').textContent=n.projectedFinalLevelMm>CAL.TANK_MAX_MM?t('overflow'):'';
      }

      function bind(){
        document.querySelectorAll('.language-button').forEach(btn=>btn.addEventListener('click',()=>{ state.selectedLanguage=btn.dataset.lang; renderI18n(); }));
        $('welcomeNextButton').addEventListener('click',()=>showScreen('task'));
        [$('taskReceptionBtn'),$('taskConditioningBtn')].forEach(btn=>btn.addEventListener('click',()=>{ state.selectedTask=btn.dataset.task; renderI18n(); }));
        $('settingsBtn').addEventListener('click',()=> $('settingsPanel').classList.toggle('open'));
        $('tankLevelMm').addEventListener('input',()=>{ validateStateFields(); updateNextButtonState(); renderResults(); });
        $('tankPh').addEventListener('input',()=>{ validateStateFields(); updateNextButtonState(); renderResults(); });
        ['1','2'].forEach(i=>{
          $('eff'+i+'Vol').addEventListener('input',e=>{ state.effluents[i-1].volumeM3=Math.max(0,Number(e.target.value)||0); renderResults(); });
          $('eff'+i+'Ph').addEventListener('input',e=>{ state.effluents[i-1].pH=Number(e.target.value)||7; renderResults(); });
          $('eff'+i+'KindAcid').addEventListener('click',()=>{ state.effluents[i-1].kind='acid'; renderI18n(); });
          $('eff'+i+'KindBase').addEventListener('click',()=>{ state.effluents[i-1].kind='base'; renderI18n(); });
        });
        $('naohPct').addEventListener('change',e=>{ state.chemicals.naohPct=Number(e.target.value); renderResults(); });
        $('h2so4Pct').addEventListener('change',e=>{ state.chemicals.h2so4Pct=Number(e.target.value); renderResults(); });
        [$('modeChemBtn'),$('modeEffBtn')].forEach(btn=>btn.addEventListener('click',()=>{ state.neutralization.mode=btn.dataset.mode; if(btn.dataset.mode==='effluent') state.neutralization.referencePh = calculateNeutralization().source.pH<7?12.5:1.5; renderI18n(); }));
        $('neutralizerPh').addEventListener('input',e=>{ state.neutralization.referencePh=Number(e.target.value); $('neutralizerPhError').textContent=(state.neutralization.referencePh>=0&&state.neutralization.referencePh<=14)?'':t('invalidNeutralizerPh'); renderResults(); });
        $('btnHome').addEventListener('click',()=>showScreen('language'));
        $('btnBack').addEventListener('click',()=>{ const flow=getFlow(); const i=flow.indexOf(currentScreen); if(i>0) showScreen(flow[i-1]); });
        $('btnNext').addEventListener('click',()=>{ const flow=getFlow(); const i=flow.indexOf(currentScreen); if(!isScreenValid(currentScreen)) return; if(i<flow.length-1){ showScreen(flow[i+1]); if(flow[i+1]==='results') renderResults(); }});
      }

      function init(){
        bind();
        $('tankLevelMm').value=String(state.tankState.levelMm);
        $('tankPh').value=String(state.tankState.pH);
        $('eff1Vol').value='0'; $('eff1Ph').value='7'; $('eff2Vol').value='0'; $('eff2Ph').value='7';
        renderI18n();
        showScreen('language');
      }
      init();
    </script>
  </body>
</html>

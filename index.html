<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora pH</title>
    <style>
      :root {
        --overlay-color: rgba(255, 255, 255, 0.76);
        --panel-color: rgba(255, 255, 255, 0.88);
        --text-primary: #093a63;
        --text-secondary: #325f83;
        --button-text: #ffffff;
        --button-bg: #0d6eaa;
        --button-bg-hover: #1285cb;
        --border: rgba(73, 119, 153, 0.25);
        --danger: #b8302d;
        --warning: #9b6200;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
        color: var(--text-primary);
        background-color: #e9edf2;
      }

      .app-screen {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 7.2rem 1.25rem 1.8rem;
        overflow: hidden;
      }

      .background-image {
        position: absolute;
        inset: 0;
        z-index: -3;
        background:
          radial-gradient(circle at 20% 20%, rgba(13, 110, 170, 0.12), transparent 35%),
          radial-gradient(circle at 80% 40%, rgba(13, 110, 170, 0.08), transparent 38%),
          linear-gradient(180deg, #f5f7fa 0%, #e8edf3 100%);
      }

      .background-logo {
        position: absolute;
        inset: 0;
        z-index: -2;
        opacity: 0.12;
        background-image: url("POSCO_logo.svg");
        background-position: center;
        background-repeat: no-repeat;
        background-size: min(72vw, 700px);
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: var(--overlay-color);
        z-index: -1;
      }

      .top-logo {
        position: absolute;
        top: 1.2rem;
        left: 50%;
        transform: translateX(-50%);
        width: min(240px, 60vw);
        filter: drop-shadow(0 5px 10px rgba(5, 43, 72, 0.15));
      }

      .content {
        width: min(1040px, 100%);
        background: var(--panel-color);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: clamp(1rem, 2.8vw, 1.8rem);
        box-shadow: 0 18px 35px rgba(9, 58, 99, 0.12);
      }

      .header h1 {
        margin: 0;
        font-size: clamp(1.1rem, 2.4vw, 1.8rem);
      }

      .subtitle {
        margin-top: 0.4rem;
        color: var(--text-secondary);
        font-size: 0.96rem;
      }

      .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
      .tab {
        border: 1px solid rgba(13, 110, 170, 0.25);
        padding: 7px 11px;
        border-radius: 999px;
        font-size: 0.84rem;
        color: var(--text-secondary);
        font-weight: 600;
        background: rgba(255,255,255,0.75);
      }
      .tab.active {
        color: var(--button-bg);
        background: rgba(13, 110, 170, 0.13);
        border-color: rgba(13, 110, 170, 0.42);
      }

      .screen { display: none; }
      .screen.active { display: block; }

      h3 { margin: 0 0 10px; font-size: 1.04rem; }
      .section-gap { margin-top: 16px; }

      .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
      .grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .cards { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }

      .field { display: flex; flex-direction: column; gap: 5px; }
      label { font-size: 0.84rem; color: var(--text-secondary); font-weight: 600; }

      input, select {
        border: 1px solid rgba(73, 119, 153, 0.28);
        border-radius: 10px;
        padding: 9px 10px;
        background: #fff;
        color: var(--text-primary);
        width: 100%;
      }

      .btn {
        border: none;
        border-radius: 12px;
        padding: 0.8rem 1rem;
        font-size: 0.96rem;
        font-weight: 700;
        color: var(--button-text);
        background: linear-gradient(180deg, var(--button-bg-hover), var(--button-bg));
        cursor: pointer;
        transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        box-shadow: 0 8px 16px rgba(9,58,99,.2);
      }
      .btn:hover, .btn:focus-visible {
        transform: translateY(-1px);
        background: linear-gradient(180deg, #1a92da, #0d6eaa);
        box-shadow: 0 10px 22px rgba(9,58,99,.28);
        outline: 2px solid rgba(13,110,170,.35);
        outline-offset: 1px;
      }
      .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }

      .nav {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .nav-right { display: flex; gap: 8px; }

      .card {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(255,255,255,.84);
        padding: 11px;
      }
      .card h4 { margin: 0 0 6px; font-size: .9rem; color: var(--button-bg); }

      .kpi {
        margin-top: 10px;
        border: 1px solid rgba(13,110,170,0.35);
        border-radius: 12px;
        background: rgba(13,110,170,0.1);
        padding: 12px;
      }
      .kpi-label { font-size: .84rem; color: var(--text-secondary); }
      .kpi-value { font-size: 1.8rem; font-weight: 800; color: var(--button-bg); }

      .notice { margin-top: 8px; font-size: .88rem; color: var(--text-secondary); }
      .warn { color: var(--warning); font-weight: 700; }
      .error { margin-top: 6px; font-size: .85rem; color: var(--danger); }

      .welcome-main {
        text-align: center;
        padding: clamp(0.6rem, 1.5vw, 1rem) 0;
      }
      .welcome-main h2 {
        margin: 0;
        font-size: clamp(1.35rem, 2.5vw, 2.15rem);
        line-height: 1.35;
      }
      .welcome-description {
        margin: 1rem auto 0;
        max-width: 70ch;
        color: var(--text-secondary);
        font-size: clamp(0.95rem, 1.4vw, 1.1rem);
        line-height: 1.55;
      }
      .language-label {
        margin-top: 1.8rem;
        margin-bottom: 1rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #174e78;
        font-size: clamp(1rem, 1.8vw, 1.2rem);
      }
      .language-buttons {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 0.9rem;
      }
      .language-button {
        border: 2px solid #0d6eaa;
        border-radius: 12px;
        padding: 0.95rem 1rem;
        font-size: clamp(1.08rem, 2.2vw, 1.2rem);
        font-weight: 800;
        color: #0d6eaa;
        background: #ffffff;
        cursor: pointer;
        transition: transform .2s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
        box-shadow: 0 8px 16px rgba(9, 58, 99, 0.2);
      }
      .language-button:hover,
      .language-button:focus-visible {
        transform: translateY(-2px);
        background: #eef7ff;
        box-shadow: 0 10px 22px rgba(9,58,99,0.28);
        outline: 2px solid rgba(13,110,170,0.35);
        outline-offset: 1px;
      }
      .language-button.active {
        background: linear-gradient(180deg, #1285cb, #0d6eaa);
        color: #ffffff;
        box-shadow: 0 10px 22px rgba(9,58,99,0.3);
      }
      .welcome-actions {
        margin-top: 1.1rem;
        display: flex;
        justify-content: center;
      }
      .welcome-next { min-width: min(280px, 100%); }
      .choice-label { margin-bottom: 0.7rem; color: var(--text-secondary); font-weight: 600; }
      .choice-buttons { display: grid; grid-template-columns: repeat(2, minmax(140px, 1fr)); gap: 0.8rem; }
      .choice-button { border: 2px solid #0d6eaa; border-radius: 12px; padding: 0.9rem 1rem; font-size: clamp(1.02rem, 1.8vw, 1.12rem); font-weight: 800; color: #0d6eaa; background: #ffffff; box-shadow: 0 8px 16px rgba(9, 58, 99, 0.2); cursor: pointer; }
      .choice-button.active { background: linear-gradient(180deg, #1285cb, #0d6eaa); color: #ffffff; box-shadow: 0 10px 22px rgba(9,58,99,0.3); }
      .kind-buttons { display: grid; grid-template-columns: repeat(2, minmax(90px, 1fr)); gap: 0.5rem; }

      @media (max-width: 860px) {
        .grid, .grid-3, .cards { grid-template-columns: 1fr; }
        .app-screen { padding-top: 6.5rem; }
        .language-buttons { grid-template-columns: 1fr; }
        .choice-buttons { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="app-screen">
      <div class="background-image" aria-hidden="true"></div>
      <div class="background-logo" aria-hidden="true"></div>
      <div class="overlay" aria-hidden="true"></div>
      <img class="top-logo" alt="Logo POSCO" src="POSCO_logo.svg" />

      <section class="content">
        <div class="tabs" id="tabs"></div>

        <section class="screen" id="screen-language">
          <div class="welcome-main">
            <h2 id="main-title"></h2>
            <p class="welcome-description" id="main-description"></p>
            <p class="language-label" id="language-label"></p>
            <div class="language-buttons" role="group" aria-label="Selección de idioma">
              <button class="language-button" data-lang="en" id="langBtnEn"></button>
              <button class="language-button" data-lang="es" id="langBtnEs"></button>
              <button class="language-button" data-lang="ko" id="langBtnKo"></button>
            </div>
            <div class="welcome-actions">
              <button class="btn welcome-next" id="welcomeNextButton" type="button"></button>
            </div>
          </div>
        </section>

        <section class="screen" id="screen-task">
          <h3 data-i18n="taskTitle"></h3>
          <div class="choice-label" data-i18n="taskLabel"></div>
          <div class="choice-buttons" role="group">
            <button class="choice-button" id="taskReceptionBtn" type="button" data-task="Recepción de Efluentes"></button>
            <button class="choice-button" id="taskConditioningBtn" type="button" data-task="Acondicionamiento de la pileta"></button>
          </div>
        </section>

        <section class="screen" id="screen-state">
          <h3 data-i18n="tankTitle"></h3>
          <div class="grid grid-3">
            <div class="field"><label data-i18n="levelMm"></label><input id="tankLevelMm" type="number" min="0" step="0.01" /></div>
            <div class="field"><label data-i18n="volumeM3"></label><input id="tankVolumeM3" type="number" min="0" step="0.01" /></div>
            <div class="field"><label data-i18n="phLabel"></label><input id="tankPh" type="number" min="0" max="14" step="0.01" /></div>
          </div>
          <div class="notice" data-i18n="volumeHint"></div>

          <h3 class="section-gap" data-i18n="effluentsTitle" id="effluentsTitle"></h3>
          <div class="grid grid-3" id="effluentsBlock1">
            <div class="field"><label data-i18n="eff1Vol"></label><input id="eff1Vol" type="number" min="0" step="0.01" /></div>
            <div class="field"><label data-i18n="eff1Ph"></label><input id="eff1Ph" type="number" min="0" max="14" step="0.01" /></div>
            <div class="field"><label data-i18n="eff1Kind"></label><div class="kind-buttons"><button class="choice-button" id="eff1KindAcid" data-ef="1" data-kind="acid" type="button"></button><button class="choice-button" id="eff1KindBase" data-ef="1" data-kind="base" type="button"></button></div></div>
          </div>
          <div class="grid grid-3" style="margin-top:10px;" id="effluentsBlock2">
            <div class="field"><label data-i18n="eff2Vol"></label><input id="eff2Vol" type="number" min="0" step="0.01" /></div>
            <div class="field"><label data-i18n="eff2Ph"></label><input id="eff2Ph" type="number" min="0" max="14" step="0.01" /></div>
            <div class="field"><label data-i18n="eff2Kind"></label><div class="kind-buttons"><button class="choice-button" id="eff2KindAcid" data-ef="2" data-kind="acid" type="button"></button><button class="choice-button" id="eff2KindBase" data-ef="2" data-kind="base" type="button"></button></div></div>
          </div>

          <h3 class="section-gap" data-i18n="chemicalsOptionalTitle"></h3>
          <div class="notice" data-i18n="chemicalsOptionalHint"></div>
          <div class="grid" style="margin-top:8px;">
            <div class="field"><label data-i18n="naohConcentration"></label><select id="naohPct"></select></div>
            <div class="field"><label data-i18n="h2so4Concentration"></label><select id="h2so4Pct"></select></div>
          </div>
        </section>

        <section class="screen" id="screen-chemicals">
          <h3 data-i18n="chemicalsTitle"></h3>
          <div class="notice" data-i18n="chemicalsMovedToState"></div>
        </section>

        <section class="screen" id="screen-results">
          <h3 data-i18n="resultsTitle"></h3>
          <div class="cards">
            <div class="card"><h4 data-i18n="stateCard"></h4><div id="stateSummary"></div></div>
            <div class="card"><h4 data-i18n="methodCard"></h4><div id="methodSummary"></div></div>
            <div class="card"><h4 data-i18n="reagentCard"></h4><div id="reagentSummary"></div></div>
            <div class="card"><h4 data-i18n="calcCard"></h4><div id="calcSummary"></div></div>
          </div>

          <div class="card" id="modeBlock" style="display:none; margin-top:10px;">
            <h4 data-i18n="neutralizationMode"></h4>
            <div class="grid">
              <div class="field"><label data-i18n="modeLabel"></label><div class="choice-buttons"><button class="choice-button" id="modeChemBtn" data-mode="chemicals" type="button"></button><button class="choice-button" id="modeEffBtn" data-mode="effluent" type="button"></button></div></div>
              <div class="field" id="neutralizerPhField" style="display:none;"><label id="neutralizerPhLabel"></label><input id="neutralizerPh" type="number" min="0" max="14" step="0.01" /><div id="neutralizerPhError" class="error"></div></div>
            </div>
          </div>

          <div class="kpi"><div class="kpi-label" data-i18n="requiredAmount"></div><div class="kpi-value" id="requiredKpi">-</div></div>
          <div class="notice" data-i18n="idealLegend"></div>
          <div class="notice warn" id="overflowWarn" style="display:none;"></div>
        </section>

        <div class="nav" id="globalNav">
          <button class="btn" id="btnHome" data-i18n="homeBtn"></button>
          <div class="nav-right">
            <button class="btn" id="btnBack" data-i18n="backBtn"></button>
            <button class="btn" id="btnNext" data-i18n="nextBtn"></button>
          </div>
        </div>

        <div id="screenError" class="error"></div>
      </section>
    </main>

        ko: {appTitle:'pH 중화 계산기',appSubtitle:'이상적인 화학양론 추정',languageTitle:'언어 선택',languageLabel:'언어',taskTitle:'작업 선택',taskLabel:'작업',tankTitle:'탱크 상태',levelMm:'수위 (mm)',volumeM3:'부피 (m³)',phLabel:'pH',volumeHint:'고정 기준: 10 m³ = 166.66 mm.',effluentsTitle:'유입 폐수',eff1Vol:'폐수 1 부피 (m³)',eff1Ph:'폐수 1 pH',eff1Kind:'폐수 1 유형',eff2Vol:'폐수 2 부피 (m³)',eff2Ph:'폐수 2 pH',eff2Kind:'폐수 2 유형',chemicalsTitle:'약품',chemicalsMovedToState:'약품 농도는 탱크 상태 화면에서 설정합니다.',chemicalsOptionalTitle:'약품 (선택)',chemicalsOptionalHint:'여기서 농도를 입력할 수 있으며 계속 진행에 필수는 아닙니다.',naohConcentration:'NaOH 농도 (% w/w)',h2so4Concentration:'H2SO4 농도 (% w/w)',resultsTitle:'결과',stateCard:'현재/최종 탱크 상태',methodCard:'중화 방식',reagentCard:'필요 시약/폐수',calcCard:'기술 계산 데이터',neutralizationMode:'중화 모드',modeLabel:'모드',modeChemicals:'약품',modeEffluent:'폐수',requiredAmount:'예상 필요량',idealLegend:'본 계산은 이상적인 화학양론 추정이며 알칼리도, 완충, 부반응을 고려하지 않습니다.',homeBtn:'홈',backBtn:'뒤로',nextBtn:'다음',tabLanguage:'언어',tabTask:'작업',tabState:'상태/폐수',tabRes:'결과',taskReception:'폐수 수령',taskConditioning:'탱크 컨디셔닝',acidic:'산성',basic:'염기성',errSelectTask:'작업을 선택하세요.',errTank:'유효한 탱크 상태(수위/부피/pH)를 입력하세요.',errPh:'pH는 0~14 범위여야 합니다.',nearNeutral:'pH가 7에 가까워 조정이 거의 필요하지 않습니다.',species:'중화 대상 종',eqNeutralize:'중화 등가량',methodCalc:'방법',overflow:'경고: 예상 수위가 탱크 최대 높이를 초과합니다.',neutralizerPhLH:'LH 폐수 pH (염기)',neutralizerPhIX:'IX 폐수 pH (산)',invalidNeutralizerPh:'0~14 사이의 유효한 pH를 입력하세요.',stoichMethodText:'목표 pH 기반 이상 화학양론',typeLabel:'유형',concentrationLabel:'농도',referencePhLabel:'기준 pH',volumeLabel:'부피',levelDeltaLabel:'수위 Δ',projectedLevelLabel:'예상 수위',welcomeTitle:'pH 계산기 - WWT - Utilities - LH Güemes 생산 부서',welcomeDescription:'수처리 플랜트용 중화 시약 계산.',selectLanguageText:'언어 선택',langEnglish:'English',langSpanish:'Español',langKorean:'한국어'}
      };

      const state = {selectedLanguage:'es',selectedTask:'',tankState:{levelMm:0,volumeM3:0,pH:7},chemicals:{naohPct:30,h2so4Pct:98},effluents:[{volumeM3:0,pH:7,kind:'acid'},{volumeM3:0,pH:7,kind:'acid'}],resultingTankState:{},neutralization:{mode:'chemicals',requiredType:'',requiredConcentration:null,referencePh:null,equivalentsToNeutralize:0,reagentEqPerL:0,requiredVolumeL:0,requiredVolumeM3:0,levelIncreaseMm:0,projectedFinalLevelMm:0,species:''},totalEffluentVolumeM3:0,totalLevelIncreaseMm:0,finalLevelMm:0,finalVolumeM3:0,finalPh:7};

      const baseScreenLabels = {language:'tabLanguage',task:'tabTask',state:'tabState',results:'tabRes'};
      let currentScreen = 'language';
      function getFlow(){
        if (state.selectedTask === 'Recepción de Efluentes' || state.selectedTask === 'Acondicionamiento de la pileta') return ['language','task','state','results'];
        return ['language','task','state','results'];
      }
      const $ = id => document.getElementById(id);
      const t = key => tr[state.selectedLanguage][key] ?? key;
      const fmt = (v,n=3)=> Number(v).toFixed(n);
      const clampPh = p => Math.min(14, Math.max(0, Number(p)||0));
      const m3ToL = m3 => (Number(m3)||0)*1000;
      const m3ToMm = m3 => (Number(m3)||0)*CAL.MM_PER_M3;
      const mmToM3 = mm => (Number(mm)||0)*CAL.M3_PER_MM;
      const hFromPh = ph => Math.pow(10,-clampPh(ph));
      const ohFromPh = ph => Math.pow(10,-(14-clampPh(ph)));
      const isValidPh = ph => Number.isFinite(Number(ph)) && Number(ph)>=0 && Number(ph)<=14;
      const naohEqPerL = pct => ((CAL.naohDensity[pct]||CAL.naohDensity[30])*(pct/100)*1000)/CAL.PM_NAOH;
      const h2so4EqPerL = pct => (((CAL.h2so4Density[pct]||CAL.h2so4Density[98])*(pct/100)*1000)/CAL.PM_H2SO4)*2;

      function buildSelects(){
        $('naohPct').innerHTML = [10,20,30,40,50].map(v=>`<option value="${v}">${v}%</option>`).join('');
        $('h2so4Pct').innerHTML = [98,90,80,70,60,50,40,30].map(v=>`<option value="${v}">${v}%</option>`).join('');
        $('naohPct').value = state.chemicals.naohPct;
        $('h2so4Pct').value = state.chemicals.h2so4Pct;
      }

      function renderTabs(){ const flow=getFlow(); $('tabs').innerHTML = flow.map(id=>`<span class="tab ${currentScreen===id?'active':''}">${t(baseScreenLabels[id])}</span>`).join(''); }
      function renderI18n(){ document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n)); document.documentElement.lang = state.selectedLanguage; buildSelects(); renderTabs(); renderResults(); $('main-title').textContent=t('welcomeTitle'); $('main-description').textContent=t('welcomeDescription'); $('language-label').textContent=t('selectLanguageText'); $('welcomeNextButton').textContent=t('nextBtn'); $('langBtnEn').textContent=t('langEnglish'); $('langBtnEs').textContent=t('langSpanish'); $('langBtnKo').textContent=t('langKorean'); document.querySelectorAll('.language-button').forEach(b=>b.classList.toggle('active', b.dataset.lang===state.selectedLanguage)); $('taskReceptionBtn').textContent=t('taskReception'); $('taskConditioningBtn').textContent=t('taskConditioning'); [$('taskReceptionBtn'),$('taskConditioningBtn')].forEach(b=>b.classList.toggle('active', b.dataset.task===state.selectedTask)); $('modeChemBtn').textContent=t('modeChemicals'); $('modeEffBtn').textContent=t('modeEffluent'); [$('modeChemBtn'),$('modeEffBtn')].forEach(b=>b.classList.toggle('active', b.dataset.mode===state.neutralization.mode)); ['1','2'].forEach(i=>{ $('eff'+i+'KindAcid').textContent=t('acidic'); $('eff'+i+'KindBase').textContent=t('basic'); $('eff'+i+'KindAcid').classList.toggle('active', state.effluents[i-1].kind==='acid'); $('eff'+i+'KindBase').classList.toggle('active', state.effluents[i-1].kind==='base'); }); }

      function setError(msg){ $('screenError').textContent = msg; }
      function showScreen(id){ currentScreen=id; ['language','task','state','chemicals','results'].forEach(s=>$('screen-'+s).classList.toggle('active', s===id)); renderTabs(); $('btnBack').disabled=id==='language'; const inWelcome=id==='language'; $('tabs').style.display=inWelcome?'none':'flex'; $('globalNav').style.display=inWelcome?'none':'flex'; const reception = state.selectedTask==='Recepción de Efluentes'; $('effluentsTitle').style.display = reception ? 'block' : 'none'; $('effluentsBlock1').style.display = reception ? 'grid' : 'none'; $('effluentsBlock2').style.display = reception ? 'grid' : 'none'; setError(''); }
      function isScreenValid(id){
        if (id==='task' && !state.selectedTask) return setError(t('errSelectTask')), false;
        if (id==='state') {
          const {levelMm, volumeM3, pH} = state.tankState;
          if (!(levelMm>=0 && volumeM3>=0 && isValidPh(pH))) return setError(t('errTank')), false;
          if (state.selectedTask==='Recepción de Efluentes') { for (const ef of state.effluents) if (!(ef.volumeM3>=0 && isValidPh(ef.pH))) return setError(t('errPh')), false; }
        }
        if (id==='results' && state.neutralization.mode==='effluent' && !isValidPh(state.neutralization.referencePh)) return setError(t('invalidNeutralizerPh')), false;
        setError(''); return true;
      }

      function computeMixedState(){
        const tankL = m3ToL(state.tankState.volumeM3); let totalH = state.tankState.pH<7 ? hFromPh(state.tankState.pH)*tankL : 0; let totalOH = state.tankState.pH>7 ? ohFromPh(state.tankState.pH)*tankL : 0; let totalM3 = Number(state.tankState.volumeM3)||0;
        state.effluents.forEach(ef=>{ const l=m3ToL(ef.volumeM3); totalM3 += Number(ef.volumeM3)||0; if (ef.kind==='acid') totalH += hFromPh(ef.pH)*l; else totalOH += ohFromPh(ef.pH)*l; });
        const totalL = m3ToL(totalM3); let finalPh = 7;
        if (totalL>0){ if (totalH>totalOH) finalPh = -Math.log10(Math.max((totalH-totalOH)/totalL,1e-14)); else if (totalOH>totalH) finalPh = 14 + Math.log10(Math.max((totalOH-totalH)/totalL,1e-14)); }
        return { finalVolumeM3: totalM3, finalLevelMm: state.tankState.levelMm + m3ToMm(totalM3-state.tankState.volumeM3), finalPh: Math.min(14,Math.max(0,finalPh)), totalEffluentVolumeM3: Math.max(0,totalM3-state.tankState.volumeM3)};
      }

      function calculateNeutralization(){
        const task = state.selectedTask; let source = {volumeM3:state.tankState.volumeM3, levelMm:state.tankState.levelMm, pH:state.tankState.pH};
        if (task==='Recepción de Efluentes'){ const mix=computeMixedState(); Object.assign(state, {totalEffluentVolumeM3:mix.totalEffluentVolumeM3,totalLevelIncreaseMm:m3ToMm(mix.totalEffluentVolumeM3),finalLevelMm:mix.finalLevelMm,finalVolumeM3:mix.finalVolumeM3,finalPh:mix.finalPh}); source={volumeM3:mix.finalVolumeM3,levelMm:mix.finalLevelMm,pH:mix.finalPh}; }
        else { state.finalLevelMm=state.tankState.levelMm; state.finalVolumeM3=state.tankState.volumeM3; state.finalPh=state.tankState.pH; }
        const mode = task==='Acondicionamiento de la pileta' ? 'chemicals' : state.neutralization.mode;
        let equivalents=0,species='',requiredType='',requiredConcentration=null,referencePh=null,reagentEqPerL=0;
        if (Math.abs(source.pH-CAL.PH_TARGET)>=0.15){
          if (source.pH < CAL.PH_TARGET){ equivalents = hFromPh(source.pH)*m3ToL(source.volumeM3); species='H+'; if (mode==='effluent' && task==='Recepción de Efluentes'){ requiredType='LH'; referencePh=isValidPh(state.neutralization.referencePh)?Number(state.neutralization.referencePh):12.5; reagentEqPerL=ohFromPh(referencePh);} else {requiredType='NaOH'; requiredConcentration=Number(state.chemicals.naohPct); reagentEqPerL=naohEqPerL(requiredConcentration);} }
          else { equivalents = ohFromPh(source.pH)*m3ToL(source.volumeM3); species='OH-'; if (mode==='effluent' && task==='Recepción de Efluentes'){ requiredType='IX'; referencePh=isValidPh(state.neutralization.referencePh)?Number(state.neutralization.referencePh):1.5; reagentEqPerL=hFromPh(referencePh);} else {requiredType='H2SO4'; requiredConcentration=Number(state.chemicals.h2so4Pct); reagentEqPerL=h2so4EqPerL(requiredConcentration);} }
        }
        const requiredVolumeL = reagentEqPerL>0 ? equivalents/reagentEqPerL : 0;
        const requiredVolumeM3 = requiredVolumeL/1000;
        const levelIncreaseMm = m3ToMm(requiredVolumeM3);
        state.resultingTankState=source;
        state.neutralization={mode,requiredType,requiredConcentration,referencePh,equivalentsToNeutralize:equivalents,reagentEqPerL,requiredVolumeL,requiredVolumeM3,levelIncreaseMm,projectedFinalLevelMm:source.levelMm+levelIncreaseMm,species};
      }

      function renderResults(){
        calculateNeutralization();
        const task = state.selectedTask; const n = state.neutralization;
        $('modeBlock').style.display = task==='Recepción de Efluentes' ? 'block' : 'none';
        [$('modeChemBtn'),$('modeEffBtn')].forEach(b=>b.classList.toggle('active', b.dataset.mode===n.mode));
        const showNeutral = task==='Recepción de Efluentes' && n.mode==='effluent' && (n.requiredType==='LH' || n.requiredType==='IX');
        $('neutralizerPhField').style.display = showNeutral ? 'block' : 'none';
        if (showNeutral){ $('neutralizerPhLabel').textContent = n.requiredType==='LH' ? t('neutralizerPhLH') : t('neutralizerPhIX'); $('neutralizerPh').value = isValidPh(n.referencePh)?n.referencePh:(n.requiredType==='LH'?12.5:1.5); }

        $('stateSummary').innerHTML = task==='Recepción de Efluentes'
          ? `<div>${t('levelMm')}: <b>${fmt(state.finalLevelMm,2)}</b></div><div>${t('volumeM3')}: <b>${fmt(state.finalVolumeM3,3)}</b></div><div>${t('phLabel')}: <b>${fmt(state.finalPh,2)}</b></div>`
          : `<div>${t('levelMm')}: <b>${fmt(state.tankState.levelMm,2)}</b></div><div>${t('volumeM3')}: <b>${fmt(state.tankState.volumeM3,3)}</b></div><div>${t('phLabel')}: <b>${fmt(state.tankState.pH,2)}</b></div>`;

        $('methodSummary').innerHTML = `<div>${t('modeLabel')}: <b>${n.mode==='effluent'?t('modeEffluent'):t('modeChemicals')}</b></div><div>${t('methodCalc')}: <b>${t('stoichMethodText')} ${CAL.PH_TARGET}</b></div>`;
        $('reagentSummary').innerHTML = `<div>${t('typeLabel')}: <b>${n.requiredType||'-'}</b></div><div>${t('concentrationLabel')}: <b>${n.requiredConcentration?`${n.requiredConcentration}%`:'-'}</b></div><div>${t('referencePhLabel')}: <b>${n.referencePh!==null?fmt(n.referencePh,2):'-'}</b></div><div>Eq/L: <b>${fmt(n.reagentEqPerL,6)}</b></div>`;
        $('calcSummary').innerHTML = `<div>${t('species')}: <b>${n.species||'-'}</b></div><div>${t('eqNeutralize')}: <b>${fmt(n.equivalentsToNeutralize,6)} eq</b></div><div>${t('volumeLabel')}: <b>${fmt(n.requiredVolumeL,2)} L (${fmt(n.requiredVolumeM3,4)} m³)</b></div><div>${t('levelDeltaLabel')}: <b>${fmt(n.levelIncreaseMm,3)} mm</b></div><div>${t('projectedLevelLabel')}: <b>${fmt(n.projectedFinalLevelMm,3)} mm</b></div>${n.equivalentsToNeutralize===0?`<div class="warn">${t('nearNeutral')}</div>`:''}`;

        $('requiredKpi').textContent = `${fmt(n.requiredVolumeL,2)} L`;
        const over = n.projectedFinalLevelMm > CAL.TANK_MAX_MM;
        $('overflowWarn').style.display = over ? 'block' : 'none';
        $('overflowWarn').textContent = over ? t('overflow') : '';
      }

      function bind(){
        document.querySelectorAll('.language-button').forEach(btn=>btn.addEventListener('click',()=>{ state.selectedLanguage=btn.dataset.lang; renderI18n(); }));
        $('welcomeNextButton').addEventListener('click',()=>showScreen('task'));
        [$('taskReceptionBtn'),$('taskConditioningBtn')].forEach(btn=>btn.addEventListener('click',()=>{ state.selectedTask=btn.dataset.task; if(state.selectedTask==='Acondicionamiento de la pileta'){ state.effluents=[{volumeM3:0,pH:7,kind:'acid'},{volumeM3:0,pH:7,kind:'acid'}]; $('eff1Vol').value='0'; $('eff1Ph').value='7'; $('eff2Vol').value='0'; $('eff2Ph').value='7'; } renderI18n(); renderResults(); }));
        $('tankLevelMm').addEventListener('input', e=>{ state.tankState.levelMm=Number(e.target.value)||0; if(!$('tankVolumeM3').value) {state.tankState.volumeM3=mmToM3(state.tankState.levelMm); $('tankVolumeM3').value=fmt(state.tankState.volumeM3,3);} renderResults();});
        $('tankVolumeM3').addEventListener('input', e=>{ state.tankState.volumeM3=Number(e.target.value)||0; renderResults();});
        $('tankPh').addEventListener('input', e=>{ state.tankState.pH=Number(e.target.value)||7; renderResults();});
        ['1','2'].forEach(i=>{ $('eff'+i+'Vol').addEventListener('input',e=>{ state.effluents[i-1].volumeM3=Number(e.target.value)||0; renderResults();}); $('eff'+i+'Ph').addEventListener('input',e=>{ state.effluents[i-1].pH=Number(e.target.value)||7; renderResults();}); $('eff'+i+'KindAcid').addEventListener('click',()=>{ state.effluents[i-1].kind='acid'; renderI18n(); renderResults();}); $('eff'+i+'KindBase').addEventListener('click',()=>{ state.effluents[i-1].kind='base'; renderI18n(); renderResults();}); });
        $('naohPct').addEventListener('change',e=>{ state.chemicals.naohPct=Number(e.target.value); renderResults();});
        $('h2so4Pct').addEventListener('change',e=>{ state.chemicals.h2so4Pct=Number(e.target.value); renderResults();});
        [$('modeChemBtn'),$('modeEffBtn')].forEach(btn=>btn.addEventListener('click',()=>{ state.neutralization.mode=btn.dataset.mode; if (btn.dataset.mode==='effluent') state.neutralization.referencePh = state.finalPh<7?12.5:1.5; renderI18n(); renderResults();}));
        $('neutralizerPh').addEventListener('input',e=>{ state.neutralization.referencePh=Number(e.target.value); $('neutralizerPhError').textContent = isValidPh(state.neutralization.referencePh)?'':t('invalidNeutralizerPh'); renderResults();});
        $('btnHome').addEventListener('click',()=>showScreen('language'));
        $('btnBack').addEventListener('click',()=>{ const flow=getFlow(); const i=flow.indexOf(currentScreen); if(i>0) showScreen(flow[i-1]);});
        $('btnNext').addEventListener('click',()=>{ const flow=getFlow(); const i=flow.indexOf(currentScreen); if(!isScreenValid(currentScreen)) return; if(i<flow.length-1){ showScreen(flow[i+1]); if(flow[i+1]==='results') renderResults(); }});
      }

      function init(){
        bind(); renderI18n();
        $('tankLevelMm').value='0'; $('tankVolumeM3').value='0'; $('tankPh').value='7';
        $('eff1Vol').value='0'; $('eff1Ph').value='7'; $('eff2Vol').value='0'; $('eff2Ph').value='7';
        showScreen('language'); renderResults();
      }
      init();
    </script>
  </body>
</html>

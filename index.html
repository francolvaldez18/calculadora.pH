  <body>
    <main class="app-screen">
      <div class="background-image" aria-hidden="true"></div>
      <div class="background-logo" aria-hidden="true"></div>
      <div class="overlay" aria-hidden="true"></div>
      <img class="top-logo" alt="Logo POSCO" src="http://www.poscoargentina.com/public/images/xlogo-posco-argentina-1.png.pagespeed.ic.HsKLPImI1W.webp" onerror="this.onerror=null;this.src='POSCO_logo.svg';" />
      <section class="content">
        <div class="tabs" id="tabs"></div>

        <section class="screen" id="screen-language">
          <div class="welcome-main">
            <h2 id="main-title"></h2><p class="welcome-description" id="main-description"></p><p class="language-label" id="language-label"></p>
            <div class="language-buttons"><button class="language-button" id="langBtnEn" data-lang="en"></button><button class="language-button" id="langBtnEs" data-lang="es"></button><button class="language-button" id="langBtnKo" data-lang="ko"></button></div>
            <div class="welcome-actions"><button class="btn welcome-next" id="welcomeNextButton" type="button"></button></div>
          </div>
        </section>

        <section class="screen" id="screen-task"><h3 data-i18n="taskTitle"></h3><div class="choice-buttons"><button class="choice-button" id="taskReceptionBtn" data-task="Recepción de Efluentes" type="button"></button><button class="choice-button" id="taskConditioningBtn" data-task="Ajuste de pH" type="button"></button></div></section>

        <section class="screen" id="screen-state">
          <div class="top-row"><h3 data-i18n="tankTitleWWB"></h3><button class="btn" id="settingsBtn" type="button">⚙️ <span data-i18n="settingsBtn"></span></button></div>
          <div class="grid">
            <div class="field"><label data-i18n="levelMm"></label><input id="tankLevelMm" type="number" step="0.01" placeholder="1200 - 4000" /><div id="levelError" class="error"></div></div>
            <div class="field"><label data-i18n="phLabel"></label><input id="tankPh" type="number" step="0.01" placeholder="0 - 14" /><div id="phError" class="error"></div></div>
          </div>
          <div class="notice" id="estimatedVolume"></div><div class="notice" data-i18n="volumeHint"></div>
          <div class="settings-panel" id="settingsPanel">
            <h3 data-i18n="chemicalsOptionalTitle"></h3>
            <div class="grid"><div class="field"><label data-i18n="naohConcentration"></label><select id="naohPct"></select></div><div class="field"><label data-i18n="h2so4Concentration"></label><select id="h2so4Pct"></select></div></div>
          </div>
        </section>

        <section class="screen" id="screen-effluents">
          <div class="top-row"><h3 data-i18n="effluentsTitle"></h3><button class="btn" id="addEffluentBtn" type="button">+ <span data-i18n="addEffluent"></span></button></div>
          <div id="effluentList"></div>
        </section>

        <section class="screen" id="screen-neutralization">
          <h3 data-i18n="neutralizationMode"></h3>
          <div class="card" id="modeBlock" style="margin-top:10px;">
            <div class="field"><label data-i18n="targetPhLabel"></label><select id="targetPh"><option value="7">7.0</option><option value="8">8.0</option><option value="8.5">8.5</option></select></div>
            <div class="field" style="margin-top:8px;"><label data-i18n="modeLabel"></label><div class="choice-buttons mode-choices"><button class="choice-button" id="modeCombinedBtn" data-mode="combined" type="button"></button><button class="choice-button" id="modeEffBtn" data-mode="effluent" type="button"></button><button class="choice-button" id="modeChemBtn" data-mode="chemical" type="button"></button></div><div class="mode-hints" id="modeHints"></div></div>
            <div class="grid strategy-top" id="effluentConfig" style="margin-top:8px;">
              <div class="field"><label data-i18n="effluentNameLabel"></label><input id="effluentNameAuto" type="text" readonly /></div>
              <div class="field"><label data-i18n="effluentVolumeLabel"></label><select id="maxEffluentM3"><option value="5">5 m³</option><option value="10">10 m³</option><option value="15">15 m³</option><option value="20">20 m³</option><option value="25">25 m³</option><option value="30">30 m³</option></select></div>
              <div class="field"><label data-i18n="neutralizerPhLabel"></label><input id="neutralizerPh" type="number" min="0" max="14" step="0.01" placeholder="0 - 14" /><div id="neutralizerPhError" class="error"></div></div>
            </div>
            <div class="notice" id="modeCriterion"></div>
          </div>
        </section>

        <section class="screen" id="screen-results">
          <h3 data-i18n="resultsTitle"></h3>
          <div class="results-flow" id="receptionFlow"><div class="card"><h4 data-i18n="stateCard"></h4><div id="afterEffluentsSummary"></div></div><div class="card inverted-block" id="additionCard"><h4 id="additionTitle" data-i18n="stageAdditionTitle"></h4><div id="additionSummary"></div></div><div class="card"><h4 data-i18n="finalTankStateTitle"></h4><div id="finalAfterNeutralizationSummary"></div></div></div>
          <div class="notice" id="conditioningNote" style="display:none;"></div><div class="notice warn" id="overflowWarn" style="display:none;"></div>
        </section>

        <div class="nav" id="globalNav"><button class="btn" id="btnHome" data-i18n="homeBtn"></button><div class="nav-right"><button class="btn" id="btnBack" data-i18n="backBtn"></button><button class="btn" id="btnNext" data-i18n="nextBtn"></button></div></div>
        <div id="screenError" class="error"></div>
      </section>
      <div class="below-work-row">
        <div></div>
        <div class="flags-row" aria-hidden="true">
          <img class="flag-img" alt="Bandera de Corea del Sur" src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Flag_of_South_Korea.svg/960px-Flag_of_South_Korea.svg.png" />
          <img class="flag-img" alt="Bandera de Argentina" src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Flag_of_Argentina.svg/960px-Flag_of_Argentina.svg.png" />
        </div>
        <div class="developer-launch" id="developerLaunchWrap"><button class="developer-btn" id="developerBtn" type="button" data-i18n="developerBtn"></button></div>
      </div>
    </main>

    <div class="dev-modal" id="devModal" aria-hidden="true" role="dialog" aria-labelledby="devTitle">
      <div class="dev-dialog">
        <h4 id="devTitle" data-i18n="developerBtn"></h4>
        <p><strong>Valdez Franco Leonardo</strong></p>
        <p>POSCO LH Production Dept. - Utilities - Güemes - Salta - Argentina</p>
        <p>LinkedIn: <a href="https://www.linkedin.com/in/francolvaldez/" target="_blank" rel="noopener noreferrer">https://www.linkedin.com/in/francolvaldez/</a></p>
        <div class="dev-actions"><button class="btn" id="devCloseBtn" type="button" data-i18n="closeBtn"></button></div>
      </div>
    </div>

l:'등가 높이',recommendedLabel:'권장',notAvailableLabel:'사용 불가',notRecommendedLabel:'비권장',effluentAvailabilityLabel:'폐수 사용 가능 여부',effluentNameLabel:'폐수 이름',maxEffluentLabel:'최대 폐수 사용량',effluentVolumeLabel:'폐수 사용량',neutralizerPhLabel:'폐수 pH',targetPhLabel:'목표 pH',criteriaLabel:'권장 기준',yesLabel:'예',noLabel:'아니오',finalTankStateTitle:'최종 탱크 상태',effluentBlockTitle:'폐수',chemicalBlockTitle:'약품',intermediatePhLabel:'중간 pH',finalPhLabel:'최종 pH',additionCombinedTitle:'폐수 + 약품 투입',additionEffluentTitle:'폐수 투입',additionChemicalTitle:'약품 투입'}
      };

      const state={selectedLanguage:'es',selectedTask:'',tankState:{levelMm:NaN,volumeM3:0,pH:NaN},chemicals:{naohPct:30,h2so4Pct:98},effluents:[{name:'LH',volumeM3:0,pH:7}],neutralization:{mode:'chemicals',referencePh:12.5},neutralizationStrategy:{effluentAvailable:true,maxEffluentM3:10,recommendedMode:'combined',selectedMode:'combined',targetPh:7}};
      let currentScreen='language';
      const $=id=>document.getElementById(id); const t=k=>tr[state.selectedLanguage][k]??k; const fmt=(v,n=3)=>Number(v).toFixed(n); const num=(v,fb=NaN)=>{ if(typeof v==='number') return Number.isFinite(v)?v:fb; const n=Number(String(v).replace(',', '.').trim()); return Number.isFinite(n)?n:fb; };
      const mmToM3=mm=>(Number(mm)||0)*(CAL.MM_EQ_M3_DEN/CAL.MM_EQ_M3_NUM); const m3ToL=m3=>(Number(m3)||0)*1000; const m3ToMm=m3=>(Number(m3)||0)*(CAL.MM_EQ_M3_NUM/CAL.MM_EQ_M3_DEN);
      const hFromPh=ph=>Math.pow(10,-Math.min(14,Math.max(0,Number(ph)||0))); const ohFromPh=ph=>Math.pow(10,-(14-Math.min(14,Math.max(0,Number(ph)||0))));
      const naohEqPerL=pct=>((CAL.naohDensity[pct]||CAL.naohDensity[30])*(pct/100)*1000)/CAL.PM_NAOH; const h2so4EqPerL=pct=>(((CAL.h2so4Density[pct]||CAL.h2so4Density[98])*(pct/100)*1000)/CAL.PM_H2SO4)*2;
      const flow=()=>state.selectedTask==='Recepción de Efluentes'?['language','task','state','effluents','neutralization','results']:['language','task','state','neutralization','results'];

      function renderTabs(){ const m={language:'tabLanguage',task:'tabTask',state:'tabState',effluents:'tabEff',neutralization:'tabNeu',results:'tabRes'}; $('tabs').innerHTML=flow().map(s=>`<span class="tab ${s===currentScreen?'active':''}">${t(m[s])}</span>`).join(''); }
      function setError(msg){ $('screenError').textContent=msg; }
      function validateState(){
        const lRaw=$('tankLevelMm').value.trim(), pRaw=$('tankPh').value.trim();

        return lOk&&pOk;
      }
      function isValid(screen){

          const ix=Number(e.target.dataset.ix), f=e.target.dataset.f, raw=e.target.value;

          renderResults();

        $('effluentList').querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',()=>{ state.effluents.splice(Number(el.dataset.remove),1); renderEffluents(); renderNeutralization(); renderResults(); }));

      function calculateEqToNeutralize(ph, volumeL, targetPh=7){
        const p=Math.min(14,Math.max(0,Number(ph)||0)), target=Math.pow(10,-targetPh);
        if(p<targetPh) return {species:'H+', eq:Math.max((hFromPh(p)-target)*volumeL,0)};
        if(p>targetPh) return {species:'OH-', eq:Math.max((ohFromPh(p)-target)*volumeL,0)};
        return {species:'', eq:0};
      }
      function calculateEffluentEqPerL(ph, kind){ return kind==='LH'?ohFromPh(ph):hFromPh(ph); }

      function mixStreams(baseTank, effluents){
        let totalM3=Math.max(0,num(baseTank.volumeM3,0)), totalH=0, totalOH=0;
        const baseL=m3ToL(totalM3), basePh=Math.min(14,Math.max(0,num(baseTank.pH,7))); 
        if(basePh<7) totalH+=hFromPh(basePh)*baseL; else if(basePh>7) totalOH+=ohFromPh(basePh)*baseL;
        effluents.forEach(e=>{
          const vm3=Math.max(0,num(e.volumeM3,0)), eph=Math.min(14,Math.max(0,num(e.pH,7))), l=m3ToL(vm3);
          totalM3+=vm3;
          if(eph<7) totalH+=hFromPh(eph)*l; else if(eph>7) totalOH+=ohFromPh(eph)*l;
        });
        const totalL=m3ToL(totalM3);
        let ph=7;
        if(totalL>0){
          if(totalH>totalOH) ph=-Math.log10(Math.max((totalH-totalOH)/totalL,1e-14));
          else if(totalOH>totalH) ph=14+Math.log10(Math.max((totalOH-totalH)/totalL,1e-14));
        }
        return {volumeM3:totalM3, levelMm:num(baseTank.levelMm,0)+m3ToMm(totalM3-num(baseTank.volumeM3,0)), pH:Math.min(14,Math.max(0,ph))};
      }

      function calculateNeutralizationForState(srcState, options={}){
        const safetyFactor=num(options.safetyFactor,1.25)||1.25, pumpExtraM3=num(options.pumpExtraM3,0)||0, targetPh=num(options.targetPh,CAL.PH_TARGET)||CAL.PH_TARGET;
        const src={volumeM3:Math.max(0,num(srcState.volumeM3,0)), levelMm:Math.max(0,num(srcState.levelMm,0)), pH:Math.min(14,Math.max(0,num(srcState.pH,7)))};
        const {species,eq}=calculateEqToNeutralize(src.pH, m3ToL(src.volumeM3), targetPh);
        const mode=options.mode||'chemicals';
        let type='', conc=null, ref=null, eqL=0;
        if(species==='H+'){
          if(mode==='effluent'){ type='LH'; ref=Number.isFinite(num(options.referencePh))?num(options.referencePh):12.5; eqL=calculateEffluentEqPerL(ref,'LH'); }
          else { type='NaOH'; conc=num(state.chemicals.naohPct,30)||30; eqL=naohEqPerL(conc); }
        } else if(species==='OH-'){
          if(mode==='effluent'){ type='IX'; ref=Number.isFinite(num(options.referencePh))?num(options.referencePh):1.5; eqL=calculateEffluentEqPerL(ref,'IX'); }
          else { type='H2SO4'; conc=num(state.chemicals.h2so4Pct,98)||98; eqL=h2so4EqPerL(conc); }
        }
        const requiredVolumeTheoreticalL=(eq>0&&eqL>0)?(eq/eqL):0;
        const safeTheo=Number.isFinite(requiredVolumeTheoreticalL)&&requiredVolumeTheoreticalL>0?requiredVolumeTheoreticalL:0;
        const minimal=safeTheo<0.5;
        const requiredVolumeFinalL=safeTheo*safetyFactor;
        const requiredVolumeFinalM3=requiredVolumeFinalL/1000;
        const finalTankVolumeM3=Math.max(0,src.volumeM3+requiredVolumeFinalM3+pumpExtraM3);
        const finalTankLevelMm=Math.max(0,m3ToMm(finalTankVolumeM3));
        const finalPh=(species&&requiredVolumeFinalL>0)?targetPh:src.pH;
        const hasError=![src.volumeM3,src.levelMm,eq,eqL,requiredVolumeFinalL,finalTankVolumeM3,finalTankLevelMm].every(v=>Number.isFinite(v));
        return {src,mode,species,type,conc,ref,eqL:Math.max(eqL,0),eq:reqLteq(eq),reqL:requiredVolumeFinalL,reqM3:requiredVolumeFinalM3,dMm:m3ToMm(requiredVolumeFinalM3),proj:finalTankLevelMm,
          result:{targetPh,currentPh:src.pH,requiredType:type,requiredConcentration:conc,equivalentsToNeutralize:Math.max(eq,0),reagentEqPerL:Math.max(eqL,0),requiredVolumeTheoreticalL:safeTheo,requiredVolumeFinalL,requiredVolumeFinalM3,pumpExtraM3,finalTankVolumeM3,finalTankLevelMm,finalPh,minimal,hasError}};
      }
      function reqLteq(v){ return Math.max(num(v,0)||0,0); }

      function recommendMode(basePh, effluentAvailable){
        const p=Math.min(14,Math.max(0,num(basePh,7)));
        if(!effluentAvailable) return 'chemical';

      function getTargetPh(){ return num(state.neutralizationStrategy.targetPh,7)||7; }
      function getAutoEffluentName(ph){ return num(ph,7)<7?'LH':'IX'; }

      function estimatePhAfterCounterDose(srcPh, srcVolumeM3, species, counterEqPerL, addL){
        const baseL=m3ToL(srcVolumeM3);
        const totalL=Math.max(baseL+Math.max(addL,0),1e-9);
        let totalH=srcPh<7?hFromPh(srcPh)*baseL:0;
        let totalOH=srcPh>7?ohFromPh(srcPh)*baseL:0;
        const addEq=Math.max(counterEqPerL,0)*Math.max(addL,0);
        if(species==='H+') totalOH+=addEq;
        if(species==='OH-') totalH+=addEq;
        if(totalH>totalOH) return Math.min(14,Math.max(0,-Math.log10(Math.max((totalH-totalOH)/totalL,1e-14))));
        if(totalOH>totalH) return Math.min(14,Math.max(0,14+Math.log10(Math.max((totalOH-totalH)/totalL,1e-14))));
        return 7;
      }

      function calc(){
        const isConditioning=state.selectedTask==='Ajuste de pH';
        const targetPh=getTargetPh();
        if(isConditioning){
          const src={volumeM3:mmToM3(state.tankState.levelMm),levelMm:state.tankState.levelMm,pH:state.tankState.pH};
          const selectedMode=state.neutralizationStrategy.selectedMode;
          const refPh=Number.isFinite(num(state.neutralization.referencePh))?num(state.neutralization.referencePh):(src.pH<7?12.5:1.5);

          };
          state.neutralization={...state.neutralization,...final.result};
          return {...final,displayState:src,interState,effStep:effN,usedEffM3,usedEffL,chemAfter:chemN};
        }

        const mixed=state.selectedTask==='Recepción de Efluentes'?
          mixStreams({volumeM3:state.tankState.volumeM3,levelMm:state.tankState.levelMm,pH:state.tankState.pH},state.effluents):
          {volumeM3:state.tankState.volumeM3,levelMm:state.tankState.levelMm,pH:state.tankState.pH};
        const calcMode=strategyToCalcMode(state.neutralizationStrategy.selectedMode);
        const n=calculateNeutralizationForState(mixed,{mode:calcMode,safetyFactor:1.25,pumpExtraM3:0,referencePh:state.neutralization.referencePh,targetPh});
        state.neutralization={...state.neutralization,...n.result};
        return n;
      }

      function asMetricChips(items){ return `<div class="metric-chips">${items.map(i=>`<div class="metric-chip ${i.added?'added-chip':''}">${i.label}<b>${i.value}</b></div>`).join('')}</div>`; }

      function renderNeutralization(){
        const isReception=state.selectedTask==='Recepción de Efluentes';
        const base=isReception?
          mixStreams({volumeM3:state.tankState.volumeM3,levelMm:state.tankState.levelMm,pH:state.tankState.pH},state.effluents):
          {volumeM3:mmToM3(state.tankState.levelMm),levelMm:state.tankState.levelMm,pH:state.tankState.pH};
        const basePh=num(base.pH,7);
        state.neutralizationStrategy.recommendedMode=recommendMode(basePh,true);
        const selectedMode=state.neutralizationStrategy.selectedMode;
        $('effluentNameAuto').value=getAutoEffluentName(basePh);
        if(!Number.isFinite(num(state.neutralization.referencePh))){ state.neutralization.referencePh=basePh<7?12:1.5; } $('neutralizerPh').value=Number.isFinite(num(state.neutralization.referencePh))?String(state.neutralization.referencePh):'';
        $('effluentConfig').style.display=(selectedMode==='chemical')?'none':'grid'; $('neutralizerPh').disabled=(selectedMode==='chemical');
        [$('modeCombinedBtn'),$('modeEffBtn'),$('modeChemBtn')].forEach(b=>b.classList.toggle('active',b.dataset.mode===selectedMode));
        $('modeHints').innerHTML=[{mode:'combined'},{mode:'effluent'},{mode:'chemical'}].map(x=>{ const rec=x.mode===state.neutralizationStrategy.recommendedMode; const txt=rec?t('recommendedLabel'):t('notRecommendedLabel'); const cls=rec?'recommended':''; return `<div class="mode-hint ${cls}">${txt}</div>`; }).join('');
        $('modeCriterion').textContent=`${t('criteriaLabel')}: ${t(state.neutralizationStrategy.recommendedMode==='combined'?'modeCombined':state.neutralizationStrategy.recommendedMode==='effluent'?'modeEffluent':'modeChemical')}`;
      }

      function renderResults(){
        const n=calc();
        const isConditioning=state.selectedTask==='Ajuste de pH';
        const initialLevel=num(state.tankState.levelMm,0), initialM3=mmToM3(initialLevel), initialPh=num(state.tankState.pH,7);

        if(n.result.hasError){
          $('afterEffluentsSummary').innerHTML=`<div class='warn'>${t('calcError')}</div>`;
          $('additionSummary').innerHTML='';
          $('finalAfterNeutralizationSummary').innerHTML='';
          return;
        }

        $('afterEffluentsSummary').innerHTML=asMetricChips([{label:t('levelMm'),value:`${fmt(initialLevel,2)} mm`},{label:t('volumeLabel'),value:`${fmt(initialM3,3)} m³`},{label:t('phLabel'),value:fmt(initialPh,2)}]);

        const selectedMode=state.neutralizationStrategy.selectedMode;
        $('additionTitle').textContent=t(selectedMode==='combined'?'additionCombinedTitle':selectedMode==='effluent'?'additionEffluentTitle':'additionChemicalTitle');
        if(isConditioning && selectedMode==='combined' && n.chemAfter){
          const effType=(n.effStep&&n.effStep.result&&n.effStep.result.requiredType)||getAutoEffluentName(initialPh);
          const chemType=(n.chemAfter.result&&n.chemAfter.result.requiredType)||'-';
          const interPh=(n.interState&&n.interState.pH)||initialPh;
          $('additionSummary').innerHTML=`<div class="combined-split"><div class="card"><h4>${t('effluentBlockTitle')}</h4>${asMetricChips([{label:t('typeLabel'),value:effType},{label:t('volumeLabel'),value:`${fmt(n.usedEffM3||0,3)} m³`,added:true},{label:t('intermediatePhLabel'),value:fmt(interPh,2)}])}</div><div class="plus-center">+</div><div class="card"><h4>${t('chemicalBlockTitle')}</h4>${asMetricChips([{label:t('typeLabel'),value:chemType},{label:t('volumeLabel'),value:`${fmt(n.chemAfter.result.requiredVolumeFinalL,2)} L`,added:true},{label:t('finalPhLabel'),value:fmt(n.result.finalPh,2)}])}</div></div>`;
        } else if(selectedMode==='effluent'){
          $('additionSummary').innerHTML=asMetricChips([{label:t('typeLabel'),value:n.result.requiredType||getAutoEffluentName(initialPh)},{label:t('effluentVolumeLabel'),value:`${fmt(n.reqM3,3)} m³`,added:true},{label:t('intermediatePhLabel'),value:fmt(n.result.finalPh,2)}]);
        } else {
          $('additionSummary').innerHTML=asMetricChips([{label:t('typeLabel'),value:n.result.requiredType||'-'},{label:t('volumeLabel'),value:`${fmt(n.result.requiredVolumeFinalL,2)} L`,added:true},{label:t('finalPhLabel'),value:fmt(n.result.finalPh,2)}]);
        }

        $('finalAfterNeutralizationSummary').innerHTML=asMetricChips([{label:t('levelMm'),value:`${fmt(n.result.finalTankLevelMm,2)} mm`},{label:t('volumeLabel'),value:`${fmt(n.result.finalTankVolumeM3,3)} m³`},{label:t('phLabel'),value:fmt(n.result.finalPh,2)}]);
        $('conditioningNote').style.display=isConditioning?'block':'none';
        $('conditioningNote').textContent=t('conditioningPumpNote');
        $('overflowWarn').style.display=n.result.finalTankLevelMm>CAL.TANK_MAX_MM?'block':'none';
        $('overflowWarn').textContent=n.result.finalTankLevelMm>CAL.TANK_MAX_MM?t('overflow'):'';
      }

      function buildSelects(){ $('naohPct').innerHTML=[10,20,30,40,50].map(v=>`<option value='${v}'>${v}%</option>`).join(''); $('h2so4Pct').innerHTML=[98,90,80,70,60,50,40,30].map(v=>`<option value='${v}'>${v}%</option>`).join(''); $('naohPct').value=state.chemicals.naohPct; $('h2so4Pct').value=state.chemicals.h2so4Pct; }
      function renderI18n(){ document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n)); document.documentElement.lang=state.selectedLanguage; buildSelects(); renderTabs(); $('main-title').textContent=t('welcomeTitle'); $('main-description').textContent=t('welcomeDescription'); $('language-label').textContent=t('selectLanguageText'); $('welcomeNextButton').textContent=t('nextBtn'); $('langBtnEn').textContent=t('langEnglish'); $('langBtnEs').textContent=t('langSpanish'); $('langBtnKo').textContent=t('langKorean'); document.querySelectorAll('.language-button').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.selectedLanguage)); $('taskReceptionBtn').textContent=t('taskReception'); $('taskConditioningBtn').textContent=t('taskConditioning'); [$('taskReceptionBtn'),$('taskConditioningBtn')].forEach(b=>b.classList.toggle('active',b.dataset.task===state.selectedTask)); $('modeCombinedBtn').textContent=t('modeCombined'); $('modeEffBtn').textContent=t('modeEffluent'); $('modeChemBtn').textContent=t('modeChemical'); $('maxEffluentM3').value=String(state.neutralizationStrategy.maxEffluentM3); $('targetPh').value=String(state.neutralizationStrategy.targetPh||7); if($('tankLevelMm').value.trim()!==''||$('tankPh').value.trim()!==''){ validateState(); } else { $('levelError').textContent=''; $('phError').textContent=''; $('estimatedVolume').textContent=t('estimatedVolume').replace('{value}','--'); $('tankLevelMm').classList.remove('input-invalid'); $('tankPh').classList.remove('input-invalid'); } renderEffluents(); renderNeutralization(); renderResults(); }

      function bind(){
        document.querySelectorAll('.language-button').forEach(btn=>btn.addEventListener('click',()=>{state.selectedLanguage=btn.dataset.lang;renderI18n();}));
        $('welcomeNextButton').addEventListener('click',()=>show('task'));
        [$('taskReceptionBtn'),$('taskConditioningBtn')].forEach(btn=>btn.addEventListener('click',()=>{state.selectedTask=btn.dataset.task; renderI18n();}));
        $('settingsBtn').addEventListener('click',()=>$('settingsPanel').classList.toggle('open'));
        $('tankLevelMm').addEventListener('input',()=>{validateState(); $('btnNext').disabled=currentScreen==='state'?!validateState():false; renderNeutralization(); renderResults();});
        $('tankPh').addEventListener('input',()=>{validateState(); $('btnNext').disabled=currentScreen==='state'?!validateState():false; renderNeutralization(); renderResults();});
        $('addEffluentBtn').addEventListener('click',()=>{state.effluents.push({name:'LH',volumeM3:0,pH:7}); renderEffluents(); renderNeutralization(); renderResults();});
        $('naohPct').addEventListener('change',e=>{state.chemicals.naohPct=Number(e.target.value); renderResults();});
        $('h2so4Pct').addEventListener('change',e=>{state.chemicals.h2so4Pct=Number(e.target.value); renderResults();});
        [$('modeCombinedBtn'),$('modeEffBtn'),$('modeChemBtn')].forEach(btn=>btn.addEventListener('click',()=>{ state.neutralizationStrategy.selectedMode=btn.dataset.mode; renderNeutralization(); renderResults(); })); $('maxEffluentM3').addEventListener('change',e=>{ state.neutralizationStrategy.maxEffluentM3=num(e.target.value,10); renderResults(); }); $('targetPh').addEventListener('change',e=>{ state.neutralizationStrategy.targetPh=num(e.target.value,7); renderResults(); });
        $('neutralizerPh').addEventListener('input',e=>{state.neutralization.referencePh=num(e.target.value); $('neutralizerPhError').textContent=(state.neutralization.referencePh>=0&&state.neutralization.referencePh<=14)?'':t('invalidNeutralizerPh'); renderNeutralization(); renderResults();});
        $('developerBtn').addEventListener('click',()=>$('devModal').classList.add('open'));
        $('devCloseBtn').addEventListener('click',()=>$('devModal').classList.remove('open'));
        $('devModal').addEventListener('click',e=>{ if(e.target.id==='devModal') $('devModal').classList.remove('open'); });
        $('btnHome').addEventListener('click',()=>show('language'));
        $('btnBack').addEventListener('click',()=>{const f=flow();const i=f.indexOf(currentScreen);if(i>0)show(f[i-1]);});
        $('btnNext').addEventListener('click',()=>{const f=flow();const i=f.indexOf(currentScreen);if(!isValid(currentScreen))return;if(i<f.length-1){show(f[i+1]);if(f[i+1]==='results')renderResults();}});
      }


      function show(id){
        currentScreen=id;
        ['language','task','state','effluents','neutralization','results'].forEach(scr=>$('screen-'+scr).classList.toggle('active',scr===id));
        $('btnBack').disabled=id==='language';
        const hide=id==='language';
        $('tabs').style.display=hide?'none':'flex';
        $('globalNav').style.display=hide?'none':'flex';
        $('developerLaunchWrap').style.display=id==='language'?'flex':'none';
        if(id!=='language') $('devModal').classList.remove('open');
        renderTabs();
        if(id==='state'){
          const hasAny=$('tankLevelMm').value.trim()!==''||$('tankPh').value.trim()!=='';
          $('btnNext').disabled=hasAny?!validateState():true;
          if(!hasAny){
            $('levelError').textContent=''; $('phError').textContent='';
            $('tankLevelMm').classList.remove('input-invalid'); $('tankPh').classList.remove('input-invalid');
          }
        } else if(id==='neutralization'){
          renderNeutralization();
          $('btnNext').disabled=false;
        } else {
          $('btnNext').disabled=false;
        }
      }

      function init(){ state.tankState.volumeM3=0; $('tankLevelMm').value=''; $('tankPh').value=''; bind(); renderI18n(); show('language'); verifyKnownCases(); }

      function verifyKnownCases(){
        const c1=calculateNeutralizationForState({volumeM3:mmToM3(2000),levelMm:2000,pH:12.5},{mode:'chemicals',safetyFactor:1.25,pumpExtraM3:2.5});
        const c2=calculateNeutralizationForState({volumeM3:mmToM3(3810),levelMm:3810,pH:2.45},{mode:'chemicals',safetyFactor:1.25,pumpExtraM3:2.5});
        console.info('check_case_1_H2SO4_L', fmt(c1.result.requiredVolumeFinalL,2));
        console.info('check_case_2_NaOH_L', fmt(c2.result.requiredVolumeFinalL,2));
      }
      init();
    </script>
  </body>
</html>
